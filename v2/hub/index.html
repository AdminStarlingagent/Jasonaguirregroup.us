<script>/* ---- calls.js ---- */
{
/* calls module (Builder B): one-click call bar, call list, texting, composer, voicemail drop, incoming calls.
   Defines H.call, H.callList, H.sendText, H.compose, H.voicemailDrop, H.incomingCall. Classes prefixed cl-. */
const CL = H._cl = { call:null, list:null, n:0, ac:null, ring:null, tick:null, inc:null };
H.pendingTexts = H.pendingTexts || [];   /* texts inside their 5-second Undo window (the inbox shows them faded) */
H.lolaDrafts = H.lolaDrafts || [];       /* Lola's follow-up texts waiting for a person to tap Enviar */
const T = H.t, E = H.esc;
const MIN = 6e4, HOUR = 36e5, DAYMS = 864e5;
const first = c => (c && c.first) || T('cliente','client');
const meFirst = () => H.me().name.split(' ')[0];
const cl = (es, en, c) => (c && c.lang === 'en') ? en : es;   /* text in the CLIENT's language */
const mmss = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(Math.floor(s%60)).padStart(2,'0');
const lineLabel = l => l === 'team' ? T('Línea del equipo','Team line') + ' ' + H.TEAM_LINE : T('Mi número del Hub','My Hub number') + ' ' + ((H.user(l) || H.me()).line);
const cAv = c => `<span class="av cl-cav">${E(c ? H.initials(c) : '?')}</span>`;

/* ---------- ringing tone (WebAudio, started from the click) ---------- */
function audio(){ try { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; if (!CL.ac) CL.ac = new AC(); if (CL.ac.state === 'suspended') CL.ac.resume(); return CL.ac; } catch(e){ return null; } }
function ringStart(kind){ ringStop(); try { const ac = audio(); if (!ac) return; const m = ac.createGain(); m.gain.value = CL.call && CL.call.ringOff ? 0 : 1; m.connect(ac.destination);
  const g = ac.createGain(); g.gain.value = 0; g.connect(m); const f = kind === 'in' ? [880, 1100] : [440, 480];
  const os = f.map(hz => { const o = ac.createOscillator(); o.frequency.value = hz; o.connect(g); o.start(); return o; });
  const t = ac.currentTime + .05, on = kind === 'in' ? .9 : 1.6, gap = kind === 'in' ? 1.4 : 3;
  for (let i = 0; i < 12; i++){ g.gain.setValueAtTime(.05, t + i*gap); g.gain.setValueAtTime(0, t + i*gap + on); }
  CL.ring = { os, m }; } catch(e){} }
function ringStop(){ try { if (CL.ring){ CL.ring.os.forEach(o => o.stop()); CL.ring.m.disconnect(); } } catch(e){} CL.ring = null; }
function ringMute(off){ try { if (CL.ring) CL.ring.m.gain.value = off ? 0 : 1; } catch(e){} }

/* ---------- dock (call bar + list strip) fixed above the phone bottom bar ---------- */
function dock(){ let d = document.getElementById('cl-dock');
  if (!d){ d = document.createElement('div'); d.id = 'cl-dock'; d.className = 'cl-dock'; d.setAttribute('role','region'); d.setAttribute('aria-label', 'Llamada'); document.body.appendChild(d);
    d.addEventListener('click', onDock); d.addEventListener('input', e => { if (e.target.matches('[data-cl-notes]') && CL.call) CL.call.notes = e.target.value; });
    try { new ResizeObserver(size).observe(d); } catch(e){} }
  return d; }
function size(){ const d = document.getElementById('cl-dock'); const h = d && d.firstElementChild ? d.offsetHeight : 0;
  document.body.classList.toggle('cl-on', h > 0); document.documentElement.style.setProperty('--cl-bh', h + 'px'); }
const active = () => CL.call && ['ringing','connected','vm','dropping'].includes(CL.call.phase);

function renderDock(){ const d = dock(); let h = '';
  if (CL.list && !CL.list.done) h += listStrip();
  if (CL.call){ const k = CL.call;
    if (k.later) h += `<div class="cl-panel cl-later"><b>${T('¿Cuándo le volvemos a llamar?','When should we call again?')}</b><div class="cl-row">${LATER().map((o,i) => `<button class="btn btn-sm" type="button" data-cl="later-${i}">${H.icon('clock')}${E(o.label)}</button>`).join('')}<button class="btn btn-sm btn-ghost" type="button" data-cl="later-x">${T('Cancelar','Cancel')}</button></div></div>`;
    if (k.pad) h += `<div class="cl-panel cl-pad"><div class="cl-padv" aria-live="polite">${E(k.dtmf || ' ')}</div>${'123456789*0#'.split('').map(x => `<button type="button" data-cl="key-${x}">${x}</button>`).join('')}</div>`;
    if (k.notesOpen) h += `<div class="cl-panel"><label class="cl-nl" for="cl-notes">${T('Notas rápidas (Lola las usa en el resumen)','Quick notes (Lola uses them in the summary)')}</label><textarea id="cl-notes" data-cl-notes rows="2" placeholder="${T('Ej.: quiere 3 recámaras, cobra cada 15 días…','E.g.: wants 3 bedrooms, paid every 2 weeks…')}">${E(k.notes)}</textarea></div>`;
    h += bar(k); }
  d.innerHTML = h; size(); }

function bar(k){ const c = H.client(k.cid), name = c ? H.name(c) : T('Número desconocido','Unknown number');
  const b = (act, icon, label, cls='', on=false) => `<button class="cl-b ${cls} ${on?'cl-onb':''}" type="button" data-cl="${act}" ${on?'aria-pressed="true"':''}>${H.icon(icon)}<span>${label}</span></button>`;
  let st = '', acts = '', hint = '', end = '';
  const core = b('mute','mic', k.muted ? T('Silenciado','Muted') : T('Silenciar','Mute'), '', k.muted) + b('pad','grid', T('Teclado','Keypad'), '', k.pad) + b('screen','doc', T('Evaluación','Screening')) + b('notes','note', T('Notas','Notes'), '', k.notesOpen);
  const na = b('noanswer','x', T('No contestó','No answer')), vm = b('vm','voicemail', T('Dejar buzón','Leave voicemail')), hang = b('hang','hangup', T('Colgar','Hang up'), 'cl-hang');
  if (k.phase === 'ringing'){
    st = `<span class="cl-st"><i class="cl-pulse"></i>${k.inbound ? T('Conectando…','Connecting…') : T('Llamando…','Calling…')}</span>
      <span class="cl-sim">${T('Simular','Simulate')}: <button type="button" data-cl="sim-yes">${T('contestó','answered')}</button> · <button type="button" data-cl="sim-no">${T('no contestó','no answer')}</button></span>`;
    acts = b('ring','bell', k.ringOff ? T('Timbre apagado','Ring off') : T('Timbre','Ring'), '', k.ringOff) + core + na + vm; end = hang;
  } else if (k.phase === 'connected'){
    st = `<span class="cl-st cl-live"><i class="cl-rec"></i>${T('Grabando','Recording')} · <b class="cl-timer">${mmss((Date.now() - k.tc)/1000)}</b></span>`;
    hint = T('Recuerde decirle al cliente que la llamada se graba.','Remember to tell the client the call is recorded.');
    acts = core + na + vm; end = hang;
  } else if (k.phase === 'vm'){
    st = `<span class="cl-st">${H.icon('voicemail')}${T('No contestó · está sonando su buzón','No answer · their voicemail picked up')}</span>`;
    hint = T('Un toque deja su mensaje grabado.','One tap leaves your recorded message.');
    acts = b('vm','voicemail', T('Dejar buzón','Leave voicemail'), 'cl-pri') + na + b('notes','note', T('Notas','Notes'), '', k.notesOpen); end = hang;
  } else if (k.phase === 'dropping'){
    st = `<span class="cl-st"><i class="cl-pulse"></i>${T('Dejando su mensaje grabado…','Leaving your recorded message…')}</span>`;
  } else if (k.phase === 'after'){
    st = `<span class="cl-st cl-done">${H.icon('check')}${k.outcome === 'voicemail' ? T('Buzón dejado · guardado en el historial','Voicemail left · saved to history') : k.outcome === 'talked' ? T('Llamada terminada','Call ended') : T('No contestó · guardado en el historial','No answer · saved to history')}</span>`; hint = k.laterTxt || '';
    acts = c ? b('laterOpen','clock', T('Llamar después','Call later')) + b('text','chat', T('Mandar texto','Send text')) : ''; end = CL.list && !CL.list.done ? '' : b('close','x', T('Cerrar','Close'));
  }
  return `<div class="cl-bar cl-ph-${k.phase}">
    <div class="cl-who">${cAv(c)}<div class="cl-id">${c ? `<button class="cl-name" type="button" data-cl="open">${E(name)}</button>` : `<b class="cl-name">${E(name)}</b>`}
      <span class="cl-num">${E(k.phone)} · ${k.inbound ? T('Entrante','Incoming') : T('Desde','From')} ${E(k.from === 'team' ? H.TEAM_LINE : H.me().line)}</span></div></div>
    <div class="cl-state">${st}${hint ? `<span class="cl-hint">${E(hint)}</span>` : ''}</div>${acts ? `<div class="cl-acts">${acts}</div>` : ''}${end ? `<div class="cl-end">${end}</div>` : ''}</div>`;
}

/* ---------- placing a call ---------- */
H.call = (clientId, o = {}) => {
  const c = H.client(clientId); const phone = o.phone || (c && c.phone);
  if (!phone){ H.toast(T('Este cliente no tiene teléfono. Agréguelo en su perfil.','This client has no phone. Add it on their profile.')); return; }
  if (active()){ H.toast(T('Termine la llamada actual primero.','Finish the current call first.')); return; }
  audio(); start(c ? c.id : null, { phone, ...o });
};
function start(cid, o){
  clearInterval(CL.tick); clearTimeout(CL.phaseT);
  const c = H.client(cid);
  CL.n++;
  const k = CL.call = { cid, phone:o.phone || (c && c.phone) || '', from: o.from || (c && c.thread.length && c.thread.filter(m => m.ch === 'text').slice(-1)[0]?.line === 'team' ? 'team' : H.me().id),
    phase: o.inbound ? 'connected' : 'ringing', t0: Date.now(), tc: o.inbound ? Date.now() : 0, muted:false, ringOff:false, notes:'', dtmf:'', inbound: !!o.inbound,
    willAnswer: CL.n % 2 === 1 };  /* prototype: calls alternate answered / not answered; "Simular" forces it */
  if (k.phase === 'ringing'){ ringStart(); CL.phaseT = setTimeout(() => settle(k.willAnswer), 3200); }
  else startTimer();
  renderDock();
}
function startTimer(){ clearInterval(CL.tick); CL.tick = setInterval(() => { const el = document.querySelector('#cl-dock .cl-timer'); if (el && CL.call) el.textContent = mmss((Date.now() - CL.call.tc)/1000); }, 1000); }
function settle(answer){ const k = CL.call; if (!k || k.phase !== 'ringing') return; clearTimeout(CL.phaseT); ringStop();
  if (answer){ k.phase = 'connected'; k.tc = Date.now(); startTimer(); } else k.phase = 'vm';
  renderDock(); }

function logNoAnswer(k){ const c = H.client(k.cid); if (!c) return;
  H.log(c.id, { type:'call', dur: Math.round((Date.now() - k.t0)/1000), outcome:'noanswer', recording:false, text:{ es:'Llamada · No contestó', en:'Call · No answer' } }); }
function noAnswer(){ const k = CL.call; if (!k) return; clearTimeout(CL.phaseT); ringStop(); clearInterval(CL.tick);
  logNoAnswer(k); k.phase = 'after'; k.outcome = 'noanswer'; renderDock(); listNext('noanswer'); }

H.voicemailDrop = (clientId) => {
  const c = H.client(clientId); if (!c) return;
  const k = CL.call;
  const save = () => { H.log(c.id, { type:'call', dur: k && k.cid == c.id ? Math.round((Date.now() - k.t0)/1000) : 30, outcome:'voicemail', recording:false, text:{ es:'Llamada · No contestó · se le dejó el mensaje grabado de ' + H.me().name + ' en su buzón', en:'Call · No answer · left ' + H.me().name + '\'s recorded voicemail' } }); H.touch(c.id); };
  if (k && k.cid == c.id && active()){
    clearTimeout(CL.phaseT); ringStop(); clearInterval(CL.tick); k.phase = 'dropping'; renderDock();
    CL.phaseT = setTimeout(() => { save(); k.phase = 'after'; k.outcome = 'voicemail'; renderDock(); listNext('voicemail'); }, 1800);
  } else { save(); H.toast(T('Se dejó su mensaje grabado en el buzón','Your recorded voicemail was left')); }
};

function hangUp(){ const k = CL.call; if (!k) return;
  if (k.phase === 'ringing' || k.phase === 'vm') return noAnswer();
  if (k.phase !== 'connected') return;
  clearInterval(CL.tick); ringStop();
  const dur = Math.max(1, Math.round((Date.now() - k.tc)/1000)); const c = H.client(k.cid);
  if (!c){ CL.call = null; renderDock(); H.toast(T('Llamada terminada · número nuevo','Call ended · new number'), { label:T('Agregar como cliente','Add as client'), fn: () => H.newContact(k.phone) }, 8000); return; }
  const sum = summary(c, k, 'talked', dur);
  const entry = H.log(c.id, { type:'call', dur, outcome:'talked', result:'talked', recording:true, transcript: transcript(c), dir: k.inbound ? 'in' : 'out', text:{ es:'Llamada grabada (' + mmss(dur) + ') · Resumen de Lola: ' + sum.es, en:'Recorded call (' + mmss(dur) + ') · Lola\'s summary: ' + sum.en } });
  H.touch(c.id);
  if (CL.list && !CL.list.done){ k.phase = 'after'; k.outcome = 'talked'; CL.list.res[c.id] = 'talked'; renderDock(); } else { CL.call = null; renderDock(); }
  postCall(c, k, dur, entry);
}

/* ---------- Lola: summary, transcript, follow-up text, next step ---------- */
const RESULTS = [ ['talked','Hablamos','We talked'], ['homes','Quiere ver casas','Wants to see homes'], ['apply','Va a llenar la solicitud','Will fill out the application'], ['later','Llamar después','Call later'], ['nointerest','No le interesa','Not interested'] ];
function summary(c, k, res, dur){
  const inc = c.incomeMonthly || 0, debt = c.debtsMonthly || 0, dti = inc ? Math.round(debt / inc * 100) : 0, yr = inc * 12, area = c.areas[0] || 'Houston';
  const meets = yr >= 50000 && dti <= 45;
  const r = RESULTS.find(x => x[0] === res) || RESULTS[0];
  const es = `Hablaron ${Math.max(1, Math.round(dur/60))} min. ${first(c)} busca casa en ${area}` + (c.budget ? ` de hasta ${H.fmt.k(c.budget)}` : '') + '. ' +
    (inc ? `Gana aprox. ${H.fmt.price(inc)} al mes (${H.fmt.k(yr)} al año) y paga ${H.fmt.price(debt)} de deudas: ${dti}% de su ingreso. ${meets ? 'Sí llega a la meta del equipo ($50K al año y 45% o menos).' : 'Todavía no llega a la meta del equipo ($50K al año y 45% o menos)' + (c.coBorrower ? '; puede sumar a su ' + c.coBorrower.rel.es + '.' : '.')}` : 'Falta saber su ingreso.') +
    ` Resultado: ${r[1]}.` + (k.notes ? ` Sus notas: "${k.notes}".` : '');
  const en = `Talked ${Math.max(1, Math.round(dur/60))} min. ${first(c)} wants a home in ${area}` + (c.budget ? ` up to ${H.fmt.k(c.budget)}` : '') + '. ' +
    (inc ? `Earns about ${H.fmt.price(inc)} a month (${H.fmt.k(yr)} a year) and pays ${H.fmt.price(debt)} in debts: ${dti}% of income. ${meets ? 'Meets the team goal ($50K a year and 45% or less).' : 'Not yet at the team goal ($50K a year and 45% or less)' + (c.coBorrower ? '; can add their ' + c.coBorrower.rel.en + '.' : '.')}` : 'Income still unknown.') +
    ` Result: ${r[2]}.` + (k.notes ? ` Your notes: "${k.notes}".` : '');
  return { es, en };
}
function transcript(c){ const a = meFirst(), f = first(c), area = c.areas[0] || 'Houston', inc = H.fmt.price(c.incomeMonthly || 3500);
  const L = c.lang === 'en'
    ? [['A',`Hi, is this ${f}? This is ${a} with the Jason Aguirre Group. Just so you know, this call is recorded.`],['C','Yes, hi. Thanks for calling.'],['A',`I saw you're looking for a home in ${area}. How many bedrooms do you need?`],['C','Three, with a yard for the kids.'],['A','Great. About how much do you earn a month, together with your partner?'],['C',`Around ${inc} a month.`],['A','Good. The next step is the application in the JAG Homes app, it takes about 10 minutes. I\'ll text you the link.'],['C','Okay, I\'ll do it today.']]
    : [['A',`Hola, ¿hablo con ${f}? Le habla ${a} de Jason Aguirre Group. Le comento que la llamada se graba.`],['C','Sí, soy yo. Gracias por llamar.'],['A',`Vi que está buscando casa en ${area}. ¿Cuántas recámaras necesita?`],['C','Unas tres, y que tenga patio para los niños.'],['A','Perfecto. ¿Más o menos cuánto gana al mes, junto con su pareja?'],['C',`Como ${inc} al mes.`],['A','Muy bien. El siguiente paso es la solicitud en la app JAG Homes; toma unos 10 minutos. Le mando el enlace por texto.'],['C','Va, hoy mismo la lleno.']];
  return L.map(([w, t]) => (w === 'A' ? T('Agente','Agent') : T('Cliente','Client')) + ': ' + t).join('\n'); }
function followUp(c, res){ const f = first(c), a = meFirst(), area = c.areas[0] || 'Houston', sig = ' – ' + a + ', Jason Aguirre Group';
  const M = { talked:[`Hola ${f}, gracias por la llamada. Como quedamos, el siguiente paso es la solicitud en la app JAG Homes (unos 10 minutos). Cualquier duda aquí estoy.`, `Hi ${f}, thanks for the call. As we said, the next step is the application in the JAG Homes app (about 10 minutes). Any questions, I'm here.`],
    homes:[`Hola ${f}, gracias por la llamada. Hoy le mando casas en ${area}${c.budget ? ' hasta ' + H.fmt.k(c.budget) : ''}. ¿Le queda bien el sábado para ir a verlas?`, `Hi ${f}, thanks for the call. I'll send you homes in ${area}${c.budget ? ' up to ' + H.fmt.k(c.budget) : ''} today. Does Saturday work to go see them?`],
    apply:[`Hola ${f}, aquí le dejo el paso que platicamos: abra la app JAG Homes y toque "Solicitud". Toma unos 10 minutos. Mañana le marco para ver cómo le fue.`, `Hi ${f}, here's the step we talked about: open the JAG Homes app and tap "Application". It takes about 10 minutes. I'll call you tomorrow to see how it went.`],
    later:[`Hola ${f}, gracias por su tiempo. Le vuelvo a llamar en unos días como quedamos.`, `Hi ${f}, thanks for your time. I'll call you again in a few days as we agreed.`],
    nointerest:[`Gracias por su tiempo, ${f}. Si más adelante quiere comprar casa, aquí estamos para ayudarle.`, `Thank you for your time, ${f}. If you want to buy a home later on, we're here to help.`] };
  const m = M[res] || M.talked; return cl(m[0], m[1], c) + sig; }
function nextStep(c, res){ const area = c.areas[0] || 'Houston';
  const S = { homes:['homes', 'Mandar casas en ' + area + ' y agendar la visita', 'Send homes in ' + area + ' and book the showing', DAYMS],
    apply:['call', 'Llamar para ver si llenó la solicitud', 'Call to see if they filled out the application', DAYMS],
    later:['call', 'Volver a llamar', 'Call again', 3*DAYMS],
    nointerest:['note', 'Marcar No califica ("No le interesa") en su perfil', 'Mark No califica ("Not interested") on their profile', HOUR] };
  const byStage = { 'Applied':['docs','Pedir los documentos que faltan (talones, W-2)','Ask for missing documents (pay stubs, W-2)', DAYMS], 'Showing Homes':['homes','Mandar casas y agendar visitas','Send homes and book showings', DAYMS], 'Under Contract':['deadline','Confirmar fechas del contrato con el prestamista','Confirm contract dates with the lender', DAYMS] };
  const s = S[res] || byStage[c.stage] || ['call','Mandar el enlace de la solicitud y llamar en 2 días','Send the application link and call in 2 days', 2*DAYMS];
  return { type:s[0], text:{ es:s[1], en:s[2] }, due: tomorrow10(s[3]), by: H.me().id, from:'lola' }; }
function tomorrow10(add){ if (add <= HOUR) return Date.now() + add; const d = new Date(Date.now() + add); d.setHours(10, 0, 0, 0); return d.getTime(); }
const LATER = () => { const t5 = new Date(); t5.setHours(17,0,0,0); const lst = [ [T('En 1 hora','In 1 hour'), Date.now() + HOUR], [T('Mañana 10 AM','Tomorrow 10 AM'), tomorrow10(DAYMS)], [T('En 3 días','In 3 days'), tomorrow10(3*DAYMS)] ];
  if (t5.getTime() - Date.now() > HOUR) lst.splice(1, 0, [T('Hoy 5 PM','Today 5 PM'), t5.getTime()]); return lst.map(([label, at]) => ({ label, at })); };
const dueTxt = at => H.fmt.dateLong(at) + ' · ' + H.fmt.time(at);

/* ---------- post-call sheet ---------- */
function postCall(c, k, dur, entry){
  const st = { res:'talked', text: followUp(c, 'talked'), edited:false, sent:false, task: nextStep(c, 'talked'), taskEdited:false, dueOpen:false };
  c.task = st.task; H.emit('client', c);   /* Lola's suggested next step becomes the task automatically */
  const draw = () => {
    const s = H.sheet(`<div class="cl-post">
      <h2>${T('Llamada con','Call with')} ${E(H.name(c))}</h2>
      <p class="cl-pmeta">${mmss(dur)} · <span class="cl-recd"><i class="cl-rec"></i>${T('Grabada y transcrita','Recorded and transcribed')}</span> · ${H.stageChip(c.stage)} · ${T('guardada en el historial','saved to history')}</p>
      <section class="cl-sec cl-sum"><h3>${H.icon('spark')}${T('Resumen de Lola','Lola\'s summary')}</h3><p>${E(T(summary(c, k, st.res, dur).es, summary(c, k, st.res, dur).en))}</p>
        <details class="cl-tx"><summary>${T('Ver transcripción','See transcript')}</summary><div>${transcript(c).split('\n').map(l => { const i = l.indexOf(': '); return `<p><b>${E(l.slice(0, i))}</b> ${E(l.slice(i + 2))}</p>`; }).join('')}</div></details></section>
      <section class="cl-sec"><h3>${T('¿Cómo le fue?','How did it go?')}</h3><div class="cl-oc">${RESULTS.map(r => `<button type="button" class="chip ${st.res === r[0] ? 'blue' : ''}" data-clp="res-${r[0]}" aria-pressed="${st.res === r[0]}">${T(r[1], r[2])}</button>`).join('')}</div></section>
      <section class="cl-sec cl-fu"><h3>${H.icon('chat')}${T('Texto de seguimiento de Lola','Lola\'s follow-up text')} <span class="chip">${c.lang === 'en' ? 'English' : 'Español'}</span></h3>
        ${st.sent ? `<p class="cl-sent">${H.icon('check')}${T('Enviado por texto','Sent by text')}: “${E(st.text)}”</p>` : st.edit ? `<textarea class="cl-futa" data-clp-ta rows="3">${E(st.text)}</textarea>` : `<p class="cl-futxt">${E(st.text)}</p>`}
        ${st.sent ? '' : `<div class="cl-row"><button class="btn btn-sm" type="button" data-clp="edit">${H.icon('note')}${st.edit ? T('Listo','Done') : T('Editar','Edit')}</button><button class="btn btn-pri btn-sm" type="button" data-clp="send">${H.icon('send')}${T('Enviar','Send')}</button><span class="cl-small">${T('No se envía solo: usted decide.','It never sends on its own: you decide.')}</span></div>`}</section>
      <section class="cl-sec"><h3>${H.icon('check')}${T('Próximo paso · ya quedó como tarea','Next step · already saved as the task')}</h3>
        <div class="cl-task"><input class="cl-tin" data-clp-task value="${E(T(st.task.text.es, st.task.text.en))}" aria-label="${T('Próximo paso','Next step')}"><button class="btn btn-sm" type="button" data-clp="due">${H.icon('clock')}${E(dueTxt(st.task.due))}</button></div>
        ${st.dueOpen ? `<div class="cl-row">${LATER().map((o, i) => `<button class="btn btn-sm" type="button" data-clp="due-${i}">${E(o.label)}</button>`).join('')}</div>` : ''}
        <p class="cl-small">${T('Sugerido por Lola. Lola nunca cambia la etapa del cliente.','Suggested by Lola. Lola never changes the client\'s stage.')}</p></section>
      <div class="cl-pfoot"><button class="btn" type="button" data-clp="screen">${H.icon('doc')}${T('Evaluación','Screening')}</button><button class="btn" type="button" data-clp="profile">${H.icon('user')}${T('Abrir perfil','Open profile')}</button><span class="cl-grow"></span><button class="btn btn-pri" type="button" data-clp="done">${CL.list && !CL.list.done ? T('Listo · siguiente llamada','Done · next call') : T('Listo','Done')}</button></div>
    </div>`, { wide:true, onClose: finish });
    s.oninput = e => { if (e.target.matches('[data-clp-ta]')){ st.text = e.target.value; st.edited = true; }
      if (e.target.matches('[data-clp-task]')){ const v = e.target.value; st.task.text = { es:v, en:v }; st.taskEdited = true; H.emit('client', c); } };
    s.onclick = e => { const b = e.target.closest('[data-clp]'); if (!b) return; const a = b.dataset.clp;
      if (a.startsWith('res-')){ st.res = a.slice(4); entry.result = st.res; if (!st.edited && !st.sent) st.text = followUp(c, st.res); if (!st.taskEdited){ st.task = nextStep(c, st.res); c.task = st.task; } H.emit('client', c); redraw(); }
      else if (a === 'edit'){ st.edit = !st.edit; redraw(); }
      else if (a === 'send'){ st.sent = true; st.edit = false; H.sendText(c.id, st.text, { ch:'text', from:k.from, onUndo: () => { st.sent = false; if (st.closed){ H.lolaDrafts.unshift({ id: Date.now(), cid: c.id, text: st.text, at: Date.now(), by: H.me().id }); H.emit('client', c); } else redraw(); } }); redraw(); }
      else if (a === 'due'){ st.dueOpen = !st.dueOpen; redraw(); }
      else if (a.startsWith('due-')){ st.task.due = LATER()[+a.slice(4)].at; st.dueOpen = false; H.emit('client', c); redraw(); }
      else if (a === 'screen'){ if (!H.screen) return H.toast(T('La evaluación se abre desde el perfil.','Screening opens from the profile.')); finish(true); H.screen(c.id); }
      else if (a === 'profile'){ H.close(); H.openClient(c.id); }
      else if (a === 'done') H.close(); };
    return s; };
  let redrawing = false;
  const redraw = () => { redrawing = true; const sc = document.getElementById('sheet').scrollTop; draw(); document.getElementById('sheet').scrollTop = sc; redrawing = false; };
  function finish(toScreen){ if (redrawing || st.closed) return; st.closed = true;
    const sm = summary(c, k, st.res, dur); entry.text = { es:'Llamada grabada (' + mmss(dur) + ') · Resumen de Lola: ' + sm.es + ' · Próximo paso: ' + st.task.text.es, en:'Recorded call (' + mmss(dur) + ') · Lola\'s summary: ' + sm.en + ' · Next step: ' + st.task.text.en }; H.emit('client', c);
    if (!st.sent){ H.lolaDrafts.unshift({ id: Date.now(), cid: c.id, text: st.text, at: Date.now(), by: H.me().id }); H.emit('client', c);
      if (!(CL.list && !CL.list.done)) H.toast(T('El texto de Lola quedó en Mensajes → Textos de Lola','Lola\'s text was saved in Messages → Lola\'s texts'), { label:T('Ver','View'), fn: () => H.go('mensajes', 'lola') }, 5000); }
    if (CL.list && !CL.list.done){ if (toScreen === true){ CL.list.paused = true; renderDock(); } else countdown(); } }
  draw();
}

/* ---------- call later (visible to all, with who will call) ---------- */
function callLater(i){ const k = CL.call, c = k && H.client(k.cid); if (!c) return; const o = LATER()[i], prev = c.task;
  H.undoable({ msg: T('Llamar después: ','Call later: ') + o.label,
    run: () => { c.task = { type:'call', text:{ es:'Volver a llamar (no contestó) · lo llama ' + H.me().name, en:'Call again (no answer) · ' + H.me().name + ' will call' }, due:o.at, by:H.me().id }; H.log(c.id, { type:'note', text:{ es:'Llamar después: ' + dueTxt(o.at) + ' · lo llama ' + H.me().name, en:'Call later: ' + dueTxt(o.at) + ' · ' + H.me().name + ' will call' } }); },
    undo: () => { c.task = prev; c.timeline.shift(); H.emit('client', c); k.laterTxt = ''; renderDock(); } });
  k.later = false; k.laterTxt = T('Le toca llamar: ','Call back: ') + dueTxt(o.at); renderDock(); }

/* ---------- dock clicks ---------- */
function onDock(e){ const b = e.target.closest('[data-cl]'); if (!b) return; const a = b.dataset.cl, k = CL.call;
  if (a.startsWith('lst-')) return listAction(a.slice(4));
  if (!k) return;
  if (a === 'sim-yes') settle(true); else if (a === 'sim-no') settle(false);
  else if (a === 'ring'){ k.ringOff = !k.ringOff; ringMute(k.ringOff); renderDock(); }
  else if (a === 'mute'){ k.muted = !k.muted; renderDock(); }
  else if (a === 'pad'){ k.pad = !k.pad; renderDock(); }
  else if (a.startsWith('key-')){ k.dtmf = (k.dtmf + a.slice(4)).slice(-16); const v = document.querySelector('#cl-dock .cl-padv'); if (v) v.textContent = k.dtmf; }
  else if (a === 'notes'){ k.notesOpen = !k.notesOpen; renderDock(); if (k.notesOpen) setTimeout(() => document.getElementById('cl-notes')?.focus(), 30); }
  else if (a === 'screen'){ H.screen ? H.screen(k.cid) : H.toast(T('La evaluación se abre desde el perfil.','Screening opens from the profile.')); }
  else if (a === 'noanswer') noAnswer();
  else if (a === 'vm'){ if (k.cid) H.voicemailDrop(k.cid); else noAnswer(); }
  else if (a === 'hang') hangUp();
  else if (a === 'open' && k.cid) H.openClient(k.cid);
  else if (a === 'laterOpen'){ k.later = !k.later; renderDock(); }
  else if (a.startsWith('later-')){ if (a === 'later-x'){ k.later = false; renderDock(); } else callLater(+a.slice(6)); }
  else if (a === 'text') H.compose(k.cid, 'text', { tpl: 1 });
  else if (a === 'close'){ CL.call = null; renderDock(); }
}

/* ---------- call a list in a row ---------- */
H.callList = (ids) => {
  const list = (ids || []).map(Number).filter(id => { const c = H.client(id); return c && c.phone; });
  if (!list.length){ H.toast(T('No hay a quién llamar en esta lista.','Nobody to call in this list.')); return; }
  if (active()){ H.toast(T('Termine la llamada actual primero.','Finish the current call first.')); return; }
  audio(); clearInterval(CL.cdT);
  CL.list = { ids:list, i:0, res:{}, paused:false, cd:0, done:false };
  start(list[0], {});
};
function listStrip(){ const L = CL.list, n = L.ids.length, nextC = H.client(L.ids[L.i + 1]);
  const ic = r => r === 'talked' ? H.icon('check') : r === 'voicemail' ? H.icon('voicemail') : r === 'noanswer' ? H.icon('x') : r === 'skipped' ? H.icon('right') : '';
  return `<div class="cl-list"><div class="cl-lh"><b>${H.icon('phone')}${T('Llamando a una lista','Calling a list')}</b><span class="chip blue">${Math.min(L.i + 1, n)} ${T('de','of')} ${n}</span>
      ${L.cd > 0 && nextC ? `<span class="cl-cd" aria-live="polite">${T('Siguiente','Next')}: <b>${E(H.name(nextC))}</b> ${T('en','in')} ${L.cd} s</span>` : L.paused ? `<span class="cl-cd">${T('En pausa','Paused')}</span>` : ''}
      <span class="cl-grow"></span><span class="cl-lbtns">
      ${L.cd > 0 || L.paused ? `<button class="btn btn-sm btn-pri" type="button" data-cl="lst-now">${H.icon('phone')}${T('Llamar ya','Call now')}</button>` : ''}
      ${L.cd > 0 ? `<button class="btn btn-sm" type="button" data-cl="lst-pause" aria-label="${T('Pausar','Pause')}">${H.icon('pause')}<span>${T('Pausar','Pause')}</span></button>` : ''}
      ${L.cd > 0 || L.paused ? `<button class="btn btn-sm" type="button" data-cl="lst-skip" aria-label="${T('Saltar','Skip')}">${H.icon('right')}<span>${T('Saltar','Skip')}</span></button>` : ''}
      <button class="btn btn-sm btn-ghost" type="button" data-cl="lst-stop" aria-label="${T('Detener','Stop')}">${H.icon('x')}<span>${T('Detener','Stop')}</span></button></span></div>
    <div class="cl-q">${L.ids.map((id, i) => { const c = H.client(id), r = L.res[id]; return `<span class="cl-qi ${i === L.i ? 'cl-qcur' : ''} cl-r-${r || 'todo'}">${ic(r)}${E(c ? H.name(c) : '')}</span>`; }).join('')}</div></div>`; }
function listNext(outcome){ const L = CL.list; if (!L || L.done || !CL.call) return; L.res[CL.call.cid] = outcome; countdown(); }
function countdown(){ const L = CL.list; clearInterval(CL.cdT);
  if (L.i + 1 >= L.ids.length){ L.cd = 0; renderDock(); setTimeout(listDone, 1200); return; }
  L.cd = 5; L.paused = false; renderDock();
  CL.cdT = setInterval(() => { if (!CL.list || L.paused) return clearInterval(CL.cdT); L.cd--; if (L.cd <= 0){ clearInterval(CL.cdT); advance(); } else renderDock(); }, 1000); }
function advance(skip){ const L = CL.list; clearInterval(CL.cdT); L.cd = 0; L.paused = false;
  if (skip){ L.i++; L.res[L.ids[L.i]] = 'skipped'; if (L.i + 1 >= L.ids.length){ CL.call = null; return listDone(); } countdown(); return; }
  L.i++; if (L.i >= L.ids.length) return listDone(); start(L.ids[L.i], {}); }
function listAction(a){ const L = CL.list; if (!L) return;
  if (a === 'now') advance(); else if (a === 'pause'){ L.paused = true; L.cd = 0; clearInterval(CL.cdT); renderDock(); }
  else if (a === 'skip') advance(true);
  else if (a === 'stop'){ clearInterval(CL.cdT); if (active()){ L.done = true; renderDock(); listDone(); } else listDone(); } }
function listDone(){ const L = CL.list; if (!L) return; L.done = true; clearInterval(CL.cdT); if (!active()) CL.call = null; renderDock();
  const ids = L.ids, cnt = k => ids.filter(id => L.res[id] === k).length;
  const lbl = { talked:T('Hablamos','Talked'), noanswer:T('No contestó','No answer'), voicemail:T('Buzón dejado','Voicemail left'), skipped:T('Saltado','Skipped') };
  const s = H.sheet(`<div class="cl-post"><h2>${T('Lista terminada','List finished')}</h2><p class="cl-pmeta">${ids.length} ${T('clientes','clients')} · ${T('todo quedó guardado en el historial de cada cliente','everything was saved on each client\'s history')}</p>
    <div class="cl-tiles"><div><b>${cnt('talked')}</b><span>${T('Hablaron','Talked')}</span></div><div><b>${cnt('noanswer') + cnt('voicemail')}</b><span>${T('No contestaron','No answer')}</span></div><div><b>${cnt('voicemail')}</b><span>${T('Buzones dejados','Voicemails left')}</span></div></div>
    <div class="cl-sumlist">${ids.map(id => { const c = H.client(id), r = L.res[id]; return `<div class="cl-srow"><b>${E(H.name(c))}</b><span class="chip ${r === 'talked' ? 'green' : r ? '' : 'warn'}">${r ? lbl[r] : T('Sin llamar','Not called')}</span><span class="cl-grow"></span>${r !== 'talked' ? `<button class="btn btn-sm" type="button" data-cls="${id}">${H.icon('phone')}${T('Llamar','Call')}</button>` : ''}</div>`; }).join('')}</div>
    <div class="cl-pfoot"><span class="cl-grow"></span><button class="btn btn-pri" type="button" data-hclose>${T('Cerrar','Close')}</button></div></div>`);
  s.onclick = e => { const b = e.target.closest('[data-cls]'); if (b){ H.close(); H.call(+b.dataset.cls); } };
  CL.list = null; renderDock(); }

/* ---------- texting: 5-second Undo, then it goes out ---------- */
H.sendText = (clientId, text, o = {}) => {
  const c = H.client(clientId); text = String(text || '').trim();
  if (!c || (!text && !o.attach)) return;
  const ch = o.ch === 'app' ? 'app' : 'text', from = o.from || H.me().id, att = o.attach ? (typeof o.attach === 'string' ? { name:o.attach } : o.attach) : null;
  const p = { key: Date.now() + Math.random(), cid: c.id, text, ch, at: Date.now(), attach: att, from };
  let undone = false;
  H.pendingTexts.push(p); H.emit('client', c);
  H.undoable({ msg: ch === 'app' ? T('Mensaje enviado en la App','App message sent') : T('Texto enviado','Text sent'),
    undo: () => { undone = true; H.pendingTexts.splice(H.pendingTexts.indexOf(p), 1); H.emit('client', c); o.onUndo && o.onUndo(); } });
  setTimeout(() => { if (undone) return; const i = H.pendingTexts.indexOf(p); if (i > -1) H.pendingTexts.splice(i, 1);
    const isImg = att && /\.(jpe?g|png|heic|gif|webp)$/i.test(att.name || '');
    c.thread.push({ id: c.id + '-o' + Date.now(), at: Date.now(), ch, dir:'out', by: H.me().id, text:{ es:text, en:text }, voice:false, photo: !!isImg, attach: att && att.name, unread:false, line: ch === 'text' ? from : null });
    c.lolaPause = Date.now() + DAYMS;  /* Lola's automatic texts wait 24 h after a teammate writes */
    const via = ch === 'app' ? { es:'Mensaje en la App', en:'App message' } : { es:'Texto desde ' + (from === 'team' ? 'la línea del equipo' : 'el número del Hub de ' + H.me().name), en:'Text from ' + (from === 'team' ? 'the team line' : H.me().name + '\'s Hub number') };
    H.log(c.id, { type:'text', text:{ es: via.es + ': "' + text + '"' + (att ? ' · adjunto: ' + att.name : ''), en: via.en + ': "' + text + '"' + (att ? ' · attachment: ' + att.name : '') } });
    H.touch(c.id); o.onSent && o.onSent(); }, 5150);
};

/* ---------- composer drawer (text or email) ---------- */
const TPL = c => { const f = first(c), a = meFirst(), area = c.areas[0] || 'Houston';
  return [ [T('Primer contacto','First contact'), cl(`Hola ${f}, le saluda ${a} de Jason Aguirre Group. Vi que está buscando casa. ¿A qué hora le puedo llamar?`, `Hi ${f}, this is ${a} with the Jason Aguirre Group. I saw you're looking for a home. What time can I call you?`, c)],
    [T('No contestó','No answer'), cl(`Hola ${f}, le acabo de llamar. ¿Cuándo le queda bien que hablemos unos minutos?`, `Hi ${f}, I just called you. When is a good time to talk for a few minutes?`, c)],
    [T('Solicitud','Application'), cl(`Hola ${f}, puede llenar la solicitud en la app JAG Homes; toma unos 10 minutos. Cualquier duda me dice.`, `Hi ${f}, you can fill out the application in the JAG Homes app; it takes about 10 minutes. Let me know if you have questions.`, c)],
    [T('Documentos','Documents'), cl(`Hola ${f}, para seguir con su préstamo nos faltan sus últimos talones de pago y su W-2. Puede subirlos en la app.`, `Hi ${f}, to move your loan forward we need your latest pay stubs and W-2. You can upload them in the app.`, c)],
    [T('Visita','Showing'), cl(`Hola ${f}, ¿le queda bien el sábado para ver casas en ${area}?`, `Hi ${f}, does Saturday work to see homes in ${area}?`, c)] ]; };
H.compose = (clientId, kind = 'text', o = {}) => {
  const c = H.client(clientId); if (!c) return;
  const st = { kind, ch: (c.thread.filter(m => m.dir === 'in').slice(-1)[0]?.ch === 'app') ? 'app' : 'text', from: c.thread.filter(m => m.ch === 'text').slice(-1)[0]?.line === 'team' ? 'team' : H.me().id, att:null };
  const tpls = TPL(c), etpl = [ [T('Seguimiento','Follow-up'), cl('Seguimiento de su búsqueda de casa', 'Following up on your home search', c), tpls[0][1]], [T('Documentos','Documents'), cl('Documentos que faltan para su préstamo', 'Documents still needed for your loan', c), tpls[3][1]], [T('Casas','Homes'), cl('Casas para usted en ' + (c.areas[0] || 'Houston'), 'Homes for you in ' + (c.areas[0] || 'Houston'), c), tpls[4][1]] ];
  const hasApp = c.app && c.app.account || c.thread.some(m => m.ch === 'app');
  const d = H.drawer(`<div class="cl-cmp">
    <div class="cl-cmph"><div><h2>${kind === 'email' ? T('Correo a','Email to') : T('Texto a','Text to')} ${E(H.name(c))}</h2><p class="cl-small">${E(kind === 'email' ? (c.email || T('Sin correo','No email')) : c.phone)} · ${c.lang === 'en' ? 'English' : 'Español'}</p></div><button class="cl-x" type="button" data-hclose aria-label="${T('Cerrar','Close')}">${H.icon('x')}</button></div>
    ${kind === 'text' ? `<div class="cl-row">
        ${hasApp ? `<div class="cl-seg" role="group" aria-label="${T('Por dónde','Channel')}"><button type="button" data-clc="ch-text" class="${st.ch === 'text' ? 'cl-segon' : ''}">${T('Texto','Text')}</button><button type="button" data-clc="ch-app" class="${st.ch === 'app' ? 'cl-segon' : ''}">App</button></div>` : ''}
        <label class="cl-small" for="cl-from">${T('Desde','From')}</label><select id="cl-from" class="cl-sel"><option value="${H.me().id}" ${st.from !== 'team' ? 'selected' : ''}>${E(lineLabel(H.me().id))}</option><option value="team" ${st.from === 'team' ? 'selected' : ''}>${E(lineLabel('team'))}</option></select></div>`
      : `<div class="field"><label for="cl-subj">${T('Asunto','Subject')}</label><input id="cl-subj" value="${E(etpl[0][1])}"></div>`}
    <div class="cl-tpls"><span class="cl-small">${T('Plantillas','Templates')}:</span>${(kind === 'email' ? etpl : tpls).map((t, i) => `<button class="chip" type="button" data-clc="tpl-${i}">${E(t[0])}</button>`).join('')}<button class="chip ch-lola" type="button" data-clc="lola">${H.icon('spark')}${T('Borrador de Lola','Lola draft')}</button></div>
    <div class="field"><label for="cl-body">${T('Mensaje','Message')}</label><textarea id="cl-body" rows="6">${E(kind === 'email' ? etpl[0][2] : (o.text || (o.tpl != null ? tpls[o.tpl][1] : '')))}</textarea></div>
    ${kind === 'text' ? `<div class="cl-row"><label class="btn btn-sm cl-att">${H.icon('attach')}${T('Foto o PDF','Photo or PDF')}<input type="file" accept="image/*,application/pdf" hidden id="cl-file"></label><span class="cl-small" id="cl-attn"></span></div>` : ''}
    <div class="cl-row cl-cmpf"><button class="btn btn-pri" type="button" data-clc="send">${H.icon('send')}${T('Enviar','Send')}</button><button class="btn btn-ghost" type="button" data-hclose>${T('Cancelar','Cancel')}</button></div>
    <p class="cl-small">${kind === 'text' ? T('Lola pausa sus textos automáticos 24 horas después de que usted le escriba al cliente.','Lola pauses her automatic texts for 24 hours after you write to the client.') : T('Sale de su correo del equipo y queda en el historial del cliente.','Goes out from your team email and is saved on the client\'s history.')}</p></div>`);
  const body = () => d.querySelector('#cl-body');
  d.onchange = e => { if (e.target.id === 'cl-from') st.from = e.target.value;
    if (e.target.id === 'cl-file'){ const f = e.target.files[0]; if (!f) return; if (f.size > 5e6){ d.querySelector('#cl-attn').textContent = T('Muy grande (máx. 5 MB)','Too big (max 5 MB)'); return; } st.att = { name:f.name, kind: f.type }; d.querySelector('#cl-attn').textContent = f.name; } };
  d.onclick = e => { const b = e.target.closest('[data-clc]'); if (!b) return; const a = b.dataset.clc;
    if (a.startsWith('ch-')){ st.ch = a.slice(3); d.querySelectorAll('[data-clc^="ch-"]').forEach(x => x.classList.toggle('cl-segon', x.dataset.clc === a)); }
    else if (a.startsWith('tpl-')){ const t = (kind === 'email' ? etpl : tpls)[+a.slice(4)]; if (kind === 'email'){ d.querySelector('#cl-subj').value = t[1]; body().value = t[2]; } else body().value = t[1]; }
    else if (a === 'lola') body().value = H.lolaSuggest ? H.lolaSuggest(c) : tpls[0][1];
    else if (a === 'send'){ const txt = body().value.trim(); if (!txt && !st.att){ body().focus(); return; }
      if (kind === 'email'){ const subj = d.querySelector('#cl-subj').value.trim(); let undone = false; H.close();
        H.undoable({ msg:T('Correo enviado','Email sent'), undo: () => { undone = true; } });
        setTimeout(() => { if (undone) return; H.log(c.id, { type:'email', text:{ es:'Correo: "' + subj + '" · ' + txt.slice(0, 120), en:'Email: "' + subj + '" · ' + txt.slice(0, 120) } }); H.touch(c.id); }, 5150);
      } else { H.close(); H.sendText(c.id, txt, { ch: st.ch, from: st.from, attach: st.att }); } } };
  setTimeout(() => body() && body().focus(), 80);
};

/* ---------- incoming calls ---------- */
H.incomingCall = (clientId) => {
  if (active()){ H.toast(T('Ya está en una llamada.','You are already on a call.')); return; }
  clearInterval(CL.incT);
  let c = clientId === null ? null : H.client(clientId);
  if (clientId === undefined) c = H.clients.find(x => x.encargado === H.me().id && x.phone && !x.nameless) || H.clients.find(x => !x.encargado && x.phone && !x.nameless);
  const phone = c ? c.phone : '(713) 555-0' + (140 + Math.floor(Math.random() * 59));
  const mine = c && c.encargado === H.me().id;
  CL.inc = { cid: c ? c.id : null, phone, mine, phase:'ring', left:5 };
  audio(); ringStart('in');
  drawInc();
  CL.incT = setInterval(() => { const I = CL.inc; if (!I || I.phase !== 'ring') return clearInterval(CL.incT); I.left--; if (I.left <= 0) missed(); else { const el = document.querySelector('#cl-in .cl-left'); if (el) el.textContent = I.left; } }, 1000);
};
document.addEventListener('click', e => { if (e.target.closest('#bellBtn') && CL.inc && CL.inc.phase === 'missed'){ CL.inc = null; drawInc(); } }, true);  /* the missed-call card moves into the bell */
function drawInc(){ let el = document.getElementById('cl-in'); const I = CL.inc;
  if (!I){ el && el.remove(); return; }
  if (!el){ el = document.createElement('div'); el.id = 'cl-in'; el.className = 'cl-in'; el.setAttribute('role','alertdialog'); document.body.appendChild(el); el.addEventListener('click', onInc); }
  const c = H.client(I.cid), name = c ? H.name(c) : T('Número desconocido','Unknown number');
  const who = c ? (I.mine ? T('su cliente','your client') : !c.encargado ? T('Leads pond · suena a todo el equipo','Leads pond · rings the whole team') : T('cliente de ','client of ') + (H.user(c.encargado)?.name || '')) : T('suena a todo el equipo','rings the whole team');
  if (I.phase === 'ring'){
    el.innerHTML = `<div class="cl-inh"><span class="cl-inic">${H.icon('phone')}</span><div><small>${T('Llamada entrante','Incoming call')} · ${I.mine ? T('a su número del Hub','to your Hub number') : T('a la línea del equipo','to the team line')} ${E(I.mine ? H.me().line : H.TEAM_LINE)}</small>
      <b>${T('Le está llamando','Calling you')}: ${E(name)}</b><span>${E(I.phone)} · ${E(who)}</span>${c ? `<span>${H.stageChip(c.stage)}</span>` : ''}</div></div>
      <p class="cl-small">${T('También suena en su celular.','Also ringing on your cell.')} ${T('Va al buzón en','Goes to voicemail in')} <b class="cl-left">${I.left}</b> s</p>
      <div class="cl-row"><button class="btn btn-pri" type="button" data-cli="answer">${H.icon('phone')}${T('Contestar','Answer')}</button><button class="btn" type="button" data-cli="decline">${H.icon('voicemail')}${T('Mandar al buzón','Send to voicemail')}</button></div>`;
  } else {
    el.innerHTML = `<div class="cl-inh"><span class="cl-inic cl-miss">${H.icon('voicemail')}</span><div><small class="cl-red">${T('Llamada perdida · dejó buzón de voz','Missed call · left a voicemail')}</small><b>${E(name)}</b><span>${E(I.phone)} · ${H.fmt.time(Date.now())}</span></div><button class="cl-x" type="button" data-cli="close" aria-label="${T('Cerrar','Close')}">${H.icon('x')}</button></div>
      <p class="cl-vmt"><span class="cl-small">${T('Buzón transcrito','Voicemail transcript')}:</span> “${E(I.vm)}”</p>
      <p class="cl-small">${H.icon('bell')} ${T('Le avisamos con la campanita y también por texto a su celular.','We alerted you on the bell and also by text to your cell.')}</p>
      <div class="cl-row"><button class="btn btn-pri" type="button" data-cli="back">${H.icon('phone')}${T('Llamar de vuelta','Call back')}</button>${c ? `<button class="btn" type="button" data-cli="open">${H.icon('user')}${T('Abrir perfil','Open profile')}</button>` : `<button class="btn" type="button" data-cli="add">${H.icon('plus')}${T('Agregar como cliente','Add as client')}</button>`}</div>`;
  } }
function missed(){ const I = CL.inc; if (!I) return; clearInterval(CL.incT); ringStop(); const c = H.client(I.cid);
  I.phase = 'missed';
  I.vm = c ? cl(`Hola, habla ${first(c)}. Le llamaba para ver lo de la casa, ¿me puede regresar la llamada? Gracias.`, `Hi, this is ${first(c)}. I was calling about the house, can you call me back? Thanks.`, c)
           : T('Hola, vi su anuncio en TikTok y quiero información para comprar casa. Mi número es este. Gracias.','Hi, I saw your ad on TikTok and I want information about buying a home. This is my number. Thanks.');
  if (c) H.log(c.id, { type:'call', by:null, dir:'in', dur:0, outcome:'missed', recording:true, transcript: I.vm, text:{ es:'Llamada perdida · dejó buzón (transcrito): "' + I.vm + '" · aviso a ' + (I.mine ? H.me().name : 'todo el equipo') + ' por campanita y texto', en:'Missed call · voicemail (transcribed): "' + I.vm + '" · ' + (I.mine ? H.me().name : 'whole team') + ' alerted by bell and text' } });
  H.notify({ kind:'missed', icon:'voicemail', client: c ? c.id : null, phone: c ? undefined : I.phone, ...(c && c.encargado ? { to:[c.encargado] } : {}),
    text:{ es:'Llamada perdida · dejó buzón: "' + I.vm.slice(0, 70) + '…"', en:'Missed call · voicemail: "' + I.vm.slice(0, 70) + '…"' } });
  drawInc(); }
function onInc(e){ const b = e.target.closest('[data-cli]'); if (!b) return; const a = b.dataset.cli, I = CL.inc; if (!I) return;
  if (a === 'answer'){ clearInterval(CL.incT); ringStop(); CL.inc = null; drawInc(); start(I.cid, { inbound:true, phone:I.phone, from: I.mine ? H.me().id : 'team' }); }
  else if (a === 'decline') missed();
  else if (a === 'close'){ CL.inc = null; drawInc(); }
  else if (a === 'back'){ CL.inc = null; drawInc(); if (I.cid) H.call(I.cid); else { audio(); start(null, { phone:I.phone }); } }
  else if (a === 'open'){ CL.inc = null; drawInc(); H.openClient(I.cid); }
  else if (a === 'add'){ CL.inc = null; drawInc(); H.newContact(I.phone); } }

}
</script>
<script>/* ---- matrix.js ---- */
{
/* ===== Matrix: team home search (HAR Matrix style), client lists, new construction ===== */
const T = H.t, E = H.esc, F = H.fmt, DAY = 864e5, NOW = H.now();
const HOST = 'jasonaguirregroup.com';
const AREAS = { houston:[['Alief',330,610],['Spring',480,180],['Humble',655,240],['Katy',150,470],['Pasadena',660,585],['New Caney',770,115],['Cypress',230,255],['Conroe',455,50],['Baytown',860,505],['Northeast Houston',590,385],['Channelview',760,470],['Aldine',540,300]],
  dallas:[['Grand Prairie',300,560],['Mesquite',720,520],['Garland',700,330],['Irving',330,400]] };
const REG = { houston:'Houston', dallas:'Dallas–Fort Worth' };

/* ---------- search state (kept while the Hub is open) ---------- */
const S = { cid:null, tab:'search', region:'houston', areas:[], pmin:'', pmax:'', beds:0, baths:0, sqft:'', year:'', hoa:'', newc:false, st:DEF_ST.slice(), view:'grid', sort:['price', 1], sel:new Set(), crit:false, filled:null, comm:null, ncReg:'all', picking:false };
const CRIT = ['region','areas','pmin','pmax','beds','baths','sqft','year','hoa','newc','st'];
const critOf = () => JSON.parse(JSON.stringify(CRIT.reduce((o, k) => (o[k] = S[k], o), {})));
const areaNames = reg => AREAS[reg].map(a => a[0]);
const r25 = n => Math.min(600, Math.max(100, Math.round(n / 25) * 25));
function nearArea(c){ const a = AREAS[c.region || 'houston'], me = a.find(x => x[0] === (c.areas || [])[0]); if (!me || !(c.app && c.app.views)) return null;
  return a.filter(x => x !== me).sort((p, q) => Math.hypot(p[1] - me[1], p[2] - me[2]) - Math.hypot(q[1] - me[1], q[2] - me[2]))[0][0]; }
function prefill(c){
  const a = alerts[c.id]; S.sel.clear();
  if (a){ Object.assign(S, JSON.parse(JSON.stringify(a.crit))); S.filled = { kind:'alert' }; return; }
  const extra = nearArea(c); S.region = c.region || 'houston';
  S.areas = [...new Set([...(c.areas || []), ...(extra ? [extra] : [])])].filter(x => areaNames(S.region).includes(x));
  S.pmax = c.budget ? r25(c.budget * 1.1 / 1000) : ''; S.pmin = c.budget ? r25(c.budget * .75 / 1000) : '';
  Object.assign(S, { beds:3, baths:0, sqft:'', year:'', hoa:'', newc:(c.tags || []).includes('Construcción nueva'), st:DEF_ST.slice(), filled:{ kind:'client', extra } });
  if (!results().length && S.areas.length){ S.areas = []; S.filled.wide = true; } if (!results().length && c.budget){ S.pmin = ''; S.pmax = r25(c.budget * 1.25 / 1000); S.filled.wide = true; } if (!results().length && c.budget){ S.pmax = ''; S.sort = ['price', 1]; S.filled.over = F.k(c.budget); }
}
function resetCrit(){ Object.assign(S, { areas:[], pmin:'', pmax:'', beds:0, baths:0, sqft:'', year:'', hoa:'', newc:false, st:DEF_ST.slice(), filled:null }); }
const nFilters = () => (S.areas.length ? 1 : 0) + (S.pmin ? 1 : 0) + (S.pmax ? 1 : 0) + (S.beds ? 1 : 0) + (S.baths ? 1 : 0) + (S.sqft ? 1 : 0) + (S.year ? 1 : 0) + (S.hoa !== '' ? 1 : 0) + (S.newc ? 1 : 0) + (S.st.join() !== DEF_ST.join() ? 1 : 0);
const val = (l, k) => k === 'ppsf' ? l.price / l.sqft : k === 'status' ? ['new','active','reduced','pending','sold'].indexOf(l.status) : k === 'bb' ? l.beds * 10 + l.baths : l[k];
function results(){
  const out = H.listings.filter(x => x.region === S.region && (!S.areas.length || S.areas.includes(x.area)) && (!S.pmin || x.price >= S.pmin * 1000) && (!S.pmax || x.price <= S.pmax * 1000)
    && x.beds >= S.beds && x.baths >= S.baths && (!S.sqft || x.sqft >= +S.sqft) && (!S.year || x.year >= +S.year) && (S.hoa === '' || x.hoa <= +S.hoa) && (!S.newc || x.newc) && S.st.includes(x.status) && (x.status !== 'sold' || soldDays(x) <= 180));
  const [k, d] = S.sort; return out.sort((a, b) => { const va = val(a, k), vb = val(b, k); return (va > vb ? 1 : va < vb ? -1 : 0) * d || a.id - b.id; });
}
/* plain-words summary of a search, in a given language (for alerts + the timeline) */
function summary(cr, lang){ const t = (es, en) => lang === 'en' ? en : es, p = [];
  p.push(cr.areas.length ? cr.areas.join(', ') : t('todas las áreas de ', 'all of ') + REG[cr.region]);
  if (cr.pmin && cr.pmax) p.push(`$${cr.pmin}K–$${cr.pmax}K`); else if (cr.pmax) p.push(t('hasta', 'up to') + ` $${cr.pmax}K`); else if (cr.pmin) p.push(t('desde', 'from') + ` $${cr.pmin}K`);
  if (cr.beds) p.push(cr.beds + '+ ' + t('rec.', 'bd')); if (cr.baths) p.push(cr.baths + '+ ' + t('baños', 'ba'));
  if (cr.sqft) p.push(F.num(cr.sqft) + '+ ' + t('pies²', 'sq ft')); if (cr.year) p.push(t('construida desde ', 'built ') + cr.year + (lang === 'en' ? '+' : ''));
  if (cr.hoa !== '') p.push(+cr.hoa === 0 ? t('sin HOA', 'no HOA') : t('HOA hasta $', 'HOA up to $') + cr.hoa);
  if (cr.newc) p.push(t('solo construcción nueva', 'new construction only'));
  if (cr.st.join() !== DEF_ST.join()) p.push(cr.st.map(s => t(ST[s][0], ST[s][1]).toLowerCase()).join(' / '));
  return p.join(' · '); }

const COLS = [['', ''], ['', ''], ['mls', ['MLS #', 'MLS #']], ['status', ['Estado', 'Status']], ['addr', ['Dirección', 'Address']], ['area', ['Área', 'Area']], ['price', ['Precio', 'Price'], 'r'], ['bb', ['Rec/Baños', 'Bd/Ba'], 'r'], ['sqft', ['Pies²', 'Sq ft'], 'r'], ['year', ['Año', 'Year'], 'r'], ['dom', ['Días', 'DOM'], 'r'], ['ppsf', ['$/pie²', '$/sq ft'], 'r']];
function resHTML(){

    ${seg('data-mxview', S.view, [['grid', ico('list') + `<span>${T('Tabla', 'Grid')}</span>`], ['thumb', ico('grid') + `<span>${T('Fotos', 'Photos')}</span>`], ['map', ico('map') + `<span>${T('Mapa', 'Map')}</span>`]])}</div>`;

  const inCart = l => cart.includes('l' + l.id), chk = l => `<input type="checkbox" data-mxsel="${l.id}" ${S.sel.has(l.id) ? 'checked' : ''} aria-label="${T('Seleccionar', 'Select')} ${E(l.addr)}">`;
  const cartTag = l => inCart(l) ? `<span class="mx-incart" title="${T('En la lista', 'In the list')}">${ico('check')}${T('En la lista', 'In list')}</span>` : '';

    h += `<div class="mx-cards">${list.map(l => `<div class="mx-crd ${S.sel.has(l.id) ? 'on' : ''}" data-mxopen="${l.id}"><label class="mx-crd-ck">${chk(l)}</label><div class="mx-crd-ph">${H.ui.photo(l, 0)}</div><div class="mx-crd-b"><div class="mx-crd-1"><b>${F.price(l.price)}</b>${stChip(l.status)}</div><div>${E(l.addr)}</div><small>${l.beds} ${T('rec', 'bd')} · ${l.baths} ${T('baños', 'ba')} · ${F.num(l.sqft)} ${T('pies²', 'sq ft')} · ${l.year}</small><small>${E(l.area)} · MLS ${E(l.mls)} · ${l.status === 'sold' ? T('vendida ', 'sold ') + ago(soldDays(l)) : l.dom + T(' días', ' days')}</small>${cartTag(l)}</div></div>`).join('')}</div>`;
  } else if (S.view === 'thumb'){
    h += `<div class="mx-thumbs">${list.map(l => `<article class="mx-th ${S.sel.has(l.id) ? 'on' : ''}"><div class="mx-th-ph" data-mxopen="${l.id}">${H.ui.photo(l, 0)}<span class="mx-th-st">${stChip(l.status)}</span></div><label class="mx-th-ck">${chk(l)}</label>
      <div class="mx-th-b" data-mxopen="${l.id}"><b class="mx-th-p">${F.price(l.price)}</b><small>${l.beds} ${T('rec', 'bd')} · ${l.baths} ${T('baños', 'ba')} · ${F.num(l.sqft)} ${T('pies²', 'sq ft')}</small><div class="mx-th-a">${E(l.addr)}</div><small class="muted">${E(l.area)} · ${l.status === 'sold' ? T('vendida ', 'sold ') + ago(soldDays(l)) : l.dom + T(' días en el mercado', ' days on market')}</small></div>
      <div class="mx-th-f">${inCart(l) ? cartTag(l) : `<button class="btn btn-sm" type="button" data-mxadd="${l.id}">${ico('plus')}${c ? T('Agregar a la lista', 'Add to list') : T('Agregar a una lista', 'Add to a list')}</button>`}</div></article>`).join('')}</div>`;
  } else h += mapHTML(list, cart);
  return h + `<p class="sample mx-foot">${T('Datos del MLS. Las llamadas y preguntas de los clientes vienen a JAG, nunca al agente de la vendedora.', 'MLS data. Client calls and questions come to JAG, never to the listing agent.')}</p>`;
}

/* ---------- map view: simple drawn map (no remote tiles), price pins ---------- */
const MAPS = {
  houston:{ vb:'40 0 960 740', center:[480, 440, 'Houston'], water:'M790 620 Q870 590 1000 600 L1000 740 L690 740 Q760 700 790 620Z',
    roads:[['M480 440 L485 300 L480 180 L455 40 L452 0', 'I-45', 492, 330], ['M480 440 L600 560 L700 660 L760 740', '', 0, 0], ['M40 478 L150 470 L480 440 L660 470 L860 505 L1000 512', 'I-10', 300, 452], ['M820 0 L770 115 L655 240 L600 300 L480 440 L330 610 L230 700 L200 740', 'US-59', 610, 280], ['M480 440 L230 255 L60 140', '290', 330, 318], ['M520 470 L660 560 L820 590', '225', 760, 576]],
    rings:[[75, 70, '610'], [215, 195, 'BW 8'], [350, 320, '99']] },
  dallas:{ vb:'100 220 840 470', center:[520, 450, 'Dallas'], water:'M830 300 Q870 340 862 420 Q846 452 826 404 Q808 350 830 300Z',
    roads:[['M470 220 L520 450 L545 690', 'I-35E', 488, 290], ['M100 500 L520 450 L940 470', 'I-30', 860, 467], ['M100 640 L940 640', 'I-20', 200, 640], ['M300 300 Q500 215 720 290 L760 420 L740 560', 'I-635', 600, 248], ['M520 450 L650 690', 'I-45', 610, 610], ['M100 420 L330 400 L520 450', '183', 200, 412]], rings:[] } };
function mapHTML(list, cart){
  const M = MAPS[S.region], [cx, cy, cn] = M.center, boxes = [], pins = [];
  list.slice().sort((a, b) => a.y - b.y).forEach(l => { const w = 82, hgt = 30; let dx = 0, dy = 0;
    for (const [ox, oy] of [[0,0],[0,34],[0,-34],[86,0],[-86,0],[86,34],[-86,34],[0,68],[86,-34],[-86,-34],[0,-68]]){ const x = l.x + ox - w / 2, y = l.y + oy - hgt - 8;
      if (!boxes.some(b => x < b[0] + b[2] && x + w > b[0] && y < b[1] + b[3] && y + hgt > b[1])){ dx = ox; dy = oy; break; } }
    boxes.push([l.x + dx - w / 2, l.y + dy - hgt - 8, w, hgt]); pins.push({ l, dx, dy }); });
  const svg = `<svg viewBox="${M.vb}" role="img" aria-label="${T('Mapa de ', 'Map of ') + REG[S.region]}" preserveAspectRatio="xMidYMid meet"><rect x="-100" y="-100" width="1300" height="1300" class="mx-land"/><path d="${M.water}" class="mx-water"/>
    ${M.rings.map(([rx, ry, n]) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" class="mx-road ${n === '99' ? 'mx-road2' : ''}"/><text x="${cx}" y="${cy - ry + 5}" class="mx-shield">${n}</text>`).join('')}
    ${M.roads.map(([d, n, x, y]) => `<path d="${d}" class="mx-road"/>${n ? `<text x="${x}" y="${y}" class="mx-shield">${n}</text>` : ''}`).join('')}

    ${AREAS[S.region].map(([n, x, y]) => `<text x="${x}" y="${y + 52}" class="mx-areal ${S.areas.includes(n) ? 'on' : ''}">${E(n.toUpperCase())}</text>`).join('')}
    ${pins.map(({ l, dx, dy }) => `<g class="mx-pin st-${l.status} ${S.sel.has(l.id) ? 'on' : ''}" aria-hidden="true">${dx || dy ? `<line x1="${l.x}" y1="${l.y}" x2="${l.x + dx}" y2="${l.y + dy - 8}" class="mx-lead"/>` : ''}<circle cx="${l.x}" cy="${l.y}" r="5" class="mx-dot"/></g>`).join('')}
    ${pins.map(({ l, dx, dy }) => `<g class="mx-pin st-${l.status} ${S.sel.has(l.id) ? 'on' : ''}" data-mxopen="${l.id}" tabindex="0" role="button" aria-label="${E(l.addr)} ${F.price(l.price)}">
      <g transform="translate(${l.x + dx},${l.y + dy})"><rect x="-41" y="-38" width="82" height="30" rx="8"/>${dx || dy ? '' : '<path d="M-7 -9 L0 -1 L7 -9Z"/>'}<text y="-17">${F.k(l.price)}</text></g></g>`).join('')}</svg>`;
  return `<div class="mx-mapw"><div class="mx-map">${svg}</div><div class="mx-legend">${Object.keys(ST).map(s => `<span><i class="lg-${s}"></i>${T(ST[s][0], ST[s][1])}</span>`).join('')}<span><i class="lg-on"></i>${T('Seleccionada', 'Selected')}</span><span class="muted">${T('Toque un precio para ver la casa.', 'Tap a price to see the home.')}</span></div>
    <div class="mx-maplist">${list.map(l => `<div class="mx-ml ${S.sel.has(l.id) ? 'on' : ''}" data-mxopen="${l.id}"><label class="mx-ml-ck"><input type="checkbox" data-mxsel="${l.id}" ${S.sel.has(l.id) ? 'checked' : ''} aria-label="${T('Seleccionar', 'Select')} ${E(l.addr)}"></label>${H.ui.photo(l, 0)}<div><span class="mx-r1"><b>${F.price(l.price)}</b> ${stChip(l.status)}</span><small>${E(l.addr)} · ${E(l.area)}</small><small>${l.beds}/${l.baths} · ${F.num(l.sqft)} ${T('pies²', 'sq ft')}${cart.includes('l' + l.id) ? ' · ' + T('en la lista', 'in list') : ''}</small></div></div>`).join('')}</div></div>`;

/* ---------- new construction ---------- */
function ncHTML(){
  const comms = NC.filter(c => S.ncReg === 'all' || c.region === S.ncReg);
  if (S.comm && !comms.some(c => c.id === S.comm)) S.comm = null;
  const wide = window.innerWidth >= 900, cur = commOf(S.comm) || (wide ? comms[0] : null);
  const stats = c => { let pl = 0, rec = 0, act = 0, last = 999; c.builders.forEach(b => b.plans.forEach(p => { pl++; p.act.forEach(a => { if (a.kind === 'active') act++; else { rec++; if (a.kind === 'sold') last = Math.min(last, a.days); } }); })); return { pl, rec, act, last }; };
  const list = `<aside class="mx-ncl ${cur && !wide ? 'hide' : ''}"><div class="mx-ncl-h">${seg('data-mxncreg', S.ncReg, [['all', T('Todas', 'All')], ['houston', 'Houston'], ['dallas', 'Dallas–FW']])}</div>` + comms.map(c => { const s = stats(c);
    return `<button type="button" class="mx-cm ${cur && cur.id === c.id ? 'on' : ''}" data-mxcomm="${c.id}"><span class="mx-cm-ic">${ico('building')}</span><span class="mx-cm-t"><b>${E(c.name)}</b><small>${E(c.area)} · ${REG[c.region]}</small><small>${c.builders.length} ${T(c.builders.length === 1 ? 'constructor' : 'constructores', c.builders.length === 1 ? 'builder' : 'builders')} · ${s.pl} ${T('planos', 'plans')} · ${s.act} ${T('activas', 'active')}</small><small class="mx-cm-r">${s.rec} ${T('vendidas o bajo contrato (180 días)', 'sold or under contract (180 days)')}</small></span>${ico('right', 'mx-cm-go')}</button>`; }).join('') + `</aside>`;
  if (!cur) return `<div class="mx-nc">${list}</div>`;
  const det = `<section class="mx-ncd"><div class="mx-ncd-h">${!wide ? `<button class="btn btn-sm" type="button" data-mxcommx>${ico('left')}${T('Comunidades', 'Communities')}</button>` : ''}<div><h2>${E(cur.name)}</h2><p class="muted">${E(cur.area)} · ${REG[cur.region]} · ${T('Planos con casas activas y con ventas o contratos de los últimos 180 días: no todos los planos salen activos en el MLS, así que llame al asesor del constructor.', 'Plans with active homes and sales or contracts from the last 180 days: not every plan shows as active on the MLS, so call the builder\'s sales consultant.')}</p></div></div>` +
    cur.builders.map(b => builderHTML(cur, b)).join('') + `</section>`;
  return `<div class="mx-nc">${list}${det}</div>`;
}
function builderHTML(cm, b){
  const fix = bnames[b.key], k = b.key + '|' + cm.area, cs = cons[k] || [];

    <div class="mx-cons"><div class="mx-cons-h"><b>${ico('users')}${T('Asesores de ventas del constructor en ', 'Builder sales consultants in ')}${E(cm.area)}</b><button class="btn btn-sm" type="button" data-mxcadd="${E(k)}">${ico('plus')}${T('Agregar asesor', 'Add consultant')}</button></div>
    ${cs.length ? cs.map(x => consRow(k, x)).join('') : `<p class="muted mx-cons-e">${T('Nadie guardado todavía. Cuando hable con el asesor de la casa modelo, guarde su nombre y número aquí para todo el equipo.', 'Nobody saved yet. When you talk to the model-home consultant, save their name and number here for the whole team.')}</p>`}
    <p class="sample">${ico('flag')}${T('El agente que aparece en el MLS en casas de constructor casi nunca es el asesor de ventas del constructor.', 'The agent on the MLS for builder homes is usually not the builder\'s sales consultant.')}</p></div>
    <div class="mx-plans"><div class="mx-pl mx-pl-h"><span>${T('Plano', 'Plan')}</span><span class="r">${T('Rec/Baños', 'Bd/Ba')}</span><span class="r">${T('Pies²', 'Sq ft')}</span><span class="r">${T('Desde', 'From')}</span><span class="r">${T('Lotes', 'Lots')}</span><span>${T('Últimos 180 días', 'Last 180 days')}</span><span></span></div>
    ${b.plans.map(p => planRow(p)).join('')}</div></div>`;
}
const callAgo = ts => { const a = F.ago(ts); return /^(ahora|now|ayer|yesterday)$/.test(a) ? a : T('hace ' + a, a + ' ago'); };
const lastCall = x => x.lastCall ? `<small class="mx-lastc">${ico('phone')}${T('Última llamada: ', 'Last call: ')}${callAgo(x.lastCall.at)} · ${T('por ', 'by ')}${E((H.user(x.lastCall.by) || {}).name || '—')}</small>` : '';

  <div class="mx-con-a"><button class="btn btn-sm" type="button" data-mxccall="${E(k)}|${x.id}" aria-label="${T('Llamar a ', 'Call ')}${E(x.name)} ${E(x.phone)}">${ico('phone')}${T('Llamar', 'Call')}</button><button class="btn btn-sm btn-ghost" type="button" data-mxcedit="${E(k)}|${x.id}" aria-label="${T('Editar', 'Edit')}">${ico('note')}</button><button class="btn btn-sm btn-ghost" type="button" data-mxcdel="${E(k)}|${x.id}" aria-label="${T('Quitar', 'Remove')}">${ico('trash')}</button></div></div>`;
function planLine(p){ const sold = p.act.filter(a => a.kind === 'sold'), uc = p.act.filter(a => a.kind === 'uc'), act = p.act.filter(a => a.kind === 'active'), out = [];

function smartPicks(c){ const out = [], add = (key, why) => { let o = out.find(x => x.key === key); if (!o){ o = { key, why:[] }; out.push(o); } if (!o.why.includes(why)) o.why.push(why); };
  const live = H.listings.filter(l => l.region === (c.region || 'houston') && DEF_ST.includes(l.status)), max = (c.budget || 300000) * 1.1;
  const mix = live.filter(l => l.price <= max * 1.15).sort((a, b) => ((a.id * 31 + c.id * 7) % 97) - ((b.id * 31 + c.id * 7) % 97));
  if (c.app){ mix.slice(0, Math.min(2, c.app.saves)).forEach(l => add('l' + l.id, 'saved')); if (c.app.views) mix.slice(2, 4).forEach(l => add('l' + l.id, 'viewed')); }
  live.filter(l => (c.areas || []).includes(l.area) && l.price <= max).forEach(l => { if (NOW - l.dom * DAY > c.lastContact) add('l' + l.id, 'new'); add('l' + l.id, 'area'); });
  const rank = o => o.why.includes('saved') ? 0 : o.why.includes('viewed') ? 1 : o.why.includes('new') ? 2 : 3;
  return out.sort((a, b) => rank(a) - rank(b)).slice(0, 6); }
const WHY = { saved:['La guardó en la app', 'Saved in the app'], viewed:['La vio en la app', 'Viewed in the app'], new:['Nueva desde su último contacto', 'New since last contact'], area:['En su área y presupuesto', 'In their area and budget'], cart:['En su lista', 'In their list'] };
const linkFor = (cid, keys) => { let h = cid * 131; keys.slice().sort().join().split('').forEach(ch => h = (h * 33 + ch.charCodeAt(0)) % 1679616); return HOST + '/lista/' + h.toString(36).padStart(4, '0'); };
function areaWords(its, lang){ const t = (es, en) => lang === 'en' ? en : es, a = [...new Set(its.map(i => i.area))];
  return a.length === 1 ? a[0] : a.length === 2 ? a.join(t(' y ', ' and ')) : t('el área de ', 'the ') + REG[its[0].region] + t('', ' area'); }
function draft(c, its, ch){ const L = c.lang === 'en' ? 'en' : 'es', t = (es, en) => L === 'en' ? en : es, n = its.length, nm = c.first ? ' ' + c.first : '', me = H.me(), link = linkFor(c.id, its.map(i => i.key)), aw = areaWords(its, L), meFirst = me.name.split(' ')[0];

    `Hi${nm}, here ${n === 1 ? 'is a home' : 'are ' + n + ' homes'} in ${aw} I think you'll like: ${link}\nIf you'd like to see ${n === 1 ? 'it' : 'any of them'}, just reply here. – ${meFirst}, Jason Aguirre Group`), link };
  return { subj: t(`${n === 1 ? 'Una casa' : n + ' casas'} en ${aw} para usted`, `${n === 1 ? 'A home' : n + ' homes'} in ${aw} for you`), link,
    msg: t(`Hola${nm}:\n\nLe mando ${n === 1 ? 'una casa' : n + ' casas'} en ${aw} que creo que le ${n === 1 ? 'va' : 'van'} a gustar. ${n === 1 ? 'La' : 'Las'} puede ver con fotos aquí, en la app JAG Homes:\n${link}\n\nSi quiere ir a ver${n === 1 ? 'la' : ' alguna'} o tiene preguntas, contésteme este correo o llámeme al ${me.line}.\n\n${me.name}\nJason Aguirre Group · eXp Realty`,
      `Hi${nm},\n\nHere ${n === 1 ? 'is a home' : 'are ' + n + ' homes'} in ${aw} I think you'll like. You can see ${n === 1 ? 'it' : 'them'} with photos here, in the JAG Homes app:\n${link}\n\nIf you'd like to see ${n === 1 ? 'it' : 'any of them'} or have questions, reply to this email or call me at ${me.line}.\n\n${me.name}\nJason Aguirre Group · eXp Realty`) }; }
H.sendHomes = (clientId, opts = {}) => {
  const c = H.client(clientId); if (!c) return H.toast(T('No encontré a ese cliente.', 'Could not find that client.'));
  const cart = carts[c.id] || [], snt = sent[c.id] || {};

    : opts.keys && opts.keys.length ? opts.keys.map(k => ({ key:k, why:[], on:true }))
    : cart.map(k => ({ key:k, why:['cart'], on:!snt[k] })).concat(smartPicks(c).filter(p => !cart.includes(p.key)).map(p => ({ ...p, on:!snt[p.key] })));
  rows = rows.filter(r => item(r.key)); const CS = { ch:'text', edited:false };

    <div class="field" id="mxSubjW" hidden><label for="mxSubj">${T('Asunto', 'Subject')}</label><input id="mxSubj"></div>
    <div class="field"><label for="mxMsg">${T('Mensaje', 'Message')} <span class="muted">· ${c.lang === 'en' ? T('en inglés (idioma del cliente)', "in English (client's language)") : T('en español (idioma del cliente)', "in Spanish (client's language)")}</span></label><textarea id="mxMsg" rows="5"></textarea></div>
    <div class="mx-lbl">${T('Así lo ve el cliente', 'What the client sees')}</div><div class="mx-pv" id="mxPv"></div>
    <button class="btn btn-pri btn-block" type="button" data-mxgo id="mxGo"></button><p class="sample" id="mxFrom"></p></div></div>`, { wide:true });
  const paintRows = () => { s.querySelector('#mxRows').innerHTML = rows.length ? rows.map((r, i) => { const it = item(r.key); return `<label class="mx-ci ${r.on ? '' : 'off'}"><input type="checkbox" data-mxrow="${i}" ${r.on ? 'checked' : ''}><img src="${it.img}" alt=""><span class="mx-ci-t"><span class="mx-r1"><b>${F.price(it.price)}</b> ${it.kind === 'l' ? stChip(it.l.status) : it.chip}</span><span>${E(it.title)}</span><small>${E(it.sub)}</small><span class="mx-why">${r.why.map(w => `<i>${T(WHY[w][0], WHY[w][1])}</i>`).join('')}${snt[r.key] ? `<i class="sent">${T('Ya enviada ', 'Already sent ')}${F.ago(snt[r.key])}</i>` : ''}</span></span></label>`; }).join('')
      : `<div class="mx-empty">${ico('home')}<p class="muted">${T('No hay casas en su área y presupuesto ahora. Búsquelas en Matrix.', 'No homes in their area and budget right now. Find some in Matrix.')}</p><button class="btn btn-sm" type="button" data-mxmore>${T('Abrir Matrix', 'Open Matrix')}</button></div>`;
    s.querySelector('#mxCn2').textContent = '· ' + its().length + T(' elegidas', ' chosen'); };
  const paintMsg = () => { const list = its(), n = list.length; if (!CS.edited && n){ const d = draft(c, list, CS.ch); s.querySelector('#mxMsg').value = d.msg; s.querySelector('#mxSubj').value = d.subj; }
    s.querySelector('#mxSubjW').hidden = CS.ch !== 'email'; const link = n ? linkFor(c.id, list.map(i => i.key)) : '';
    const msg = s.querySelector('#mxMsg').value, body = E(msg).replace(new RegExp(link.replace(/[.*+?^${}()|[\]\\/]/g, '\\$&'), 'g'), `<u>${link}</u>`).replace(/\n/g, '<br>');
    s.querySelector('#mxPv').innerHTML = !n ? `<p class="muted">${T('Elija al menos una casa.', 'Pick at least one home.')}</p>` : CS.ch === 'text' ? `<div class="mx-bub">${body}</div><div class="mx-card"><img src="${list[0].img}" alt=""><span><b>${n === 1 ? T('1 casa', '1 home') : n + T(' casas', ' homes')} · Jason Aguirre Group</b><small>${link} · JAG Homes</small></span></div>`

  });
};

/* ---------- events ---------- */
function onInput(e){ if (e.target.id === 'mxQ') sugg(e.target.value); }
function onChange(e){ const t = e.target, d = t.dataset;

function onClick(e){ const t = e.target, g = a => t.closest('[' + a + ']'), v = (el, a) => el.getAttribute(a); let el;

    H.undoable({ msg: T('Quitada de la lista', 'Removed from the list'), run: () => { carts[cid].splice(idx, 1); saveAll(); openCart(); refresh(); }, undo: () => { carts[cid].splice(idx, 0, k); saveAll(); openCart(); refresh(); } }); return; }
  if (g('data-mxclrsel')){ S.sel.clear(); paintRes(); return; }

  if ((el = g('data-mxccall'))){ const p = v(el, 'data-mxccall').split('|'), x = (cons[p[0] + '|' + p[1]] || []).find(y => y.id == p[2]); if (!x) return;
    x.lastCall = { at: Date.now(), by: H.me().id }; saveAll(); H.toast(T('Marcando a ', 'Dialing ') + x.name + ' · ' + x.phone + '…'); refresh();
    const ln = el.closest('.mx-con') && el.closest('.mx-con').querySelector('.mx-con-t'); if (ln){ const o = ln.querySelector('.mx-lastc'); o ? o.outerHTML = lastCall(x) : ln.insertAdjacentHTML('beforeend', lastCall(x)); } return; }

  if ((el = g('data-mxcedit'))){ const p = v(el, 'data-mxcedit').split('|'); consForm(p[0] + '|' + p[1], p[2]); return; }

    H.undoable({ msg: T('Asesor quitado: ', 'Consultant removed: ') + x.name, run: () => { list.splice(idx, 1); saveAll(); refresh(); }, undo: () => { list.splice(idx, 0, x); saveAll(); refresh(); } }); return; }

  if (g('data-mxcommx')){ S.comm = null; paintBody(); return; }
  if ((el = g('data-mxncreg'))){ S.ncReg = v(el, 'data-mxncreg'); S.comm = null; paintBody(); return; }

document.addEventListener('click', e => { if (R && !e.target.closest('.mx-pick')){ const b = R.querySelector('#mxSug'); b && b.classList.remove('on'); } });

}

{ const r = H.rng(911); const sh = H.clients.filter(c => c.stage === 'Showing Homes'), uc = H.clients.filter(c => c.stage === 'Under Contract');

const dlKey = (cid, kind, extra = '') => cid + ':' + kind + (extra ? ':' + extra : '');
H.dlAct = (key, act, opt = {}) => { const prev = dl[key];

  const c = H.client(Number(String(key).split(':')[0])); if (c) H.emit('client', c);
