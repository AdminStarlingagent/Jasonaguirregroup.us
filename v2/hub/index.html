.mk-cols{gap:6px}
}

/* ---- matrix.css ---- */
/* Matrix: cleaner HAR Matrix inside the FUB-like workspace */
.pg-matrix{padding:16px 18px 40px}
.mx-top{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.mx-ttl{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.mx-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex:1;min-width:260px}
.mx-tabs button{border:0;background:none;display:inline-flex;align-items:center;gap:7px;padding:10px 14px;font-weight:700;font-size:14px;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px;min-height:44px}
.mx-tabs button svg{width:18px;height:18px}
.mx-tabs button[aria-selected=true]{color:var(--acc-d);border-bottom-color:var(--acc)}
.mx-for{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mx-forl{font-size:12.5px;font-weight:700;color:var(--mute);white-space:nowrap}
.mx-free{font-size:13px;color:var(--mute)}
.mx-pick{position:relative;flex:1;max-width:420px;min-width:220px}
.mx-pick input{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;padding:0 12px 0 36px;background:var(--canvas)}
.mx-pick-i svg{position:absolute;left:11px;top:11px;width:18px;height:18px;color:var(--mute)}
.mx-sug{position:absolute;top:44px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(23,22,28,.14);padding:6px;display:none;z-index:15;max-height:60vh;overflow:auto}
.mx-sug.on{display:block}
.mx-sug h6{margin:4px 8px;font-size:12px;color:var(--mute);font-weight:600}
.mx-sug p{margin:6px 8px}
.mx-sug button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 8px;border-radius:8px;text-align:left;min-height:44px}
.mx-sug button:hover{background:var(--acc-t)}
.mx-sug button>svg{width:18px;height:18px;color:var(--mute);margin:0 3px}
.mx-sug-t small,.mx-sug-t b{display:block}
.mx-sug-t small{color:var(--mute);font-size:12px}
.mx-who{display:flex;align-items:center;gap:10px;flex:1;min-width:240px}
.mx-who-t{display:flex;flex-direction:column;gap:1px}
.mx-who-t>div{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mx-who-t small{color:var(--mute);font-size:12.5px}
.mx-who-t .mx-q{color:var(--body)}
.mx-who-a{display:flex;gap:6px;flex-wrap:wrap}
.mx-lnk{border:0;background:none;padding:0;color:var(--acc-d);font-weight:700;cursor:pointer;font-size:inherit;text-align:left}
.mx-lnk b{color:var(--ink);font-size:15px}
.mx-lnk:hover b{color:var(--acc-d);text-decoration:underline}
.mx-badge{font-style:normal;min-width:20px;height:20px;border-radius:10px;background:var(--line2);color:var(--mute);font-size:11.5px;font-weight:800;display:inline-grid;place-items:center;padding:0 6px}
.mx-badge.on{background:var(--acc);color:#fff}
.mx-mono{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--body)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* layout: criteria left on computers */
.mx-search{display:grid;grid-template-columns:268px minmax(0,1fr);gap:14px;align-items:start}
.mx-crit{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;position:sticky;top:0;max-height:calc(100vh - 120px);overflow:auto}
.mx-crit-h{display:flex;align-items:center;gap:8px;margin:-2px 0 8px}
.mx-crit-h b{flex:1;font-size:15px}
.mx-x{display:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--canvas);place-items:center}
.mx-x svg{width:18px;height:18px}
.mx-scrim,.mx-fbtn,.mx-seen{display:none}
.mx-filled{display:flex;gap:7px;align-items:flex-start;background:var(--acc-t);color:var(--acc-d);border-radius:9px;padding:8px 10px;font-size:12.5px;margin:0 0 10px}
.mx-filled svg{width:16px;height:16px;flex:none;margin-top:1px}
.mx-f{padding:9px 0;border-top:1px solid var(--line2)}
.mx-lbl{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--body);margin-bottom:6px}
.mx-lbl small{font-weight:700;background:var(--acc-t);color:var(--acc-d);border-radius:9px;padding:0 6px}
.mx-lbl small.muted{background:none;color:var(--mute);font-weight:600}
.mx-lbl .mx-lnk{margin-left:auto;font-size:12.5px}
.mx-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mx-f .field{gap:0}
.mx-f .field select{min-height:38px;padding:6px 8px}
.mx-seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.mx-seg button{flex:1;border:0;border-right:1px solid var(--line);background:#fff;min-height:36px;padding:0 8px;font-weight:700;font-size:13px;color:var(--body);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.mx-seg button:last-child{border-right:0}
.mx-seg button svg{width:17px;height:17px}
.mx-seg button[aria-pressed=true]{background:var(--acc-t);color:var(--acc-d)}
.mx-seg button:disabled{opacity:.45;cursor:not-allowed}
.mx-chips{display:flex;flex-wrap:wrap;gap:5px}
.mx-chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:0 10px;min-height:30px;font-size:12.5px;font-weight:600;color:var(--body)}
.mx-chips button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.mx-checks{display:flex;flex-direction:column;gap:2px}
.mx-checks label,.mx-check1{display:flex;align-items:center;gap:8px;font-size:13.5px;min-height:30px;cursor:pointer}
.mx-checks input,.mx-check1 input,.mx-tbl input,.mx-crd-ck input,.mx-th-ck input,.mx-ml input,.mx-ci input{width:18px;height:18px;accent-color:var(--acc);margin:0;flex:none}
.mx-crit-f{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line2)}
.mx-crit-f .btn{white-space:normal;text-align:left;justify-content:flex-start;min-height:44px}
.mx-crit-f .sample{margin:0}
/* results bar */
.mx-res{min-width:0}
.mx-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.mx-count{flex:1;font-size:14px;min-width:140px}
.mx-count b{font-size:17px}
.mx-sortl{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--mute)}
.mx-sortl select{border:1px solid var(--line);border-radius:9px;min-height:36px;padding:0 8px;background:#fff;font-size:13px}
.mx-bar .mx-seg{flex:none}
.mx-bar .mx-seg button{padding:0 12px}
.mx-selbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--acc-t);border:1px solid #CFE4F5;border-radius:10px;padding:8px 10px;margin-bottom:10px;position:sticky;top:0;z-index:5}
.mx-selbar b{color:var(--acc-d);margin-right:4px}
/* grid (table) */
.mx-tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
.mx-tbl{border-collapse:collapse;width:100%;min-width:940px;font-size:13px}
.mx-tbl th{position:sticky;top:0;background:#FAFAFB;border-bottom:1px solid var(--line);text-align:left;padding:0 8px;height:38px;font-size:12px;color:var(--mute);font-weight:700;white-space:nowrap}
.mx-tbl th button{border:0;background:none;font:inherit;color:inherit;padding:8px 0;cursor:pointer;white-space:nowrap}
.mx-tbl th button:hover,.mx-tbl th button.on{color:var(--acc-d)}
.mx-tbl td{border-bottom:1px solid var(--line2);padding:6px 8px;vertical-align:middle;white-space:nowrap}
.mx-tbl tbody tr{cursor:pointer}
.mx-tbl tbody tr:hover{background:#F7FAFD}
.mx-tbl tbody tr.on{background:var(--acc-t)}
.mx-tbl tbody tr:last-child td{border-bottom:0}
.mx-tbl .r{text-align:right}
.mx-tbl .mx-ck{width:34px;padding-right:0}
.mx-tbl .mx-ph{width:66px}
.mx-tbl .mx-ph img{width:58px;min-width:58px;height:40px;object-fit:cover;border-radius:6px}
.mx-ad b{display:block;font-weight:700;color:var(--ink)}
.mx-ad small{color:var(--mute);font-size:12px}
.mx-incart{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--ok);margin-left:6px}
.mx-incart svg{width:13px;height:13px}
.mx-ad .mx-incart{margin-left:0;display:flex}
.mx-mini{min-width:0}
.mx-r1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mx-cmp [hidden]{display:none}
.mx-chip-ic svg{width:13px;height:13px;flex:none}
.mx-mini td{white-space:normal}
.mx-cards{display:none}
/* thumbnails */
.mx-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mx-th{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.mx-th.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-t)}
.mx-th-ph{position:relative;cursor:pointer}
.mx-th-ph img{width:100%;aspect-ratio:4/3;object-fit:cover}
.mx-th-st{position:absolute;right:8px;bottom:8px}
.mx-th-st .chip{box-shadow:0 1px 4px rgba(0,0,0,.15)}
.mx-th-st .chip:not(.ink):not(.blue):not(.green):not(.warn){background:#fff}
.mx-th-ck{position:absolute;left:8px;top:8px;background:#fff;border-radius:8px;width:34px;height:34px;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.2);cursor:pointer}
.mx-th-b{padding:10px 12px 6px;display:flex;flex-direction:column;gap:2px;cursor:pointer;flex:1}
.mx-th-p{font-size:17px}
.mx-th-b small{font-size:12.5px;color:var(--body)}
.mx-th-b small.muted{color:var(--mute)}
.mx-th-a{font-weight:600;font-size:13.5px}
.mx-th-f{padding:6px 12px 12px}
.mx-th-f .mx-incart{margin:0;min-height:34px}
/* map */
.mx-mapw{display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto 1fr;grid-template-areas:"map list" "leg list";gap:10px;align-items:start}
.mx-map{grid-area:map;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto}
.mx-map svg{display:block;width:100%;height:auto;min-width:560px}
.mx-land{fill:#F4F3EF}
.mx-water{fill:#D6E8F5}
.mx-road{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 1px #C9C6BC)}
.mx-road2{stroke-dasharray:18 10;stroke-width:6}
.mx-shield{font:800 15px 'Plus Jakarta Sans',sans-serif;fill:#8B8778;text-anchor:middle;paint-order:stroke;stroke:#F4F3EF;stroke-width:5px}
.mx-city{fill:#8B8778}
.mx-cityl{font:800 17px 'Plus Jakarta Sans',sans-serif;fill:#6B6858}
.mx-areal{font:700 14px 'Plus Jakarta Sans',sans-serif;fill:#A5A293;text-anchor:middle;letter-spacing:.06em;paint-order:stroke;stroke:#F4F3EF;stroke-width:4px}
.mx-areal.on{fill:var(--acc-d)}
.mx-pin{cursor:pointer}
.mx-pin[aria-hidden]{cursor:default;pointer-events:none}
.mx-pin rect{fill:#fff;stroke:var(--ok);stroke-width:2.5}
.mx-pin path{fill:var(--ok)}
.mx-pin text{font:800 18px 'Plus Jakarta Sans',sans-serif;fill:var(--ink);text-anchor:middle;dominant-baseline:middle}
.mx-pin .mx-dot{fill:var(--ok);stroke:#fff;stroke-width:2}
.mx-pin .mx-lead{stroke:#8B8778;stroke-width:1.5}
.mx-pin.st-new rect{stroke:var(--acc)}.mx-pin.st-new path,.mx-pin.st-new .mx-dot{fill:var(--acc)}
.mx-pin.st-reduced rect{stroke:var(--warn)}.mx-pin.st-reduced path,.mx-pin.st-reduced .mx-dot{fill:var(--warn)}
.mx-pin.st-pending rect{stroke:#9A98A3}.mx-pin.st-pending path,.mx-pin.st-pending .mx-dot{fill:#9A98A3}
.mx-pin.st-sold rect{stroke:var(--ink);fill:#EDEDF0}.mx-pin.st-sold path,.mx-pin.st-sold .mx-dot{fill:var(--ink)}
.mx-pin.on rect{fill:var(--acc);stroke:var(--acc-d)}.mx-pin.on text{fill:#fff}
.mx-pin:hover rect,.mx-pin:focus rect{stroke-width:4}
.mx-pin:focus{outline:none}
.mx-legend{grid-area:leg;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--body);align-items:center}
.mx-legend span{display:inline-flex;align-items:center;gap:5px}
.mx-legend i{width:12px;height:12px;border-radius:4px;border:2.5px solid var(--ok);background:#fff}
.mx-legend .lg-new{border-color:var(--acc)}.mx-legend .lg-reduced{border-color:var(--warn)}.mx-legend .lg-pending{border-color:#9A98A3}.mx-legend .lg-sold{border-color:var(--ink);background:#EDEDF0}.mx-legend .lg-on{background:var(--acc);border-color:var(--acc-d)}
.mx-maplist{grid-area:list;background:#fff;border:1px solid var(--line);border-radius:12px;max-height:620px;overflow:auto}
.mx-ml{display:flex;gap:9px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line2);cursor:pointer}
.mx-ml:last-child{border-bottom:0}
.mx-ml:hover{background:#F7FAFD}
.mx-ml.on{background:var(--acc-t)}
.mx-ml img{width:64px;height:46px;object-fit:cover;border-radius:6px;flex:none}
.mx-ml>div{display:flex;flex-direction:column;gap:1px;font-size:13px}
.mx-ml>div .chip{height:20px;font-size:11px;padding:0 7px}
.mx-ml small{color:var(--mute);font-size:12px}
/* empty */
.mx-empty{background:#fff;border:1px dashed #D5D3DC;border-radius:12px;padding:32px 20px;text-align:center}
.mx-empty>svg{width:34px;height:34px;color:var(--mute)}
.mx-empty h3{margin:8px 0 4px;font-size:16px}
.mx-empty p{margin:0 0 14px}
.mx-empty div{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.mx-foot{margin:12px 2px 0}
/* drawers */
.mx-dw-h{position:sticky;top:0;z-index:2;background:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:13.5px}
.mx-dw-h>span:first-child{flex:1;display:flex;align-items:center;gap:7px}
.mx-dw-h>span:first-child svg{width:18px;height:18px}
.mx-dw-h .mx-x{display:grid}
.mx-gal-m img{width:100%;aspect-ratio:16/10;object-fit:cover}
.mx-gal-t{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:4px}
.mx-gal-t button{border:2px solid transparent;padding:0;border-radius:6px;overflow:hidden;background:none;min-height:44px}
.mx-gal-t button.on{border-color:var(--acc)}
.mx-gal-t img{width:100%;aspect-ratio:4/3;object-fit:cover}
.mx-dw-b{padding:14px 16px 28px}
.mx-dw-b h4{margin:18px 0 8px;font-size:13.5px;display:flex;align-items:center;gap:6px}
.mx-dw-b h4 svg{width:17px;height:17px;color:var(--mute)}
.mx-price{font-size:24px;font-weight:800;letter-spacing:-.02em;display:flex;flex-direction:column}
.mx-price small{font-size:13.5px;font-weight:600;color:var(--body);letter-spacing:0}
.mx-dw-a{margin:4px 0 12px;color:var(--body)}
.mx-acts{display:flex;gap:8px;flex-wrap:wrap}
.mx-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mx-facts div{padding:7px 10px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;gap:8px;font-size:13px}
.mx-facts div:nth-child(odd){border-right:1px solid var(--line2)}
.mx-facts dt{color:var(--mute)}
.mx-facts dd{margin:0;font-weight:700;text-align:right}
.mx-facts1{grid-template-columns:1fr}
.mx-facts1 div:nth-child(odd){border-right:0}
.mx-dw-nc{margin-top:6px}
.mx-dw-nc .mx-con{padding:7px 0}
.mx-team{display:flex;gap:10px;margin-top:18px;background:var(--canvas);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--body)}
.mx-team>svg{width:18px;height:18px;flex:none;color:var(--mute)}
.mx-ci{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.mx-ci img{width:72px;height:52px;object-fit:cover;border-radius:7px;flex:none}
.mx-ci input{margin-top:16px}
.mx-ci.off{opacity:.55}
.mx-ci-t{flex:1;display:flex;flex-direction:column;gap:1px;font-size:13px}
.mx-ci-t .chip{height:20px;font-size:11px;padding:0 7px;vertical-align:1px}
.mx-ci-t small{color:var(--mute);font-size:12px}
.mx-ok{color:var(--ok);font-weight:700;display:inline-flex;align-items:center;gap:4px}
.mx-ok svg{width:14px;height:14px}
.mx-warn{color:var(--warn);font-weight:700}
/* composer */
.mx-cm-sub{margin:0 40px 12px 0}
.mx-cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.mx-cmp-l{max-height:62vh;overflow:auto;padding-right:4px}
.mx-cmp-r{display:flex;flex-direction:column;gap:10px}
.mx-chs button{min-height:50px;justify-content:flex-start;padding:6px 12px;text-align:left}
.mx-chs button span{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.mx-chs button small{font-weight:500;color:var(--mute);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.mx-why{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.mx-why i{font-style:normal;font-size:11px;font-weight:700;background:var(--acc-t);color:var(--acc-d);border-radius:6px;padding:1px 6px}
.mx-why i.sent{background:var(--ok-t);color:var(--ok)}
.mx-pv{background:var(--canvas);border:1px solid var(--line);border-radius:12px;padding:12px}
.mx-bub{background:#E9E9EE;border-radius:16px 16px 16px 4px;padding:9px 12px;font-size:13.5px;max-width:92%;line-height:1.4}
.mx-bub u,.mx-mail u{color:var(--acc-d)}
.mx-card{display:flex;gap:9px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;margin-top:6px;max-width:92%}
.mx-card img{width:64px;height:48px;object-fit:cover;border-radius:8px;flex:none}
.mx-card span{display:flex;flex-direction:column;font-size:12.5px}
.mx-card small{color:var(--mute)}
.mx-mail{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;max-height:260px;overflow:auto}
.mx-mail>b{display:block;margin-bottom:6px;font-size:14px}
.mx-mail-th{display:flex;gap:6px;margin-top:8px}
.mx-mail-th img{width:33%;aspect-ratio:4/3;object-fit:cover;border-radius:6px}
.mx-sum{background:var(--lola-t);color:var(--lola);border-radius:10px;padding:10px 12px;font-weight:700;font-size:13.5px}
.mx-freq{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mx-freq label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;min-height:44px}
.mx-freq label:has(input:checked){border-color:var(--acc);background:var(--acc-t)}
.mx-freq input{accent-color:var(--acc);margin-top:3px}
.mx-freq span{display:flex;flex-direction:column}
.mx-freq small{color:var(--mute);font-size:12px}
.mx-err{color:var(--alert);margin:6px 0;min-height:1em;font-size:13px}
.mx-plist{display:flex;flex-direction:column;gap:6px}
.mx-plist .btn{justify-content:space-between;gap:10px;white-space:normal;text-align:left;min-height:46px}
/* new construction */
.mx-nc{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;align-items:start}
.mx-ncl{display:flex;flex-direction:column;gap:8px;position:sticky;top:0}
.mx-ncl-h{margin-bottom:2px}
.mx-cm{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-height:44px}
.mx-cm:hover{border-color:#CFCDD6}
.mx-cm.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-t)}
.mx-cm-ic{width:34px;height:34px;border-radius:9px;background:var(--canvas);display:grid;place-items:center;flex:none;color:var(--body)}
.mx-cm-ic svg{width:19px;height:19px}
.mx-cm-t{flex:1;display:flex;flex-direction:column;gap:1px}
.mx-cm-t small{color:var(--mute);font-size:12px}
.mx-cm-t .mx-cm-r{color:var(--body);font-weight:600}
.mx-cm-go{width:18px;height:18px;color:var(--mute);align-self:center}
.mx-ncd{display:flex;flex-direction:column;gap:12px;min-width:0}
.mx-ncd-h{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.mx-ncd-h h2{margin:0;font-size:20px;letter-spacing:-.01em}
.mx-ncd-h p{margin:2px 0 0;font-size:13px;max-width:760px}
.mx-bld{overflow:hidden}
.mx-bld-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line2)}
.mx-bld-n{flex:1;display:flex;flex-direction:column}
.mx-bld-n b{font-size:15.5px}
.mx-bld-n small{color:var(--mute);font-size:12px}
.mx-cons{padding:10px 14px;background:#FBFBFC;border-bottom:1px solid var(--line2)}
.mx-cons-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.mx-cons-h b{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.mx-cons-h b svg{width:17px;height:17px;color:var(--mute)}
.mx-cons-e{margin:6px 0;font-size:13px}
.mx-cons .sample{display:flex;gap:6px;align-items:flex-start;margin:6px 0 0}
.mx-cons .sample svg{width:14px;height:14px;flex:none;margin-top:2px}
.mx-con{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line2)}
.mx-cons-h+.mx-con{border-top:0}
.mx-con-t{flex:1;display:flex;flex-direction:column;font-size:13.5px}
.mx-con-t small{font-size:12px;color:var(--body)}
.mx-con-t small.muted{color:var(--mute)}
.mx-con-a{display:flex;gap:4px}
.mx-pl{display:grid;grid-template-columns:minmax(150px,1.3fr) 70px 70px 96px 50px minmax(200px,2fr) 108px;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line2);font-size:13px;cursor:pointer}
.mx-pl:last-child{border-bottom:0}
.mx-pl:not(.mx-pl-h):hover{background:#F7FAFD}
.mx-pl-h{cursor:default;font-size:12px;font-weight:700;color:var(--mute);background:#FAFAFB;padding-top:6px;padding-bottom:6px}
.mx-pl .r{text-align:right}
.mx-pl-n{display:flex;flex-direction:column}
.mx-pl-n small{color:var(--mute);font-size:12px}
.mx-pl-a{display:flex;flex-direction:column;gap:1px;font-size:12.5px}
p.mx-pl-a{margin:0 0 10px}
.mx-pl-b{text-align:right}
.mx-pl-b .mx-incart{margin:0}
@media(max-width:1180px){.mx-pl{grid-template-columns:minmax(130px,1.2fr) 60px 64px 90px 44px minmax(170px,2fr) 100px}}
/* tablets: criteria fold above results */
@media(max-width:1099px){
.mx-search{grid-template-columns:minmax(0,1fr)}
.mx-crit{display:none;position:static;max-height:none}
.mx-search.crit-on .mx-crit{display:block}
.mx-crit .mx-chips button{min-height:36px}
.mx-fbtn{display:inline-flex}
.mx-x{display:grid}
.mx-mapw{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"map" "leg" "list"}
.mx-maplist{max-height:none}
}
@media(max-width:899px){
.mx-nc{grid-template-columns:minmax(0,1fr)}
.mx-ncl{position:static}
.mx-ncl.hide{display:none}
.mx-pl{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 10px}
.mx-pl-h{display:none}
.mx-pl-n{grid-column:1/-1}
.mx-pl .r{text-align:left;display:flex;flex-direction:column;font-size:13px}
.mx-pl .r::before{content:attr(data-l);font-size:11.5px;color:var(--mute);font-weight:600}
.mx-pl-a{grid-column:1/-1}
.mx-pl-b{grid-column:1/-1;text-align:left}
.mx-cmp{grid-template-columns:minmax(0,1fr)}
.mx-cmp-l{max-height:none}
}
/* phones: criteria become a bottom sheet, grid becomes cards */
@media(max-width:759px){
.pg-matrix{padding:12px 12px 28px}
.mx-ttl{gap:8px}
.mx-ttl h1{display:none}
.mx-tabs{min-width:0}
.mx-tabs button{flex:1;justify-content:center;padding:10px 6px}
.mx-for{padding:10px}
.mx-pick{max-width:none;min-width:0;flex-basis:100%}
.mx-who{min-width:0;flex-basis:100%}
.mx-who-a{flex-basis:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mx-who-a .btn{padding:0 8px}
.mx-who-a .btn-pri{grid-column:1/-1}
.mx-search.crit-on .mx-scrim{display:block;position:fixed;inset:0;background:rgba(23,22,28,.4);z-index:72}
.mx-crit{position:fixed;left:0;right:0;bottom:0;z-index:73;max-height:88vh;border-radius:18px 18px 0 0;padding:14px 16px 0;box-shadow:0 -12px 40px rgba(23,22,28,.2)}
.mx-crit-f{position:sticky;bottom:0;background:#fff;padding-bottom:14px;margin:0 -16px;padding-left:16px;padding-right:16px}
.mx-seen{display:inline-flex}
.mx-seg button{min-height:42px}
.mx-chips button{min-height:40px;padding:0 13px}
.mx-checks label,.mx-check1{min-height:40px}
.mx-bar{gap:8px}
.mx-count{order:-1;flex-basis:100%}
.mx-sortl{flex:1}
.mx-sortl span{display:none}
.mx-sortl select{width:100%;min-height:40px}
.mx-bar .mx-seg button span{display:none}
.mx-bar .mx-seg button{min-width:46px}
.mx-tw.mx-tw{display:none}
.mx-dw .mx-tw{display:block}
.mx-cards{display:flex;flex-direction:column;gap:8px}
.mx-crd{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;position:relative;cursor:pointer}
.mx-crd.on{border-color:var(--acc);background:var(--acc-t)}
.mx-crd-ck{position:absolute;left:8px;top:8px;width:40px;height:40px;display:grid;place-items:center;background:#fff;border-radius:9px;box-shadow:0 1px 4px rgba(0,0,0,.18);z-index:1}
.mx-crd-ck input{width:20px;height:20px}
.mx-crd-ph img{width:112px;height:92px;object-fit:cover;border-radius:8px}
.mx-crd-b{flex:1;display:flex;flex-direction:column;gap:1px;font-size:13.5px}
.mx-crd-1{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mx-crd-1 b{font-size:16px}
.mx-crd-b small{color:var(--mute);font-size:12px}
.mx-crd-b .mx-incart{margin:2px 0 0}
.mx-thumbs{grid-template-columns:1fr 1fr;gap:8px}
.mx-th-b{padding:8px 9px 4px}
.mx-th-p{font-size:15px}
.mx-th-f{padding:4px 9px 10px}
.mx-th-f .btn{width:100%;padding:0 6px;font-size:12.5px}
.mx-th-st{right:6px;bottom:6px}
.mx-th-st .chip{height:21px;font-size:11px;padding:0 7px}
.mx-selbar{position:fixed;left:8px;right:8px;bottom:70px;top:auto;z-index:30;box-shadow:0 8px 24px rgba(23,22,28,.18);background:#fff;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mx-selbar b{grid-column:1/-1;margin:0}
.mx-selbar .btn-pri{grid-column:1/-1}
.mx-selbar .btn:only-of-type{grid-column:1/-1}
.mx-freq{grid-template-columns:1fr}
.mx-con{flex-wrap:wrap}
.mx-con-a{flex-basis:100%;padding-left:34px}
.mx-con-a .btn:first-child{flex:1}
.mx-bld-h .btn{padding:0 8px}
.mx-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mx-acts .btn:first-child{grid-column:1/-1}
.mx-acts .btn{padding:0 8px}
.mx-th-ph img{aspect-ratio:16/10}
.mx-cm-sub{margin-right:44px}
}
@media(max-width:420px){.mx-thumbs{grid-template-columns:1fr}.mx-crd-ph img{width:96px;height:84px}}

/* Lola surfaces + consultant call log (after QA) */
.mx-lolab{background:var(--lola-t);border-color:#BFE0DB;color:var(--lola)}
.mx-sum .chip{margin-right:4px;vertical-align:1px}
.mx-lastc{display:inline-flex;align-items:center;gap:4px;color:var(--ok)!important;font-weight:700}
.mx-lastc svg{width:13px;height:13px}
.mx-ml-ck{display:grid;place-items:center;flex:none;width:28px;height:28px;cursor:pointer}
/* phones: 44 px tap targets */
@media(max-width:759px){
.pg-matrix .btn-sm,.mx-dw .btn-sm,.sheet .mx-cmp .btn{min-height:44px}
.mx-dw .btn-sm.btn-ghost,.mx-con-a .btn-ghost{min-width:44px}
.mx-seg button,.mx-bar .mx-seg button{min-height:44px;min-width:48px}
.mx-crit .mx-chips button,.mx-chips button{min-height:44px}
.mx-x,.mx-dw-h .mx-x{width:44px;height:44px}
.mx-lnk{display:inline-flex;align-items:center;min-height:44px}
.mx-filled .mx-lnk{min-height:44px;vertical-align:middle}
.mx-checks label,.mx-check1{min-height:44px}
.mx-sortl select,.mx-f .field select{min-height:44px}
.mx-crd-ck{width:44px;height:44px;left:6px;top:6px}
.mx-th-ck{width:44px;height:44px;left:6px;top:6px}
.mx-ml-ck{width:44px;height:44px;margin:-6px -4px -6px -8px}
.mx-ci input{width:22px;height:22px}
.mx-ci{min-height:56px}
.mx-pl-b .btn{min-height:44px}
}

/* ---- mensajes.css ---- */
/* Mensajes inbox (ms-) */
.pg-mensajes{height:100%}
.ms{height:100%;display:flex;flex-direction:column;background:#fff}
.ms-head{display:flex;align-items:center;gap:12px;padding:14px 18px 12px;border-bottom:1px solid var(--line);flex:none}
.ms-search{position:relative;flex:1;max-width:340px;margin-left:auto}
.ms-search svg{position:absolute;left:10px;top:9px;width:17px;height:17px;color:var(--mute)}
.ms-search input{width:100%;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--canvas);padding:0 10px 0 34px}
.ms-sim{position:relative}
.ms-simm{position:absolute;right:0;top:40px;z-index:30;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(23,22,28,.14);padding:6px;width:240px}
.ms-simm button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px;border-radius:8px;min-height:44px;font-weight:600;text-align:left}
.ms-simm button:hover{background:var(--acc-t)}
.ms-simm svg{width:18px;height:18px;color:var(--mute)}
.ms-fchips{display:none;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:none}
.ms-fc{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13px;white-space:nowrap;flex:none;color:var(--body)}
.ms-fc svg{width:16px;height:16px}
.ms-fc.ms-fcon{background:var(--acc-t);border-color:var(--acc);color:var(--acc-d)}
.ms-wrap{flex:1;min-height:0;display:grid;grid-template-columns:232px 352px minmax(0,1fr)}
/* folders */
.ms-folders{border-right:1px solid var(--line);overflow:auto;padding:10px 8px;background:var(--canvas)}
.ms-fi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:9px;padding:8px 10px;text-align:left;min-height:48px;color:var(--ink)}
.ms-fi:hover{background:#fff}
.ms-fi.ms-fion{background:#fff;box-shadow:inset 3px 0 0 var(--acc);}
.ms-fic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);color:var(--body);flex:none}
.ms-fion .ms-fic{background:var(--acc-t);border-color:transparent;color:var(--acc-d)}
.ms-fic svg{width:16px;height:16px}
.ms-fl{flex:1;min-width:0;display:flex;flex-direction:column}
.ms-fl b{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-fl small{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-cnt{font-style:normal;min-width:20px;height:20px;border-radius:10px;background:var(--acc);color:#fff;font-size:11.5px;font-weight:800;display:grid;place-items:center;padding:0 6px}
.ms-tot{font-style:normal;font-size:12px;color:var(--mute);font-weight:600}
.ms-fh{margin:14px 10px 4px;font-size:11.5px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.ms-fnote{font-size:12px;color:var(--mute);margin:14px 10px 4px;line-height:1.4}
/* list */
.ms-list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ms-lhead{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex:none}
.ms-lhead>div{flex:1;min-width:0;display:flex;flex-direction:column}
.ms-lhead b{font-size:14.5px;font-weight:800}
.ms-lhead small{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-rows{flex:1;overflow:auto;min-height:0}
.ms-row{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line2);cursor:pointer;position:relative;align-items:flex-start}
.ms-row:hover{background:var(--canvas)}
.ms-row.ms-sel{background:var(--acc-t)}
.ms-row:focus-visible{outline-offset:-3px}
.ms-cav{background:#E3E2E8;color:var(--body)}
.ms-cav.ms-noname{background:#fff;border:1.5px dashed #B9B7C2;color:var(--mute)}
.ms-rm{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ms-rt{display:flex;align-items:baseline;gap:8px}
.ms-rn{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-unread .ms-rn{font-weight:800}
.ms-rt time{font-size:12px;color:var(--mute);flex:none}
.ms-unread .ms-rt time{color:var(--acc-d);font-weight:700}
.ms-rp{font-size:13px;color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-unread .ms-rp{color:var(--ink);font-weight:700}
.ms-rc{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.ms-rc .chip{height:20px;font-size:11px;padding:0 7px}
.ms-st,.ms-nn{font-size:11.5px;color:var(--mute);font-weight:600}
.ms-addn{display:inline-flex;align-items:center;gap:3px;border:0;background:none;color:var(--acc-d);font-weight:700;font-size:12px;padding:2px 4px;border-radius:6px;min-height:24px}
.ms-addn svg{width:13px;height:13px}
.ms-addn:hover{background:var(--acc-t)}
.ms-rd{font-size:12px;color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-rd b{color:var(--ink);font-weight:700}
.ms-dot{position:absolute;right:14px;top:34px;width:9px;height:9px;border-radius:50%;background:var(--acc)}
.ms-empty{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--mute);text-align:center;padding:48px 24px;margin:0}
.ms-empty svg{width:28px;height:28px}
/* lola drafts */
.ms-draft{margin:10px 12px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.ms-dh{display:flex;flex-direction:column;margin-bottom:8px}
.ms-dn{border:0;background:none;padding:0;font-weight:800;font-size:14px;text-align:left;color:var(--ink);cursor:pointer}
.ms-dn:hover{color:var(--acc-d);text-decoration:underline}
.ms-dh small{font-size:12px;color:var(--mute)}
.ms-draft textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:var(--lola-t);min-height:128px;resize:vertical;font-size:14px}
.ms-drow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.ms-why{font-size:12.5px;font-weight:700;color:var(--body)}
.ms-drow .chip{border:1px solid var(--line);background:#fff;cursor:pointer;height:32px;font-weight:600}
.ms-drow .chip:hover{border-color:var(--acc);color:var(--acc-d)}
/* conversation */
.ms-conv{display:flex;flex-direction:column;min-height:0;background:#fff}
.ms-none{margin:auto;text-align:center;max-width:340px;padding:24px;color:var(--mute)}
.ms-none>svg{width:34px;height:34px;color:#B9B7C2}
.ms-none b{display:block;color:var(--ink);font-size:16px;margin:8px 0 4px}
.ms-none p{margin:0 0 10px;font-size:13.5px}
.ms-legend{display:flex;gap:6px;justify-content:center}
.ms-ch{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap;position:relative}
.ms-back{display:none;border:0;background:none;width:40px;height:44px;margin-left:-8px;place-items:center;border-radius:8px}
.ms-back svg{width:22px;height:22px}
.ms-chi{flex:1;min-width:0}
.ms-chn{display:flex;align-items:center;gap:8px;min-width:0}
.ms-cname{border:0;background:none;padding:0;font-weight:800;font-size:16px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;cursor:pointer}
.ms-cname:hover{color:var(--acc-d);text-decoration:underline}
.ms-chi small{display:block;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:24px}
.ms-chi small .av{display:inline-grid;vertical-align:middle;margin-right:2px}
.ms-cha{display:flex;gap:6px;align-items:center}
.ms-ib{width:40px;padding:0}
.ms-more{position:relative}
.ms-menu{position:absolute;right:0;top:44px;z-index:30;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(23,22,28,.14);padding:6px;width:236px}
.ms-menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px;border-radius:8px;min-height:44px;font-weight:600;text-align:left}
.ms-menu button:hover{background:var(--canvas)}
.ms-menu svg{width:18px;height:18px;color:var(--mute)}
.ms-nameb{flex-basis:100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--warn-t);border-radius:9px;padding:8px 10px;font-size:13px;color:var(--ink)}
.ms-nameb>span{display:flex;align-items:center;gap:6px;flex:1;min-width:180px}
.ms-nameb svg{width:16px;height:16px}
.ms-nameb input{border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:38px;flex:1;min-width:110px;background:#fff}
.ms-msgs{flex:1;overflow:auto;min-height:0;padding:14px 16px;background:var(--canvas)}
.ms-day{text-align:center;margin:10px 0}
.ms-day span{font-size:11.5px;font-weight:700;color:var(--mute);background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.ms-m{display:flex;flex-direction:column;max-width:min(78%,560px);margin:8px 0}
.ms-in{align-items:flex-start}
.ms-out,.ms-lola{margin-left:auto;align-items:flex-end}
.ms-b{border-radius:14px;padding:9px 12px;font-size:14px;line-height:1.45;border:1px solid var(--line);background:#fff}
.ms-b p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.ms-out .ms-b{background:var(--acc-t);border-color:#CFE5F7;border-bottom-right-radius:4px}
.ms-in .ms-b{border-bottom-left-radius:4px}
.ms-lola .ms-b{background:var(--lola-t);border-color:#BFE3DE;border-bottom-right-radius:4px}
.ms-pend{opacity:.6}
.ms-meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:11.5px;color:var(--mute);margin-top:4px}
.ms-meta .chip{height:18px;font-size:10.5px;padding:0 6px}
.ms-sending{color:var(--acc-d);font-weight:700}
.ms-voice{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.ms-voice button{width:34px;height:34px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.ms-voice button svg{width:15px;height:15px}
.ms-wave{display:flex;align-items:center;gap:2px;height:22px}
.ms-wave i{width:3px;border-radius:2px;background:#B9B7C2}
.ms-playing .ms-wave i{background:var(--acc);animation:ms-w .6s ease-in-out infinite alternate}
.ms-playing .ms-wave i:nth-child(2n){animation-delay:.2s}
@keyframes ms-w{to{transform:scaleY(.4)}}
.ms-voice small{font-size:12px;color:var(--mute)}
.ms-vl{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--mute);font-weight:700;margin-bottom:4px}
.ms-vl svg{width:13px;height:13px}
.ms-photo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:200px;max-width:100%;height:130px;border:1px solid var(--line);border-radius:10px;background:repeating-linear-gradient(135deg,#F3F2F6 0 10px,#ECEBF0 10px 20px);margin-bottom:6px;color:var(--body);cursor:zoom-in}
.ms-photo svg{width:26px;height:26px;color:var(--mute)}
.ms-photo span{font-size:12px;font-weight:700;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-photo small{font-size:11px;color:var(--mute)}
.ms-pdf{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;margin-bottom:4px}
.ms-pdf svg{width:16px;height:16px}
.ms-bigph{height:300px;border-radius:12px;background:repeating-linear-gradient(135deg,#F3F2F6 0 14px,#ECEBF0 14px 28px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--mute);font-weight:700}
.ms-bigph svg{width:40px;height:40px}
.ms-paused{display:flex;align-items:center;gap:6px;justify-content:center;font-size:12px;color:var(--mute);margin:12px 0 0}
.ms-paused svg{width:14px;height:14px}
/* reply box */
.ms-reply{border-top:1px solid var(--line);padding:10px 14px 8px;flex:none;display:flex;flex-direction:column;gap:7px;background:#fff}
.ms-rtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ms-seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--canvas)}
.ms-seg button{border:0;background:none;border-radius:7px;padding:0 12px;min-height:30px;font-weight:700;font-size:13px;color:var(--body)}
.ms-seg button.ms-segon{background:#fff;color:var(--acc-d);box-shadow:0 1px 2px rgba(23,22,28,.12)}
.ms-seg button:disabled{opacity:.45;cursor:not-allowed}
.ms-how{font-size:12.5px;font-weight:700;color:var(--ink);min-width:0}
.ms-howw{font-weight:500;color:var(--mute)}
.ms-lola{display:flex;align-items:center;gap:6px;border:1px dashed #8CCBC3;background:var(--lola-t);border-radius:9px;padding:6px 10px;text-align:left;font-size:13px;color:var(--ink);min-height:36px;width:100%}
.ms-lola svg{width:15px;height:15px;color:var(--lola);flex:none}
.ms-lola b{color:var(--lola);flex:none;font-weight:700}
.ms-lola span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-lola:hover{border-color:var(--lola)}
.ms-quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.ms-quick .chip{border:1px solid var(--line);background:#fff;flex:none;cursor:pointer;height:28px;font-weight:600}
.ms-quick .chip:hover{border-color:var(--acc);color:var(--acc-d)}
.ms-ta{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:58px;max-height:160px;resize:vertical;background:#fff}
.ms-ta:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--acc-t)}
.ms-rbot{display:flex;align-items:center;gap:8px}
.ms-grow{flex:1}
.ms-att{cursor:pointer;color:var(--body)}
.ms-attc button{border:0;background:none;padding:0;display:grid;place-items:center;color:inherit;min-width:20px;min-height:20px}
.ms-attc svg{width:13px;height:13px}
.ms-pnote{margin:0;font-size:11.5px;color:var(--mute)}
/* 768–1099: folders become chips */
@media (max-width:1099px){
  .ms-wrap{grid-template-columns:300px minmax(0,1fr)}
  .ms-folders{display:none}
  .ms-fchips{display:flex}
  .ms-head .ms-sim .btn span{display:none}
  .ms-ch>.av,.ms-cha>.ms-ib{display:none}
}
/* phones: list OR conversation, full screen */
@media (max-width:759px){
  .ms-head{padding:10px 12px;gap:8px}
  .ms-head h1.pg{font-size:19px}
  .ms-search{max-width:none}
  .ms-search input{height:40px}
  .ms-sim .btn{min-width:44px;padding:0 10px}
  .ms-wrap{grid-template-columns:minmax(0,1fr)}
  .ms-conv{display:none}
  .ms-hasconv .ms-head,.ms-hasconv .ms-fchips,.ms-hasconv .ms-list{display:none}
  .ms-hasconv .ms-conv{display:flex}
  .ms-list{border-right:0}
  .ms-lhead .btn span{display:none}
  .ms-lhead .btn{min-width:44px}
  .ms-row{padding:12px}
  .ms-back{display:grid}
  .ms-ch{padding:6px 10px;gap:8px}
  .ms-ch>.av{display:none}
  .ms-cha>.ms-ib{display:none}
  .ms-cha .ms-ib{width:44px}
  .ms-cname{font-size:15px}
  .ms-chn .chip{display:none}
  .ms-msgs{padding:10px}
  .ms-m{max-width:88%}
  .ms-reply{padding:8px 10px 6px;gap:6px}
  .ms-how .ms-howw{display:none}
  .ms-rtop{flex-wrap:nowrap}
  .ms-how{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
  .ms-encl{display:none}
  body.cl-on .ms-quick,body.cl-on .ms-pnote{display:none}
  .ms-ta{min-height:46px}
  .ms-pnote{font-size:11px}
  .ms-att span{display:none}
  .ms-seg button{min-height:44px}
  /* 44 px tap targets on phones */
  .ms-fc{height:44px}
  .ms-search input{height:44px}
  .ms-quick .chip,.ms-drow .chip{height:44px;padding:0 14px}
  .ms-lola{min-height:44px}
  .ms-att,.ms-rbot .btn{min-height:44px}
  .ms-att{min-width:44px}
  .ms-attc{height:44px}
  .ms-attc button{min-width:44px;min-height:44px}
  .ms-addn{min-height:44px;padding:0 8px}
  .ms-drow .btn{min-height:44px}
  .ms-dn{min-height:44px}
  .ms-voice button{width:44px;height:44px}
  .ms-nameb input{min-height:44px}
  .ms-nameb .btn{min-height:44px}
}

/* ---- midia.css ---- */
/* Mi Día: FUB People page look */
.pg-midia{min-height:100%}
.md-wrap{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.md-rail{background:#fff;border-right:1px solid var(--line);padding:14px 10px 24px;position:sticky;top:0;align-self:start;height:calc(100vh - var(--top) - var(--sbx));overflow:auto}
.md-rl{display:flex;flex-direction:column;gap:1px}
.md-li{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;border-radius:8px;padding:7px 10px;min-height:36px;text-align:left;font-size:13.5px;font-weight:600;color:var(--body)}
.md-li svg{width:17px;height:17px;flex:none;color:var(--mute)}
.md-li span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md-li em{font-style:normal;font-size:12px;font-weight:700;color:var(--mute);min-width:22px;text-align:right}
.md-li:hover{background:var(--canvas);color:var(--ink)}
.md-li.on{background:var(--acc-t);color:var(--acc-d)}
.md-li.on em,.md-li.on svg{color:var(--acc-d)}
.md-sep{display:block;height:1px;background:var(--line);margin:7px 6px}
.md-sel{display:none}
.md-main{padding:18px 22px 48px;min-width:0}
.md-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:12px}
.md-cnt{font-size:15px;color:var(--mute);font-weight:700;margin-left:4px}
.md-lead{margin:0;font-size:13px;flex-basis:100%}
.md-vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Fechas y firmas */
.md-dl{margin:0 0 14px}
.md-dl h3{font-size:13.5px;font-weight:800;margin:0 0 7px;display:flex;gap:6px;align-items:center}
.md-dlrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.md-dli{flex:none;width:230px;background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;font-size:13px;overflow:hidden}
.md-dli:hover{border-color:var(--acc)}
.md-dlo{flex:1;border:0;background:none;text-align:left;padding:9px 11px 7px;display:flex;flex-direction:column;gap:2px;color:inherit}
.md-dla{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line2)}
.md-dlb{border:0;background:none;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;color:var(--body);min-height:32px;padding:0 4px;white-space:nowrap}
.md-dlb+.md-dlb{border-left:1px solid var(--line2)}
.md-dlb:last-child{grid-column:1/-1;border-left:0!important;border-top:1px solid var(--line2)}
.md-dlb svg{width:13px;height:13px;flex:none}
.md-dlb:hover{background:var(--acc-t);color:var(--acc-d)}
.md-dli b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md-dlk{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;color:var(--acc-d);text-transform:uppercase;letter-spacing:.03em}
.md-dlk svg{width:14px;height:14px}
.md-dld{font-size:12px;font-weight:700;color:var(--body)}
.md-dli.past{border-color:#F1C4BF;background:var(--alert-t)}
.md-dli.past .md-dla{border-top-color:#F1C4BF}
.md-dli.past .md-dlb+.md-dlb,.md-dli.past .md-dlb:last-child{border-color:#F1C4BF}
.md-dli.past .md-dlk,.md-dli.past .md-dld{color:var(--alert)}
/* toolbar */
.md-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.md-search{position:relative;flex:0 1 300px}
.md-search svg{position:absolute;left:10px;top:9px;width:17px;height:17px;color:var(--mute)}
.md-search input{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px 0 34px;background:#fff}
.md-grow{flex:1}
.md-fon{border-color:var(--acc);color:var(--acc-d)}
.md-badge{background:var(--acc);color:#fff;border-radius:9px;font-size:11px;min-width:18px;height:18px;display:inline-grid;place-items:center;padding:0 5px}
.md-fchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.md-fchips .chip{border:0;cursor:pointer;height:28px}
.md-x{width:13px;height:13px}
.md-fp{padding:14px 16px;margin-bottom:12px;display:grid;gap:12px}
.md-fg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.md-fg h4{margin:0 8px 0 0;font-size:12.5px;font-weight:800;color:var(--body);flex-basis:100%}
.md-fc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 11px 3px 4px;min-height:32px;font-size:13px;font-weight:600}
.md-fc:not(:has(.av)){padding-left:11px}
.md-fc.on{background:var(--acc-t);border-color:var(--acc);color:var(--acc-d)}
.md-ck{display:flex;align-items:center;gap:8px;font-size:13.5px;min-height:34px;flex-basis:100%}
.md-ck input{width:18px;height:18px}
.md-fact{display:flex;justify-content:flex-end;gap:8px}
.md-bulk{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--acc-t);border:1px solid #BFDDF5;border-radius:10px;padding:8px 10px;margin-bottom:10px}
.md-bulk b{font-size:13px;margin-right:6px;color:var(--acc-d)}
/* table */
.md-tw{overflow-x:auto}
.md-tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.md-tbl th{text-align:left;font-size:12px;font-weight:700;color:var(--mute);background:#FBFBFC;border-bottom:1px solid var(--line);padding:0 8px;height:38px;white-space:nowrap}
.md-tbl td{border-bottom:1px solid var(--line2);padding:8px 7px;vertical-align:middle}
.md-tbl tbody tr:last-child td{border-bottom:0}
.md-row{cursor:pointer}
.md-row:hover td{background:#F7FAFD}
.md-row.sel td{background:var(--acc-t)}
.md-sec td{background:var(--canvas);font-size:12px;font-weight:800;color:var(--body);text-transform:uppercase;letter-spacing:.03em;padding:7px 12px;cursor:default}
.md-th{display:inline-flex;align-items:center;gap:1px}
.md-sort{border:0;background:none;font:inherit;color:inherit;padding:6px 4px;border-radius:6px;display:inline-flex;gap:4px}
.md-sort:hover{color:var(--ink);background:var(--line2)}
.md-sort i{font-style:normal;color:var(--acc-d)}
.md-cmenu{border:0;background:none;width:22px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--mute);opacity:.6}
.md-cmenu svg{width:13px;height:13px}
.md-cmenu:hover,.md-th:hover .md-cmenu{opacity:1;background:var(--line2)}
.md-c-sel{width:36px;padding-left:12px!important}
.md-c-sel input,.md-cb input{width:17px;height:17px;accent-color:var(--acc)}
.md-c-name{min-width:190px}
.md-c-todo{min-width:190px;max-width:300px}
.md-c-app{min-width:96px}
.md-c-q{text-align:right;white-space:nowrap;width:1%;position:sticky;right:0;background:#fff;box-shadow:-8px 0 8px -8px rgba(23,22,28,.18)}
.md-tbl th.md-c-q{background:#FBFBFC}
.md-row:hover td.md-c-q{background:#F7FAFD}.md-row.sel td.md-c-q{background:var(--acc-t)}
.md-nm{display:flex;align-items:center;gap:10px}
.md-ini{width:32px;height:32px;border-radius:50%;background:#EEF0F4;color:var(--body);font-size:12px;font-weight:800;display:grid;place-items:center;flex:none}
.md-nmt{display:flex;flex-direction:column;min-width:0}
.md-nmt b{font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md-sub{display:block;font-size:12px;color:var(--mute);line-height:1.35}
.md-nmt .md-sub{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.md-chip{height:19px;font-size:11px;padding:0 7px}
.md-red{color:var(--alert)!important;font-weight:700}
.md-todo{display:block;color:var(--ink);font-weight:600;line-height:1.35}
.md-todo .chip{height:19px;font-size:11px;padding:0 7px;vertical-align:1px}
.md-none{color:var(--warn)}
.md-enc{display:flex;align-items:center;gap:6px}
.md-src{white-space:nowrap}
.md-score{display:inline-grid;place-items:center;min-width:30px;height:20px;border-radius:6px;background:var(--canvas);color:var(--body);font-size:11.5px;font-weight:800;margin-bottom:1px}
.md-score.mid{background:var(--acc-t);color:var(--acc-d)}
.md-score.hi{background:var(--ok-t);color:var(--ok)}
.md-q{display:inline-flex;gap:4px;align-items:center}
.md-ib{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--acc-d)}
.md-ib svg{width:17px;height:17px}
.md-ib:hover{background:var(--acc-t);border-color:var(--acc)}
.md-empty{padding:40px 20px;text-align:center;color:var(--body);display:flex;flex-direction:column;align-items:center;gap:10px}
.md-empty svg{width:34px;height:34px;color:var(--acc)}
.md-empty p{margin:0;max-width:420px}
/* popover menu (shared with the profile) */
.md-pop{position:fixed;z-index:66;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(23,22,28,.18);padding:6px;width:max-content;min-width:220px;max-width:min(340px,calc(100vw - 16px));max-height:min(420px,70vh);overflow:auto}
.md-pop h6{margin:4px 8px 6px;font-size:12px;color:var(--mute);font-weight:700}
.md-pi{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:7px 9px;border-radius:8px;text-align:left;min-height:38px;font-size:13.5px;font-weight:600;color:var(--ink)}
.md-pi:hover{background:var(--acc-t)}
.md-pi span{display:flex;flex-direction:column}
.md-pi small{color:var(--mute);font-weight:500;font-size:12px}
.md-pi svg{width:16px;height:16px;color:var(--mute);flex:none}
.md-pi.on{color:var(--acc-d)}
.md-pck{margin-left:auto;color:var(--acc)!important}
.md-ckrow{cursor:pointer}
.md-ckrow input{width:17px;height:17px;accent-color:var(--acc)}
.md-pin{padding:2px 4px 6px}
.md-pin input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px}
.md-sheetopts{display:grid;gap:8px;margin-top:12px}
.md-sheetopts .btn{justify-content:flex-start}
/* tablet: rail becomes a row of chips on top, fewer columns */
@media(max-width:1099px){.md-c-source,.md-c-app{display:none}}
@media(max-width:1023px){
.md-wrap{grid-template-columns:minmax(0,1fr)}
.md-rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px;overflow-x:auto}
.md-rl{flex-direction:row;gap:6px}
.md-sep{width:1px;height:auto;margin:4px 2px}
.md-li{width:auto;flex:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;min-height:34px}
.md-li.on{border-color:var(--acc)}
.md-main{padding:14px 16px 40px}
}
/* tablets and phones: rows become cards */
@media(max-width:1023px){
.md-cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.md-sech{grid-column:1/-1}
.md-sech{margin:8px 2px 0;font-size:12px;font-weight:800;color:var(--body);text-transform:uppercase;letter-spacing:.03em}
.md-card{padding:12px;display:grid;gap:8px;cursor:pointer}
.md-card.sel{border-color:var(--acc);background:#F5FAFE}
.md-ct{display:flex;align-items:flex-start;gap:8px}
.md-ct .md-nm{flex:1;min-width:0}
.md-cb{display:grid;place-items:center;width:28px;height:32px;margin-left:-4px}
.md-cq{background:var(--canvas);border-radius:8px;padding:7px 10px}
.md-ql{display:block;font-size:11px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
.md-cm{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.md-cbtn{display:flex;gap:8px}
.md-cbtn .btn{flex:1}
.md-cbtn .md-sq{flex:none;width:44px;padding:0}
}
/* phones: list dropdown */
@media(max-width:759px){
.md-rail{padding:10px 12px 8px}
.md-rl{display:none}
.md-sel{display:block;width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;font-weight:700}
.md-li{min-height:40px}
.md-main{padding:12px 12px 32px}
.md-search{flex:1 1 100%}
.md-search input{height:44px}
.md-search svg{top:13px}
.md-tools .btn{min-height:44px}
.md-pi{min-height:44px}
.md-dli{width:180px}
}
.md-pnote{margin:6px 9px 4px;font-size:12px;color:var(--mute)}
@media(max-width:759px){.md-head{display:none}.md-dl h3{margin-top:2px}.md-tools{gap:6px}.md-tools .btn{flex:1 1 auto}}
/* way out under the "Qué hacer" line: always labelled */
.md-wo{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.md-wo .btn-sm{min-height:28px;padding:0 8px;font-size:12px;font-weight:700;color:var(--body)}
.md-wo .btn-sm svg{width:14px;height:14px}
.md-fixed{opacity:.75}.md-fixed small{margin-left:auto}
@media(max-width:1023px){.md-card .md-wo{margin-top:0}.md-card .md-wo .btn{flex:1;min-height:40px;font-size:13px}}
/* phones: 44 px tap targets */
@media(max-width:759px){
.md-card .md-wo .btn,.md-cbtn .btn,.md-tools .btn,.md-fact .btn,.md-bulk .btn,.md-empty .btn{min-height:44px}
.md-cb{width:44px;height:44px;margin:-6px 0 -6px -10px}
.md-cb input{width:20px;height:20px}
.md-fc{min-height:44px}
.md-ck{min-height:44px}
.md-li{min-height:44px}
.md-dlb{min-height:44px;font-size:12px}
.md-dli{width:240px}
.md-fchips .chip{height:36px}
.md-ckrow{min-height:44px}
}

/* ---- ofertas.css ---- */
.pg-ofertas{min-height:100%;background:var(--canvas)}
.of-tabs{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:0 20px;position:sticky;top:0;z-index:5}
.of-tabs button{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:0 14px;min-height:48px;font-weight:700;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-1px}
.of-tabs button svg{width:18px;height:18px}
.of-tabs button[aria-selected=true]{color:var(--acc-d);border-bottom-color:var(--acc)}
.of-tabs i{font-style:normal;font-size:11.5px;font-weight:800;background:var(--canvas);color:var(--body);border-radius:999px;padding:1px 8px}
.of-tabs i.red{background:var(--alert);color:#fff}
.of-wrap{padding:20px 24px 40px;max-width:1360px;margin:0 auto}
.of-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px}
.of-head p{margin:4px 0 0;font-size:13.5px}
.of-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.of-seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;background:#fff;padding:3px;gap:2px}
.of-seg button{border:0;background:none;border-radius:7px;min-height:34px;padding:0 14px;font-weight:700;color:var(--body)}
.of-seg button[aria-pressed=true]{background:var(--acc);color:#fff}
.of-chips{display:flex;gap:6px;flex-wrap:wrap}
.of-fc{border:1px solid var(--line);background:#fff;border-radius:999px;min-height:34px;padding:0 12px;font-size:13px;font-weight:600;color:var(--body)}
.of-fc b{color:var(--mute);font-weight:800;margin-left:3px}
.of-fc[aria-pressed=true]{border-color:var(--acc);background:var(--acc-t);color:var(--acc-d)}
.of-fc[aria-pressed=true] b{color:var(--acc-d)}
.of-list{overflow:hidden}
.of-lh,.of-row{display:grid;grid-template-columns:64px minmax(0,1fr) 120px 210px 120px;gap:14px;align-items:center;padding:10px 16px}
.of-lh{font-size:12px;font-weight:700;color:var(--mute);border-bottom:1px solid var(--line);background:#FCFCFD;padding-top:8px;padding-bottom:8px}
.of-row{width:100%;border:0;border-bottom:1px solid var(--line2);background:#fff;text-align:left;min-height:72px}
.of-row:last-child{border-bottom:0}
.of-row:hover{background:#F8FBFE}
.of-th{width:64px;height:48px;border-radius:8px;overflow:hidden;background:var(--canvas);flex:none;display:grid;place-items:center;color:var(--mute)}
.of-th img{width:100%;height:100%;object-fit:cover}
.of-th svg{width:22px;height:22px}
.of-rm,.of-rp,.of-rs,.of-ru{display:flex;flex-direction:column;gap:2px}
.of-rm b{font-size:14.5px}
.of-rm small,.of-rp small,.of-rs small,.of-ru small{color:var(--mute);font-size:12px}
.of-rs{align-items:flex-start}
.of-ru{flex-direction:row;align-items:center;gap:6px}
.of-todo{display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--acc-d)}
.of-todo svg{width:14px;height:14px;flex:none}
.of-empty{padding:24px;margin:0;text-align:center;display:flex;gap:8px;justify-content:center;align-items:center}
.of-empty svg{width:18px;height:18px;color:var(--ok)}
.of-pick{display:flex;flex-direction:column;gap:6px;max-height:55vh;overflow:auto}
.of-pc,.of-lpi{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;text-align:left;min-height:52px}
.of-pc:hover,.of-lpi:hover{border-color:var(--acc);background:#F8FBFE}
.of-pc span:not(.chip):not(.av),.of-lpi>span:last-child{flex:1;display:flex;flex-direction:column}
.of-pc small,.of-lpi small{color:var(--mute);font-size:12px}
/* offer file */
.of-back{margin:-6px 0 6px -8px;color:var(--acc-d)}
.of-fh{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.of-fh p{margin:4px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.of-cl{color:var(--acc-d);font-weight:700;text-decoration:none}
.of-fa{display:flex;gap:8px;flex-wrap:wrap}
.of-lockn{display:flex;gap:8px;align-items:center;background:var(--canvas);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 12px;font-size:13px;color:var(--body)}
.of-lockn svg{width:16px;height:16px;flex:none}
.of-cols{display:grid;grid-template-columns:200px minmax(0,1fr) 280px;gap:16px;align-items:start}
.of-steps{display:flex;flex-direction:column;gap:2px;position:sticky;top:64px}
.of-steps button{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:9px;padding:8px 10px;min-height:44px;text-align:left;font-weight:600;color:var(--body)}
.of-steps button:hover{background:#fff}
.of-steps button[aria-current=step]{background:#fff;color:var(--ink);box-shadow:inset 3px 0 0 var(--acc);font-weight:800}
.of-steps i{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;flex:none;background:#fff;color:var(--mute)}
.of-steps .ok i{background:var(--ok);border-color:var(--ok);color:#fff}
.of-steps i svg{width:13px;height:13px}
.of-main{padding:18px 20px}
.of-h2{font-size:16px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.of-h2 svg{width:18px;height:18px;color:var(--mute)}
.of-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.of-fld label{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.of-lc{height:20px;font-size:11px;padding:0 7px}
.of-lc svg{width:12px;height:12px}
.of-hint{color:var(--mute);font-size:12px;line-height:1.35}
.of-miss input,.of-miss select{border-color:#E8B4AE;background:#FFFBFA}
.of-fld input:disabled,.of-fld select:disabled{background:var(--canvas);color:var(--body)}
.of-house{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:14px}
.of-house>span:nth-child(2){flex:1;display:flex;flex-direction:column}
.of-house small{color:var(--mute)}
.of-calc{margin:12px 0 0;font-size:13.5px;color:var(--body)}
.of-calc:empty{display:none}
.of-note{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;background:var(--acc-t);color:#1B4F78;border-radius:10px;padding:9px 12px;font-size:13px;margin:14px 0 0}
.of-note svg{width:16px;height:16px;flex:none;margin-top:2px}
.of-note.bad{background:var(--alert-t);color:var(--alert)}
.of-rev .of-note{margin:0 0 10px}
.of-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line2)}
.of-mc{font-size:13px;font-weight:700;color:var(--warn)}
.of-mc.ok{color:var(--ok)}
.of-side{display:flex;flex-direction:column;gap:12px;position:sticky;top:64px}
.of-qs,.of-lola{padding:14px 16px}
.of-side h3,.of-rside h3{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 0 6px}
.of-side h3 svg,.of-rside h3 svg{width:16px;height:16px;color:var(--acc-d)}
.of-qs p{margin:0 0 10px;font-size:13px;color:var(--body)}
.of-qs ol{margin:0;padding-left:20px;font-size:12.5px;color:var(--mute);display:flex;flex-direction:column;gap:5px}
.of-qs li.ok{color:var(--ok);text-decoration:line-through;text-decoration-color:#9BD3BF}
.of-qs li.now{color:var(--ink);font-weight:700}
.of-lola ul,.of-miss-l ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.of-lola button,.of-miss-l button{border:0;background:none;color:var(--acc-d);font-weight:700;text-align:left;padding:6px 0;min-height:32px;display:flex;align-items:center;gap:6px}
.of-miss-l button{color:var(--alert)}
.of-miss-l button svg{width:14px;height:14px}
.of-adds{display:flex;flex-direction:column;gap:8px}
.of-add{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.of-add input{width:20px;height:20px;margin-top:2px;accent-color:var(--acc)}
.of-add span{display:flex;flex-direction:column;gap:3px}
.of-add small{color:var(--mute);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.of-add .chip{height:20px;font-size:11px}
.of-add .chip svg{width:12px;height:12px}
.of-lp{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
/* review + contract */
.of-rev{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}
.of-rside{display:flex;flex-direction:column;gap:12px}
.of-miss-l,.of-esign{padding:14px}
.of-esign{display:flex;flex-direction:column;gap:8px}
.of-okp{display:flex;align-items:center;gap:6px;color:var(--ok);font-weight:700;margin:0}
.of-okp svg{width:16px;height:16px}
.of-wait{display:flex;gap:6px;align-items:center;margin:0;font-size:13px;color:var(--body)}
.of-wait svg{width:16px;height:16px;color:var(--warn)}
.of-res{display:flex;gap:6px;flex-wrap:wrap}
.of-res .btn{flex:1}
.of-signed{display:flex;gap:8px;align-items:flex-start;background:var(--ok-t);color:var(--ok);border-radius:9px;padding:8px 10px;font-size:12.5px}
.of-signed svg{width:16px;height:16px;flex:none}
.of-signed b{word-break:break-all}
.of-sky{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;min-height:36px}
.of-sky input{width:18px;height:18px;accent-color:var(--ok)}
.of-doc{background:#E9E8EE;border-radius:10px;padding:18px;max-height:72vh;overflow:auto;border:1px solid var(--line)}
.of-paper{background:#fff;max-width:720px;margin:0 auto;padding:36px 42px;box-shadow:0 2px 10px rgba(23,22,28,.12);font-family:Georgia,'Times New Roman',serif;font-size:13px;line-height:1.7;color:#222}
.of-paper h3{text-align:center;font-size:16px;margin:4px 0 2px;letter-spacing:.02em;text-transform:uppercase}
.of-paper h4{font-size:13px;margin:14px 0 2px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800}
.of-paper p{margin:0}
.of-dt{font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;color:var(--mute);text-align:right}
.of-dsub{text-align:center;font-size:11px;color:#666;margin-bottom:10px!important}
.of-fv{background:#DCEEFC;color:#0F3E64;padding:1px 4px;border-radius:3px;font-weight:700}
.of-blank{display:inline-block;min-width:60px;border-bottom:2px solid var(--alert);color:var(--alert);font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:700;text-align:center;padding:0 4px}
.of-blank.w{min-width:120px}
.of-sigs{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:26px}
.of-sigs>div{display:flex;flex-direction:column;border-top:1px solid #999;padding-top:4px}
.of-sl{font-size:11px;color:#666;font-family:'Plus Jakarta Sans',sans-serif}
.of-sigs small{font-size:10.5px;color:#888;font-family:'Plus Jakarta Sans',sans-serif}
.of-sig{font-size:22px;color:#1B3A6B;min-height:34px;display:block;line-height:1.4}
.of-sig img{height:40px;width:auto}
.of-sig0{font-family:'Snell Roundhand','Segoe Script','Brush Script MT','Lucida Handwriting',cursive;font-style:italic}
.of-sig1{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:20px}
.of-sig2{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;letter-spacing:.12em;font-size:18px;text-decoration:underline;text-underline-offset:5px}
.of-sigd{font-size:14px}
.of-sige{font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;color:var(--alert);font-weight:700}
/* sign sheet */
.of-sgn .chip.blue{margin:0 0 8px}
.of-sq{font-weight:800;margin:16px 0 8px;font-size:14px}
.of-styles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.of-sty{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden}
.of-sty small{color:var(--mute);font-size:11.5px;font-weight:600;text-align:center}
.of-sty>svg{width:24px;height:24px;color:var(--acc-d)}
.of-sty .of-sig{font-size:19px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.of-sty[aria-pressed=true]{border-color:var(--acc);background:var(--acc-t);box-shadow:0 0 0 2px var(--acc-t)}
.of-pad{margin-top:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.of-pad canvas{width:100%;height:140px;border:1.5px dashed #B9B7C2;border-radius:10px;background:#FCFCFD;touch-action:none;cursor:crosshair}
.of-ph{margin:0 0 8px;font-size:13px}
.of-code{display:flex;gap:8px;align-items:center}
.of-code input{width:170px;font-size:22px;letter-spacing:.35em;font-weight:800;text-align:center;border:1.5px solid var(--line);border-radius:10px;padding:8px;min-height:48px}
.of-err{color:var(--alert);font-weight:700;margin:10px 0 0;font-size:13.5px}
.of-sgn .btn-block{margin-top:12px;min-height:48px}
/* closings desk */
.of-rules{list-style:none;margin:0 0 16px;padding:10px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 18px;background:#fff;border:1px solid var(--line);border-radius:12px}
.of-rules li{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--body)}
.of-rules svg{width:16px;height:16px;flex:none;color:var(--acc-d);margin-top:2px}
.of-desk{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.of-dq{display:flex;flex-direction:column;gap:10px}
.of-dq .of-h2{margin:0 0 2px}
.of-dr{padding:14px 16px}
.of-dr.open{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-t)}
.of-dr header{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.of-dr header small{margin-left:auto}
.of-dr .chip svg{width:12px;height:12px}
.of-dr h3{font-size:15px;margin:8px 0 2px}
.of-drm{margin:0;font-size:12.5px;color:var(--mute);word-break:break-word}
.of-drm a,.of-dlm a{color:var(--acc-d);font-weight:700;text-decoration:none}
.of-sum{margin:6px 0 0;font-size:13.5px;color:var(--body)}
.of-ed{display:flex;flex-direction:column;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line2)}
.of-ed textarea{font-family:inherit;line-height:1.5;min-height:200px}
.of-att{display:flex;gap:6px;align-items:center;margin:0;font-size:13px;font-weight:600;color:var(--body)}
.of-att svg{width:16px;height:16px}
.of-rw{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--lola)}
.of-rw>span{display:inline-flex;gap:5px;align-items:center}
.of-rw>span svg{width:15px;height:15px}
.of-sa{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.of-ed .of-sa{margin-top:2px}
.of-ed .sample,.of-ed .of-note{margin:0}
.of-dside{display:flex;flex-direction:column;gap:14px;position:sticky;top:64px}
.of-dls{padding:14px 16px}
.of-dl{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line2);position:relative}
.of-dls .of-h2+.of-dl{border-top:0}
.of-dli{width:32px;height:32px;border-radius:50%;background:var(--canvas);display:grid;place-items:center;flex:none;color:var(--body)}
.of-dli svg{width:16px;height:16px}
.of-dl.past .of-dli{background:var(--alert-t);color:var(--alert)}
.of-dlm{flex:1;display:flex;flex-direction:column;gap:2px}
.of-dlm b{font-size:13.5px}
.of-dlm small{color:var(--mute);font-size:12px}
.of-red{color:var(--alert);font-weight:800}
.of-way{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;position:relative}
.of-mini{position:absolute;top:100%;left:0;z-index:10;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 26px rgba(23,22,28,.16);padding:4px;display:flex;flex-direction:column;min-width:220px;margin-top:4px}
.of-mini button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:7px;min-height:40px;font-weight:600}
.of-mini button:hover{background:var(--acc-t)}
/* widths */
@media(max-width:1180px){.of-cols{grid-template-columns:180px minmax(0,1fr)}.of-side{grid-column:1/-1;position:static;flex-direction:row;flex-wrap:wrap}.of-side>.card{flex:1 1 280px}.of-rev{grid-template-columns:1fr}.of-rside{flex-direction:row;flex-wrap:wrap}.of-rside>.card{flex:1 1 260px}}
@media(max-width:1100px){.of-desk{grid-template-columns:1fr}.of-dside{position:static;order:-1}}
@media(max-width:980px){.of-lh{display:none}.of-row{grid-template-columns:64px minmax(0,1fr) auto;grid-template-areas:"th m p" "th s u";row-gap:6px}.of-row .of-th{grid-area:th;align-self:start}.of-rm{grid-area:m}.of-rp{grid-area:p;align-items:flex-end}.of-rs{grid-area:s;flex-direction:row;align-items:center;gap:8px}.of-ru{grid-area:u;justify-content:flex-end}}
@media(max-width:860px){.of-cols{grid-template-columns:1fr}.of-steps{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px;scrollbar-width:none}.of-steps button{flex:none;padding:6px 10px;background:#fff;border:1px solid var(--line)}.of-steps button[aria-current=step]{box-shadow:none;border-color:var(--acc);background:var(--acc-t)}}
@media(max-width:759px){
.of-tabs{padding:0 8px}.of-tabs button{flex:1;justify-content:center}
.of-wrap{padding:14px 12px 30px}
.of-head{flex-direction:column;align-items:stretch}.of-head .btn{width:100%}
.of-bar{flex-direction:column;align-items:stretch}.of-seg{align-self:flex-start}
.of-chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.of-fc{flex:none;min-height:40px}
.of-row{grid-template-columns:56px minmax(0,1fr);grid-template-areas:"th m" "th p" "s s";padding:12px}.of-th{width:56px;height:44px}.of-rp{align-items:flex-start;flex-direction:row;gap:8px;align-items:baseline}.of-ru{display:none}
.of-main{padding:14px}.of-grid{grid-template-columns:1fr}
.of-fh .of-fa{width:100%}.of-fa .btn{flex:1}
.of-nav .btn{flex:1}.of-nav{flex-wrap:wrap}.of-mc{order:-1;width:100%;text-align:center}
.of-doc{max-height:60vh;padding:8px}.of-paper{padding:20px 16px;font-size:12.5px}
.of-sigs{grid-template-columns:1fr;gap:14px}
.of-styles{grid-template-columns:repeat(2,minmax(0,1fr))}
.of-code input{flex:1;width:auto}
.of-way .btn{flex:1 1 auto}
.of-mini{left:0;right:0;min-width:0}
}
.of-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.of-legend{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--body);margin:0 0 12px}
.of-legend .chip{height:20px;font-size:11px}.of-legend svg{width:12px;height:12px}
.of-note{display:block;position:relative;padding-left:36px}
.of-note>svg{position:absolute;left:12px;top:10px;margin:0}
.of-note .btn{margin-left:4px;vertical-align:middle}
.of-main>.of-note:first-of-type{margin:0 0 10px}
.of-esign .btn,.of-sa .btn{white-space:normal;text-align:center;line-height:1.25;padding-top:8px;padding-bottom:8px}
.of-pad[hidden]{display:none}
.of-side .of-miss-l,.of-side .of-esign{padding:14px 16px}
@media(max-width:1180px){.of-side>.of-esign{order:-1}}
@media(max-width:1180px){.of-isrev .of-steps{order:-2}.of-isrev .of-side{order:-1}.of-isrev .of-side .of-qs{display:none}}
@media(min-width:861px) and (max-width:1180px){.of-isrev .of-side{grid-column:2}}
@media(min-width:861px) and (max-width:1180px){.of-isrev .of-steps{grid-row:1/span 2;grid-column:1}.of-isrev .of-main{grid-column:2}}
.of-tpend{background:var(--alert-t);border-radius:9px;padding:10px;margin:0 0 10px;display:flex;flex-direction:column;gap:8px}
.of-tpend p{margin:0;display:flex;gap:6px;align-items:flex-start;color:var(--alert);font-weight:700;font-size:13px}
.of-tpend p svg{width:15px;height:15px;flex:none;margin-top:2px}
.of-esign .btn:disabled{opacity:.5;cursor:not-allowed}

</style>

<body>
<div class="app" id="app">
  <div class="sbx" aria-label="Sandbox">
    <i class="dot"></i><b>Sandbox · Agent Hub v2</b><span class="m">Datos de ejemplo. Nada se conecta a FUB, Twilio ni clientes reales.</span>

    <select id="sbxUser"></select>
  </div>
  <header class="top">

</div>
<div class="toast" id="toast" role="status"><span id="toastTxt"></span><button id="toastBtn" type="button"></button><i class="bar" id="toastBar"></i></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true"></div>
<script>
{
const H = window.H = {};
const V2 = H; /* the icon + photo helpers below were written against V2 */
const LS = {get(k,d){try{const v=localStorage.getItem('jaghub:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('jaghub:'+k,JSON.stringify(v))}catch(e){}}};
H.store = LS;
H.esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
H.lang = 'es';
H.t = (es,en) => H.lang === 'en' ? en : es;
/* ---------- line icons ---------- */
const P = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  play:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M10 8.5v7l6-3.5z"/>',
  heart:'<path d="M12 20s-7.5-4.6-9.2-9.3C1.7 7.6 3.7 4.5 7 4.5c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.3 0 5.3 3.1 4.2 6.2C19.5 15.4 12 20 12 20z"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  chat:'<path d="M4 5h16v11H9l-5 4z"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  left:'<path d="m15 5-7 7 7 7"/>', right:'<path d="m9 5 7 7-7 7"/>', down:'<path d="m5 9 7 7 7-7"/>',
  bed:'<path d="M3 18V7"/><path d="M3 14h18v4"/><path d="M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="1.6"/>',
  bath:'<path d="M4 12h16v3a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M6 12V6a2 2 0 0 1 4 0"/><path d="M7 19l-1 2M17 19l1 2"/>',
  ruler:'<rect x="3" y="8" width="18" height="8" rx="1.5"/><path d="M7 8v3M11 8v4M15 8v3M19 8v4"/>',
  map:'<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',
  filter:'<path d="M4 6h16M7 12h10M10 18h4"/>',
  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  upload:'<path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 20h14"/>',
  share:'<path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 13v7h14v-7"/>',
  bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18z"/>',
  send:'<path d="M4 12 20 4l-6 16-3-7z"/>',

  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.6-5 6.5-5s5.5 1.5 6.5 5"/><circle cx="17" cy="9" r="2.8"/><path d="M17 14.5c2.4 0 4 1.3 4.6 4"/>',
  pin:'<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',

  school:'<path d="m2 9 10-5 10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5"/>',

  tree:'<path d="M12 3 6 11h3l-4 6h14l-4-6h3z"/><path d="M12 17v4"/>',
  spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
