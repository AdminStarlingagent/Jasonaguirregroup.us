      return H.undoable({ msg:T('Próximo paso: ','Next step: ') + T(txt[0], txt[1]), run: () => { c.task = { type:'call', text:{ es:txt[0], en:txt[1] }, due:d.getTime(), by:H.me().id }; e = H.log(c.id, { type:'note', text:{ es:'Próximo paso: ' + txt[0] + ' (' + d.toLocaleDateString('es-MX', { weekday:'short', day:'numeric', month:'short' }) + ')', en:'Next step: ' + txt[1] + ' (' + d.toLocaleDateString('en-US', { weekday:'short', day:'numeric', month:'short' }) + ')' } }); }, undo: () => { c.task = null; unlog(c, e); H.emit('client', c); } }); }
    case 'savenote': { const v = st.d.note.trim(); if (!v) return H.toast(T('Escriba la nota primero.','Write the note first.')); st.d.note = ''; H.log(c.id, { type:'note', text:{ es:v, en:v } }); return H.toast(T('Nota guardada','Note saved')); }
    case 'unattach': st.attach = null; return render();
    case 'sendtext': { const v = st.d.text.trim(); if (!v && !st.attach) return H.toast(T('Escriba el mensaje primero.','Write the message first.')); const opt = { ch, attach:st.attach || undefined }; st.d.text = ''; st.attach = null; render(); return sendText(v || T('(archivo adjunto)','(attachment)'), opt); }
    case 'sendemail': { const s = st.d.subj.trim(), bd = st.d.body.trim(); if (!s || !bd) return H.toast(T('Escriba el asunto y el mensaje.','Write the subject and message.')); st.d.subj = ''; st.d.body = ''; render();
      return H.undoable({ msg:T('Mandando correo…','Sending email…'), commit: () => { H.log(c.id, { type:'email', text:{ es:'Correo: “' + s + '” · ' + bd, en:'Email: “' + s + '” · ' + bd } }); H.touch(c.id); } }); }
    case 'logcall': { const o = OUT.find(x => x[0] === st.d.out), v = st.d.cnote.trim(); st.d.cnote = '';
      H.log(c.id, { type:'call', outcome:o[0], dur:0, text:{ es:'Llamada registrada a mano: ' + o[1] + (v ? '. ' + v : ''), en:'Call logged by hand: ' + o[2] + (v ? '. ' + v : '') } }); if (o[0] === 'talked') H.touch(c.id);
      return H.toast(T('Llamada guardada','Call saved'), o[0] === 'talked' && !c.screen ? { label:T('Evaluar','Screen'), fn: () => H.screen(c.id) } : null); }
    case 'screen': return H.screen(c.id);
    case 'rec': return H.toast(T('Reproduciendo grabación…','Playing recording…'));
    case 'trs': st.tx[b.dataset.i] = !st.tx[b.dataset.i]; return render();
    case 'edit': st.edit = true; return render();
    case 'canceledit': st.edit = false; return render();
    case 'saveedit': { const q = s => st.root.querySelector(s).value.trim(), ph = q('#cpP'), err = st.root.querySelector('#cpErr'), f = fmtPhone(ph);
      if (ph && !f){ err.hidden = false; err.textContent = T('El teléfono debe tener 10 números.','Phone must have 10 digits.'); return; }
      const dup = f && H.clients.find(x => x.phone === f && x.id !== c.id); if (dup){ err.hidden = false; err.textContent = T('Ese teléfono ya es de ','That phone already belongs to ') + H.name(dup) + '.'; return; }
      st.edit = false; const n = H.updateContact(c.id, { first:q('#cpF'), last:q('#cpL'), phone:f || ph, email:q('#cpE') }); render(); return H.toast(n ? T('Guardado. Quedó en el historial.','Saved. It is in the history.') : T('No hubo cambios.','No changes.')); }
    case 'hh': st.hh = !st.hh; render(); { const n = st.root.querySelector('#hhN'); n && n.focus(); } return;
    case 'savehh': { const q = s => st.root.querySelector(s), nm = q('#hhN').value.trim(), ph = q('#hhP').value.trim(), f = fmtPhone(ph), err = q('#hhErr');
      if (!nm){ err.hidden = false; err.textContent = T('Escriba el nombre.','Enter the name.'); return; } if (ph && !f){ err.hidden = false; err.textContent = T('El teléfono debe tener 10 números.','Phone must have 10 digits.'); return; }
      const R = { spouse:['esposo(a)','spouse'], child:['hijo(a)','son/daughter'], parent:['papá / mamá','parent'], other:['familiar','relative'] }[q('#hhR').value], loan = q('#hhL').checked;
      c.household = c.household || []; c.household.push({ name:nm, rel:{ es:R[0], en:R[1] }, phone:f || '', loan }); st.hh = false;
      H.log(c.id, { type:'edit', text:{ es:'Agregó a la familia: ' + nm + ' (' + R[0] + (loan ? ', en el préstamo' : '') + ')' + (f ? ' · ' + f : ''), en:'Added to household: ' + nm + ' (' + R[1] + (loan ? ', on the loan' : '') + ')' + (f ? ' · ' + f : '') } }); return; }
    case 'journey': { const k = b.dataset.k, cb = st.root.querySelector(`[data-jn="${k}"]`), notify = cb ? cb.checked : false, j = H.JOURNEY.find(x => x.k === k), prevPre = c.preApproved; let e;
      return H.undoable({ msg:T(j.es, j.en) + (notify ? T(' · se avisó al cliente',' · client notified') : ''), run: () => { H.journey(c.id, k, notify); e = c.timeline[0]; }, undo: () => { delete c.journey[k]; c.preApproved = prevPre; unlog(c, e); H.emit('client', c); } }); }
    case 'docs': st.docs = !st.docs; return render();
    case 'signed': st.signed = !st.signed; return render();
    case 'homes': return H.sendHomes ? H.sendHomes(c.id) : H.toast(T('Enviar casas: en construcción','Send homes: being built'));
    case 'newoffer': return H.newOffer ? H.newOffer(c.id, c.deal ? c.deal.listingId : undefined) : H.toast(T('Ofertas: en construcción','Offers: being built'));
    case 'offers': return typeof H.offersFor === 'function' ? H.go('ofertas') : H.toast(T('Ofertas: en construcción','Offers: being built'));
    case 'offer': return H.go('ofertas', b.dataset.id);
    case 'pdf': return H.toast(T('PDF del expediente listo','Client file PDF ready'));
    case 'fub': return H.toast(T('Abriendo en Follow Up Boss…','Opening in Follow Up Boss…'));
  }
}
function onInput(e){ const t = e.target, m = { cpNote:'note', cpText:'text', cpSubj:'subj', cpBody:'body', cpCnote:'cnote' }[t.id]; if (m) st.d[m] = t.value; }
function onChange(e){ if (e.target.id === 'cpFile'){ const f = e.target.files && e.target.files[0]; if (f){ if (f.size > 5e6) return H.toast(T('El archivo pasa de 5 MB.','File is over 5 MB.')); st.attach = f.name; render(); } } }

let raf = 0;
H.on('client', c => { if (!st.root || !st.root.isConnected || !c || c.id != st.id) return; cancelAnimationFrame(raf); raf = requestAnimationFrame(render); });

H.register('cliente', { render(root, param){
  const id = Number(param); if (id !== st.id) { resetDraft(); st.tab = 'note'; st.tl = 'all'; st.docs = false; st.signed = false; }
  st.id = id; st.root = root;
  root.addEventListener('click', onClick); root.addEventListener('input', onInput); root.addEventListener('change', onChange);
  render();
  return () => { st.root = null; H.mdPopClose && H.mdPopClose(); };
} });

}
</script>
<script>/* ---- mensajes.js ---- */
{
/* mensajes module (Builder B): Follow Up Boss–style inbox. Route #mensajes[-<folder>[.<clientId>]]. Classes prefixed ms-. */
H.lolaDrafts = H.lolaDrafts || []; H.pendingTexts = H.pendingTexts || [];
const M = { why:null, root:null, folder:'mi', cid:null, q:'', scroll:0, ch:{}, draft:{}, att:{}, nameOpen:false, menu:false };
const T = H.t, E = H.esc;
const isPhone = () => window.matchMedia('(max-width: 759px)').matches;
const last = c => c.thread[c.thread.length - 1];
const lastIn = c => c.thread.filter(m => m.dir === 'in').slice(-1)[0];
const pend = cid => (H.pendingTexts || []).filter(p => p.cid == cid);
const unread = c => c.thread.some(m => m.unread);
const convos = () => H.clients.filter(c => c.thread.length || pend(c.id).length).sort((a, b) => lastAt(b) - lastAt(a));
const lastAt = c => Math.max(c.thread.length ? last(c).at : 0, ...pend(c.id).map(p => p.at));
const inMine = (c, u = H.me()) => c.encargado === u.id || c.thread.some(m => m.line === u.id);
const inTeam = c => !c.encargado || c.thread.some(m => m.line === 'team');
const visible = () => true;  /* everyone on the team sees every client */
const mineOrTeam = c => H.isAdmin() || inMine(c) || inTeam(c);
const clientCh = c => { const m = lastIn(c); return m && m.ch === 'app' ? 'app' : 'text'; };
const hasApp = c => (c.app && c.app.account) || c.thread.some(m => m.ch === 'app');
const fromLine = c => { const t = c.thread.filter(m => m.ch === 'text').slice(-1)[0]; return t && t.line === 'team' ? 'team' : H.me().id; };
const when = ts => { const d = new Date(ts), n = new Date(); return d.toDateString() === n.toDateString() ? H.fmt.time(ts) : H.fmt.date(ts); };
const txt = m => { const s = T(m.text.es, m.text.en); return m.voice ? s.replace(/^\((nota de voz|voice note)\)\s*/i, '') : s; };
const cl = (c, es, en) => c.lang === 'en' ? en : es;

/* folders: by who owns the conversation */
function folders(){ const me = H.me(), f = [
    { k:'mi', icon:'inbox', label:T('Mi bandeja','My inbox'), sub: me.line, test:c => inMine(c) },
    { k:'equipo', icon:'users', label:T('Línea del equipo','Team line'), sub: H.TEAM_LINE, test:inTeam },
    { k:'sinleer', icon:'chat', label:T('Sin leer','Unread'), test:c => mineOrTeam(c) && unread(c) },
    { k:'lola', icon:'spark', label:T('Textos de Lola','Lola\'s texts'), sub:T('Esperan que usted los envíe','Waiting for you to send'), drafts:true } ];
  /* only admins open other agents' inboxes */
  if (H.isAdmin()){ f.push({ k:'todas', icon:'list', label:T('Todas','All'), test:() => true });
    H.team.filter(u => u.id !== me.id).forEach(u => f.push({ k:u.id, agent:u, label:u.name, sub:u.line, test:c => inMine(c, u) })); }
  return f; }
const drafts = () => H.lolaDrafts.filter(d => H.isAdmin() || d.by === H.me().id || !d.by);
function count(f){ if (f.drafts) return { n: drafts().length, u: drafts().length };
  const l = convos().filter(c => visible(c) && f.test(c)); return { n:l.length, u:l.filter(unread).length }; }

H.register('mensajes', { render(root, param){
  const fs = folders(); let [fk, cid] = String(param || '').split('.');
  if (!fs.some(f => f.k === fk)) fk = H.isAdmin() ? 'todas' : 'mi';
  if (M.folder !== fk) M.scroll = 0;
  M.folder = fk; M.cid = cid && H.client(cid) && mineOrTeam(H.client(cid)) ? Number(cid) : null; M.root = root; M.nameOpen = false; M.menu = false;
  root.innerHTML = `<div class="ms ${M.cid ? 'ms-hasconv' : ''}">
    <div class="ms-head"><h1 class="pg">${T('Mensajes','Messages')}</h1>
      <div class="ms-search">${H.icon('search')}<input type="search" data-ms-q value="${E(M.q)}" placeholder="${T('Buscar en mensajes','Search messages')}" aria-label="${T('Buscar en mensajes','Search messages')}"></div>
      <div class="ms-sim"><button class="btn btn-sm" type="button" data-ms="sim" aria-expanded="false" aria-label="${T('Simular llamada entrante','Simulate incoming call')}">${H.icon('bell')}<span>${T('Simular llamada entrante','Simulate incoming call')}</span></button>
        <div class="ms-simm" hidden><button type="button" data-ms="sim-known">${H.icon('user')}${T('Un cliente conocido','A known client')}</button><button type="button" data-ms="sim-unknown">${H.icon('phone')}${T('Un número desconocido','An unknown number')}</button></div></div></div>
    <div class="ms-fchips" role="tablist">${fs.map(f => chipF(f)).join('')}</div>
    <div class="ms-wrap"><aside class="ms-folders" aria-label="${T('Carpetas','Folders')}"></aside><section class="ms-list"></section><section class="ms-conv" aria-live="polite"></section></div></div>`;
  if (M.cid){ const c = H.client(M.cid); if (unread(c)) c.thread.forEach(m => m.unread = false); }  /* mark read on open */
  drawFolders(); drawList(); drawConv(true);
  if (M.cid) setTimeout(() => H.emit('client', H.client(M.cid)), 0);  /* refresh the rail count */
  const rows = root.querySelector('.ms-rows'); if (rows) rows.scrollTop = M.scroll;
  root.addEventListener('click', onClick); root.addEventListener('input', onInput); root.addEventListener('change', onChange);
  root.addEventListener('keydown', e => { const r = e.target.closest('[data-ms-open]'); if (r && (e.key === 'Enter' || e.key === ' ') && e.target === r){ e.preventDefault(); open(r.dataset.msOpen); }
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.matches('[data-ms-ta]')) send(); });
  return () => { if (M.root === root) M.root = null; };
} });

H.on('client', () => { if (!M.root || !document.body.contains(M.root) || !M.root.querySelector('.ms-folders')) return; drawFolders(); drawList(); drawConv(false); });

function chipF(f){ const n = count(f); return `<button type="button" class="ms-fc ${M.folder === f.k ? 'ms-fcon' : ''}" data-ms-f="${f.k}" role="tab" aria-selected="${M.folder === f.k}">${f.agent ? H.avatar(f.agent, 'sm') : H.icon(f.icon)}<span>${E(f.agent ? f.agent.name.split(' ')[0] : f.label)}</span>${n.u ? `<i class="ms-cnt">${n.u}</i>` : ''}</button>`; }
function drawFolders(){ const fs = folders(), el = M.root.querySelector('.ms-folders'), ch = M.root.querySelector('.ms-fchips');
  const item = f => { const n = count(f); return `<button type="button" class="ms-fi ${M.folder === f.k ? 'ms-fion' : ''}" data-ms-f="${f.k}" ${M.folder === f.k ? 'aria-current="true"' : ''}>${f.agent ? H.avatar(f.agent, 'sm') : `<span class="ms-fic">${H.icon(f.icon)}</span>`}<span class="ms-fl"><b>${E(f.label)}</b>${f.sub ? `<small>${E(f.sub)}</small>` : ''}</span>${n.u ? `<i class="ms-cnt">${n.u}</i>` : `<i class="ms-tot">${n.n}</i>`}</button>`; };
  el.innerHTML = fs.filter(f => !f.agent).map(item).join('') + `<h6 class="ms-fh">${T('Por agente','By agent')}</h6>` + fs.filter(f => f.agent).map(item).join('') +
    `<p class="ms-fnote">${(H.isAdmin() ? T('Como administrador, usted puede abrir la bandeja de cada agente. Mi bandeja tiene sus clientes y los textos a su número del Hub.','As an admin you can open every agent\'s inbox. My inbox has your clients and texts to your Hub number.') : T('Mi bandeja tiene sus clientes y los textos a su número del Hub. La línea del equipo la ve todo el equipo. Las bandejas de otros agentes solo las abren los administradores.','My inbox has your clients and texts to your Hub number. The whole team sees the team line. Only admins open other agents\' inboxes.'))}</p>`;
  ch.innerHTML = fs.map(chipF).join(''); }

function rowsFor(f){ const q = M.q.trim().toLowerCase();
  return convos().filter(c => visible(c) && f.test(c)).filter(c => !q || H.name(c).toLowerCase().includes(q) || c.phone.replace(/\D/g, '').includes(q.replace(/\D/g, '') || '#') || c.thread.some(m => txt(m).toLowerCase().includes(q))); }
function drawList(){ const f = folders().find(x => x.k === M.folder), el = M.root.querySelector('.ms-list'); if (!f) return;
  const prev = el.querySelector('.ms-rows'); if (prev) M.scroll = prev.scrollTop;
  if (f.drafts){ const ds = drafts();
    el.innerHTML = `<div class="ms-lhead"><div><b>${E(f.label)}</b><small>${T('Lola los escribió después de cada llamada. Nada se envía solo.','Lola wrote these after each call. Nothing sends on its own.')}</small></div></div>
      <div class="ms-rows">${ds.length ? ds.map(d => { const c = H.client(d.cid); return `<div class="ms-draft" data-ms-d="${d.id}"><div class="ms-dh"><button class="ms-dn" type="button" data-ms-open="${c.id}">${E(H.name(c))}</button><small>${T('Después de la llamada de','After the call by')} ${E(H.user(d.by)?.name || 'Lola')} · ${H.fmt.ago(d.at)}</small></div>
        <textarea data-ms-dta rows="3" aria-label="${T('Texto de Lola','Lola\'s text')}">${E(d.text)}</textarea>
        <div class="ms-drow">${M.why === d.id ? `<span class="ms-why">${T('¿Por qué?','Why?')}</span>${WHY().map((w, i) => `<button class="chip" type="button" data-ms="dwhy-${i}">${E(w.label)}</button>`).join('')}<button class="btn btn-sm btn-ghost" type="button" data-ms="dwhyx">${T('Cancelar','Cancel')}</button>`
          : `<button class="btn btn-pri btn-sm" type="button" data-ms="dsend">${H.icon('send')}${T('Enviar','Send')}</button><button class="btn btn-sm btn-ghost" type="button" data-ms="ddel">${T('Ya no hace falta','Not needed')}</button>`}</div></div>`; }).join('')
      : `<p class="ms-empty">${H.icon('check')}${T('No hay textos de Lola pendientes.','No pending texts from Lola.')}</p>`}</div>`;
    const r = el.querySelector('.ms-rows'); if (r) r.scrollTop = M.scroll; return; }
  const list = rowsFor(f);
  el.innerHTML = `<div class="ms-lhead"><div><b>${E(f.label)}</b><small>${list.length} ${T('conversaciones','conversations')}${f.sub ? ' · ' + E(f.sub) : ''}</small></div>${list.length ? `<button class="btn btn-sm" type="button" data-ms="calllist" title="${T('Llamar a esta lista, uno por uno','Call this list, one by one')}">${H.icon('phone')}<span>${T('Llamar a la lista','Call the list')}</span></button>` : ''}</div>
    <div class="ms-rows">${list.length ? list.map(row).join('') : `<p class="ms-empty">${H.icon('inbox')}${M.q ? T('Nada con esa búsqueda.','Nothing matches that search.') : f.k === 'mi' ? T('Cuando un cliente le escriba a su número del Hub, o sea su encargado, aparece aquí.','When a client texts your Hub number, or you are in charge of them, they show up here.') : T('No hay conversaciones en esta carpeta.','No conversations in this folder.')}</p>`}</div>`;
  const r = el.querySelector('.ms-rows'); if (r) r.scrollTop = M.scroll; }
function row(c){ const m = last(c), p = pend(c.id).slice(-1)[0], u = unread(c);
  const chs = ['text','app','lola'].filter(k => c.thread.some(x => x.ch === k) || pend(c.id).some(x => x.ch === k));
  const prevTxt = p ? T('Usted: ','You: ') + p.text : m ? (m.dir === 'out' ? (m.by === 'lola' ? 'Lola: ' : T('Usted: ','You: ')) : '') + (m.voice ? T('Nota de voz: ','Voice note: ') : m.photo ? T('Foto: ','Photo: ') : '') + txt(m) : '';
  const todo = m && m.dir === 'in' ? T('Contestarle · escribió hace ','Reply · wrote ') + H.fmt.ago(m.at) + T('',' ago') : H.whatToDo(c);
  return `<div class="ms-row ${u ? 'ms-unread' : ''} ${M.cid == c.id ? 'ms-sel' : ''}" role="button" tabindex="0" data-ms-open="${c.id}" aria-label="${E(H.name(c))}">
    <span class="av ms-cav ${c.nameless ? 'ms-noname' : ''}">${E(H.initials(c))}</span>
    <span class="ms-rm"><span class="ms-rt"><b class="ms-rn">${E(c.nameless ? c.phone : H.name(c))}</b><time>${when(lastAt(c))}</time></span>
      <span class="ms-rp">${E(prevTxt)}</span>
      <span class="ms-rc">${chs.map(k => `<span class="chip ch-${k}">${k === 'text' ? T('Texto','Text') : k === 'app' ? 'App' : 'Lola'}</span>`).join('')}${c.nameless ? `<span class="ms-nn">${T('Cliente nuevo','New client')}</span><button class="ms-addn" type="button" data-ms="addname" data-cid="${c.id}">${H.icon('plus')}${T('Agregar nombre','Add name')}</button>` : `<span class="ms-st">${E(c.stage)}</span>`}</span>
      <span class="ms-rd"><b>${T('Qué hacer','To do')}:</b> ${E(todo)}</span></span>${u ? `<i class="ms-dot" aria-label="${T('Sin leer','Unread')}"></i>` : ''}</div>`; }

/* ---------- conversation ---------- */
function drawConv(full){ const el = M.root.querySelector('.ms-conv'), c = H.client(M.cid);
  if (!c){ el.innerHTML = `<div class="ms-none">${H.icon('chat')}<b>${T('Elija una conversación','Pick a conversation')}</b><p>${T('Textos, mensajes de la App y de Lola de cada cliente, juntos en una sola conversación.','Each client\'s texts, App messages and Lola messages together in one conversation.')}</p>
    <p class="ms-legend"><span class="chip ch-text">${T('Texto','Text')}</span><span class="chip ch-app">App</span><span class="chip ch-lola">Lola</span></p></div>`; return; }
  if (full || !el.querySelector('.ms-reply')){ el.innerHTML = `<div class="ms-ch"></div><div class="ms-msgs"></div><div class="ms-reply"></div>`; drawReply(c); }
  drawHead(c); drawMsgs(c); }
function drawHead(c){ const enc = H.user(c.encargado), el = M.root.querySelector('.ms-ch');
  el.innerHTML = `<button class="ms-back" type="button" data-ms="back" aria-label="${T('Volver','Back')}">${H.icon('left')}</button>
    <span class="av ms-cav ${c.nameless ? 'ms-noname' : ''}">${E(H.initials(c))}</span>
    <div class="ms-chi"><div class="ms-chn"><button class="ms-cname" type="button" data-ms="profile" title="${T('Abrir perfil','Open profile')}">${E(H.name(c))}</button>${H.stageChip(c.stage)}</div>
      <small>${E(c.phone)} · <span class="ms-encl">${T('Encargado','In charge')}:</span> ${enc ? H.avatar(enc, 'sm') + ' ' + E(enc.name) : T('Nadie todavía (Leads pond)','Nobody yet (Leads pond)')}</small></div>
    <div class="ms-cha"><button class="btn btn-pri" type="button" data-ms="call">${H.icon('phone')}<span>${T('Llamar','Call')}</span></button>
      <button class="btn ms-ib" type="button" data-ms="unread" title="${T('Marcar como no leído','Mark as unread')}" aria-label="${T('Marcar como no leído','Mark as unread')}">${H.icon('mail')}</button>
      <div class="ms-more"><button class="btn ms-ib" type="button" data-ms="menu" aria-label="${T('Más','More')}" aria-expanded="${M.menu}">${H.icon('dots')}</button>
        ${M.menu ? `<div class="ms-menu"><button type="button" data-ms="profile">${H.icon('user')}${T('Abrir perfil','Open profile')}</button><button type="button" data-ms="unread">${H.icon('mail')}${T('Marcar como no leído','Mark as unread')}</button><button type="button" data-ms="homes">${H.icon('home')}${T('Enviar casas','Send homes')}</button><button type="button" data-ms="email">${H.icon('mail')}${T('Mandar correo','Send email')}</button><button type="button" data-ms="vm">${H.icon('voicemail')}${T('Dejar buzón sin llamar','Drop voicemail')}</button></div>` : ''}</div></div>
    ${c.nameless ? `<div class="ms-nameb">${M.nameOpen ? `<input data-ms-fn placeholder="${T('Nombre','First name')}" aria-label="${T('Nombre','First name')}"><input data-ms-ln placeholder="${T('Apellido','Last name')}" aria-label="${T('Apellido','Last name')}"><button class="btn btn-pri btn-sm" type="button" data-ms="savename">${T('Guardar','Save')}</button>`
      : `<span>${H.icon('user')}${T('Esta cuenta de la App no tiene nombre todavía.','This App account has no name yet.')}</span><button class="btn btn-sm" type="button" data-ms="addname" data-cid="${c.id}">${H.icon('plus')}${T('Agregar nombre','Add name')}</button>`}</div>` : ''}`; }
function drawMsgs(c){ const el = M.root.querySelector('.ms-msgs'), atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 60 || !el.dataset.cid || el.dataset.cid != c.id;
  let day = '', h = '';
  c.thread.forEach(m => { const d = new Date(m.at).toDateString(); if (d !== day){ day = d; h += `<div class="ms-day"><span>${dayLabel(m.at)}</span></div>`; } h += bubble(c, m); });
  pend(c.id).forEach(p => h += bubble(c, { dir:'out', ch:p.ch, by:H.me().id, at:p.at, text:{ es:p.text, en:p.text }, line:p.from, attach:p.attach && p.attach.name, pending:true }));
  if (c.lolaPause && c.lolaPause > Date.now()) h += `<p class="ms-paused">${H.icon('pause')}${T('Lola está en pausa con este cliente hasta ','Lola is paused for this client until ')}${H.fmt.dateLong(c.lolaPause)} · ${H.fmt.time(c.lolaPause)}</p>`;
  el.innerHTML = h; el.dataset.cid = c.id; if (atBottom) el.scrollTop = el.scrollHeight; }
function dayLabel(ts){ const d = new Date(ts), n = new Date(); if (d.toDateString() === n.toDateString()) return T('Hoy','Today'); n.setDate(n.getDate() - 1); if (d.toDateString() === n.toDateString()) return T('Ayer','Yesterday'); return H.fmt.dateLong(ts); }
function bubble(c, m){ const who = m.dir === 'in' ? '' : m.by === 'lola' ? 'Lola' : (H.user(m.by)?.name.split(' ')[0] || '');
  const chip = `<span class="chip ch-${m.ch}">${m.ch === 'text' ? T('Texto','Text') : m.ch === 'app' ? 'App' : 'Lola'}</span>`;
  const line = m.ch === 'text' && m.line ? (m.line === 'team' ? H.TEAM_LINE : H.user(m.line)?.line || '') : '';
  const voice = m.voice ? `<div class="ms-voice"><button type="button" data-ms="play" aria-label="${T('Escuchar','Play')}">${H.icon('play2')}</button><span class="ms-wave">${Array.from({length:22}, (_, i) => `<i style="height:${6 + ((i * 7) % 13)}px"></i>`).join('')}</span><small>0:14</small></div><small class="ms-vl">${H.icon('mic')}${T('Nota de voz · transcrita','Voice note · transcribed')}</small>` : '';
  const photo = m.photo || (m.attach && !/\.pdf$/i.test(m.attach)) ? `<button class="ms-photo" type="button" data-ms="photo">${H.icon('file')}<span>${E(m.attach || T('foto-del-cliente.jpg','client-photo.jpg'))}</span><small>${T('Guardada en JAG','Kept in JAG storage')}</small></button>` : m.attach ? `<span class="ms-pdf">${H.icon('doc')}${E(m.attach)}</span>` : '';
  return `<div class="ms-m ms-${m.dir === 'in' ? 'in' : m.ch === 'lola' ? 'lola' : 'out'} ${m.pending ? 'ms-pend' : ''}"><div class="ms-b">${voice}${photo}<p>${E(txt(m))}</p></div>
    <div class="ms-meta">${chip}<span>${H.fmt.time(m.at)}</span>${who ? `<span>· ${E(who)}</span>` : ''}${line ? `<span>· ${m.dir === 'in' ? T('a','to') : T('desde','from')} ${E(line)}</span>` : ''}${m.pending ? `<span class="ms-sending">· ${T('Enviando… puede deshacer','Sending… you can undo')}</span>` : ''}</div></div>`; }

/* ---------- reply box: goes back the way the client last wrote ---------- */
const WHY = () => [ ['Ya le escribí yo','I already wrote to them'], ['Ya no aplica','No longer applies'], ['Cliente no interesado','Client not interested'] ].map(([es, en]) => ({ es, en, label:T(es, en) }));
const QUICK = c => [ cl(c, '¿A qué hora le puedo llamar?', 'What time can I call you?'), cl(c, 'Le mando casas hoy mismo.', 'I\'ll send you homes today.'), cl(c, '¿Pudo subir sus documentos?', 'Were you able to upload your documents?'), cl(c, 'Gracias, quedo al pendiente.', 'Thanks, I\'ll be here.') ];
H.lolaSuggest = c => { const m = lastIn(c), s = m ? m.text.es.toLowerCase() : '', a = H.me().name.split(' ')[0], area = c.areas[0] || 'Houston';
  const R = [ [/disponible/, '¡Sí, sigue disponible! ¿Le queda bien el sábado a las 10 de la mañana para verla?', 'Yes, it\'s still available! Does Saturday at 10 AM work to see it?'],
    [/enganche/, 'Depende del préstamo: con FHA es desde 3.5% del precio. Si gusta, le llamo hoy y lo vemos con sus números.', 'It depends on the loan: with FHA it starts at 3.5% of the price. If you like, I can call you today and go over your numbers.'],
    [/talones|sub[ií]/, '¡Gracias! Ya los revisamos. ¿Me puede mandar también su W-2 del año pasado?', 'Thank you! We\'re reviewing them. Can you also send last year\'s W-2?'],
    [/patio/, 'Sí, tiene un patio amplio. ¿Quiere que agendemos para ir a verla esta semana?', 'Yes, it has a big yard. Would you like to schedule a visit this week?'],
    [/esposo|esposa/, '¡Qué bien! Le mando el enlace para que él llene su parte de la solicitud; toma unos 10 minutos.', 'Great! I\'ll send the link so he can fill out his part of the application; it takes about 10 minutes.'],
    [/permiso/, 'Recibido, gracias. Ya quedó guardado en su expediente.', 'Received, thank you. It\'s saved in your file.'],
    [/ver|gust/, `¡Claro! ¿Qué día le queda mejor para ver casas en ${area}, entre semana en la tarde o el sábado?`, `Of course! Which day works better to see homes in ${area}, a weekday afternoon or Saturday?`],
    [/^hola\b/, `¡Hola! Soy ${a} de Jason Aguirre Group. ¿Con quién tengo el gusto?`, `Hi! This is ${a} with the Jason Aguirre Group. Who am I speaking with?`] ];
  const r = R.find(x => x[0].test(s)); return r ? cl(c, r[1], r[2]) : cl(c, '¡Gracias por escribir! ¿A qué hora le puedo llamar hoy?', 'Thanks for writing! What time can I call you today?'); };
function drawReply(c){ const el = M.root.querySelector('.ms-reply'), ch = M.ch[c.id] || clientCh(c), app = hasApp(c), from = fromLine(c), sug = H.lolaSuggest(c), att = M.att[c.id];
  el.innerHTML = `<div class="ms-rtop"><div class="ms-seg" role="group" aria-label="${T('Responder por','Reply by')}"><button type="button" data-ms="ch-text" class="${ch === 'text' ? 'ms-segon' : ''}" aria-pressed="${ch === 'text'}">${T('Texto','Text')}</button><button type="button" data-ms="ch-app" class="${ch === 'app' ? 'ms-segon' : ''}" ${app ? '' : 'disabled title="' + T('No tiene la App','No App account') + '"'} aria-pressed="${ch === 'app'}">App</button></div>
      <span class="ms-how">${ch === 'app' ? T('Responder en la App','Reply in the App') : T('Responder por Texto','Reply by Text') + ' · ' + T('desde','from') + ' ' + E(from === 'team' ? H.TEAM_LINE : H.me().line)}${ch === clientCh(c) ? ` <span class="ms-howw">(${T('así le escribió el cliente','how the client wrote')})</span>` : ''}</span></div>
    <button class="ms-lola" type="button" data-ms="lola" title="${E(sug)}">${H.icon('spark')}<b>${T('Lola sugiere','Lola suggests')}:</b><span>${E(sug)}</span></button>
    <div class="ms-quick">${QUICK(c).map((q, i) => `<button class="chip" type="button" data-ms="q-${i}">${E(q)}</button>`).join('')}</div>
    <textarea class="ms-ta" data-ms-ta rows="2" placeholder="${ch === 'app' ? T('Escriba su mensaje para la App…','Write your App message…') : T('Escriba su texto…','Write your text…')}" aria-label="${T('Respuesta','Reply')}">${E(M.draft[c.id] || '')}</textarea>
    <div class="ms-rbot"><label class="btn btn-sm btn-ghost ms-att">${H.icon('attach')}<span>${T('Foto o PDF','Photo or PDF')}</span><input type="file" accept="image/*,application/pdf" data-ms-file hidden></label>${att ? `<span class="chip blue ms-attc">${E(att.name)}<button type="button" data-ms="unatt" aria-label="${T('Quitar','Remove')}">${H.icon('x')}</button></span>` : ''}<span class="ms-grow"></span>
      <button class="btn btn-pri" type="button" data-ms="send">${H.icon('send')}${T('Enviar','Send')}</button></div>
    <p class="ms-pnote">${T('Lola pausa sus textos automáticos 24 horas después de que usted le escriba al cliente.','Lola pauses her automatic texts for 24 hours after you write to the client.')}</p>`; }
function send(){ const c = H.client(M.cid); if (!c) return; const ta = M.root.querySelector('[data-ms-ta]'), v = ta.value.trim(), att = M.att[c.id];
  if (!v && !att){ ta.focus(); return; }
  if (!H.sendText){ H.toast(T('Textos: en construcción','Texting: being built')); return; }
  H.sendText(c.id, v, { ch: M.ch[c.id] || clientCh(c), from: fromLine(c), attach: att });
  M.draft[c.id] = ''; delete M.att[c.id]; drawReply(c); }
function open(id){ M.scroll = M.root.querySelector('.ms-rows')?.scrollTop || 0; H.go('mensajes', M.folder + '.' + id); }

function onInput(e){ if (e.target.matches('[data-ms-q]')){ M.q = e.target.value; drawList(); }
  if (e.target.matches('[data-ms-ta]')) M.draft[M.cid] = e.target.value;
  if (e.target.matches('[data-ms-dta]')){ const d = H.lolaDrafts.find(x => x.id == e.target.closest('[data-ms-d]').dataset.msD); if (d) d.text = e.target.value; } }
function onChange(e){ if (!e.target.matches('[data-ms-file]')) return; const f = e.target.files[0]; if (!f) return;
  if (f.size > 5e6){ H.toast(T('El archivo es muy grande (máx. 5 MB).','File is too big (max 5 MB).')); return; }
  M.att[M.cid] = { name:f.name, kind:f.type }; drawReply(H.client(M.cid)); }
function onClick(e){
  const fb = e.target.closest('[data-ms-f]'); if (fb){ M.q = ''; H.go('mensajes', fb.dataset.msF); return; }
  const b = e.target.closest('[data-ms]'), a = b && b.dataset.ms;
  if (M.menu && a !== 'menu'){ M.menu = false; const c0 = H.client(M.cid); if (c0) drawHead(c0); if (!a) return; }
  if (!a){ const r = e.target.closest('[data-ms-open]'); if (r) open(r.dataset.msOpen); const sm = M.root.querySelector('.ms-simm'); if (sm && !e.target.closest('.ms-sim')) sm.hidden = true; return; }
  const c = H.client(M.cid);
  if (a === 'sim'){ const sm = M.root.querySelector('.ms-simm'); sm.hidden = !sm.hidden; b.setAttribute('aria-expanded', String(!sm.hidden)); return; }
  if (a === 'sim-known' || a === 'sim-unknown'){ M.root.querySelector('.ms-simm').hidden = true; H.incomingCall ? H.incomingCall(a === 'sim-known' ? undefined : null) : H.toast(T('Llamadas: en construcción','Calling: being built')); return; }
  if (a === 'calllist'){ const f = folders().find(x => x.k === M.folder); H.callList ? H.callList(rowsFor(f).map(x => x.id)) : H.toast(T('Llamadas: en construcción','Calling: being built')); return; }
  if (a === 'addname'){ const id = Number(b.dataset.cid); if (M.cid !== id){ M.nameOpen = true; open(id); setTimeout(() => { M.nameOpen = true; const cc = H.client(id); if (cc && M.root){ drawHead(cc); M.root.querySelector('[data-ms-fn]')?.focus(); } }, 30); return; } M.nameOpen = true; drawHead(c); M.root.querySelector('[data-ms-fn]')?.focus(); return; }
  if (a === 'ddel' || a === 'dwhyx'){ M.why = a === 'ddel' ? Number(b.closest('[data-ms-d]').dataset.msD) : null; drawList(); return; }
  if (a === 'dsend' || a.startsWith('dwhy-')){ const card = b.closest('[data-ms-d]'), d = H.lolaDrafts.find(x => x.id == card.dataset.msD); if (!d) return; const i = H.lolaDrafts.indexOf(d);
    H.lolaDrafts.splice(i, 1); M.why = null;
    if (a === 'dsend') H.sendText(d.cid, card.querySelector('[data-ms-dta]').value, { ch:'text', onUndo: () => { H.lolaDrafts.splice(i, 0, d); drawFolders(); drawList(); } });
    else { const w = WHY()[+a.slice(5)]; let e;
      H.undoable({ msg:T('Texto de Lola descartado: ','Lola\'s text discarded: ') + w.label,
        run: () => { e = H.log(d.cid, { type:'lola', text:{ es:'Texto de Lola no enviado · ' + w.es, en:'Lola\'s text not sent · ' + w.en } }); },
        undo: () => { const c = H.client(d.cid), k = c ? c.timeline.indexOf(e) : -1; if (k > -1) c.timeline.splice(k, 1); H.lolaDrafts.splice(i, 0, d); H.emit('client', c); drawFolders(); drawList(); } }); }
    drawFolders(); drawList(); return; }
  if (!c) return;
  if (a === 'back') H.go('mensajes', M.folder);
  else if (a === 'profile') H.openClient(c.id);
  else if (a === 'call') H.call ? H.call(c.id) : H.toast(T('Llamadas: en construcción','Calling: being built'));
  else if (a === 'menu'){ M.menu = !M.menu; drawHead(c); }
  else if (a === 'unread'){ const m = lastIn(c); if (m){ m.unread = true; H.emit('client', c); } H.toast(T('Marcado como no leído','Marked as unread')); H.go('mensajes', M.folder); }
  else if (a === 'homes') H.sendHomes ? H.sendHomes(c.id) : H.toast(T('Enviar casas se abre desde Matrix.','Send homes opens from Matrix.'));
  else if (a === 'email') H.compose ? H.compose(c.id, 'email') : H.toast(T('Correo: en construcción','Email: being built'));
  else if (a === 'vm') H.voicemailDrop && H.voicemailDrop(c.id);
  else if (a === 'savename'){ const fn = M.root.querySelector('[data-ms-fn]').value.trim(), ln = M.root.querySelector('[data-ms-ln]').value.trim(); if (!fn){ M.root.querySelector('[data-ms-fn]').focus(); return; } M.nameOpen = false; H.updateContact(c.id, { first:fn, last:ln }); H.toast(T('Nombre guardado · quedó en el historial','Name saved · logged on the history')); }
  else if (a.startsWith('ch-')){ M.ch[c.id] = a.slice(3); drawReply(c); }
  else if (a === 'lola'){ const ta = M.root.querySelector('[data-ms-ta]'); ta.value = H.lolaSuggest(c); M.draft[c.id] = ta.value; ta.focus(); }
  else if (a.startsWith('q-')){ const ta = M.root.querySelector('[data-ms-ta]'); ta.value = (ta.value ? ta.value.trim() + ' ' : '') + QUICK(c)[+a.slice(2)]; M.draft[c.id] = ta.value; ta.focus(); }
  else if (a === 'unatt'){ delete M.att[c.id]; drawReply(c); }
  else if (a === 'send') send();
  else if (a === 'play'){ const v = b.closest('.ms-voice'); v.classList.add('ms-playing'); b.innerHTML = H.icon('pause'); setTimeout(() => { v.classList.remove('ms-playing'); b.innerHTML = H.icon('play2'); }, 3000); }
  else if (a === 'photo') H.sheet(`<h2>${T('Foto del cliente','Client photo')}</h2><p class="muted" style="margin:0 0 12px">${T('Guardada en el almacenamiento de JAG y en el expediente del cliente. No se abre ningún enlace externo.','Kept in JAG storage and on the client\'s file. No outside link is opened.')}</p><div class="ms-bigph">${H.icon('file')}<span>${E(H.name(c))}</span></div>`);
}

/* sample: two follow-up texts Lola wrote after earlier calls, waiting for someone to send them */
{ const pick = H.team.map(u => H.clients.find(c => c.encargado === u.id && !c.thread.length && ['Lead','Hot Prospect','New Lead'].includes(c.stage))).filter(Boolean);
  pick.forEach((c, i) => H.lolaDrafts.push({ id: 900 + i, cid: c.id, by: c.encargado, at: H.now() - (2 + i * 3) * 36e5,
    text: cl(c, `Hola ${c.first}, gracias por la llamada de hoy. Como quedamos, el siguiente paso es la solicitud en la app JAG Homes (unos 10 minutos). Cualquier duda aquí estoy. – ${H.user(c.encargado).name.split(' ')[0]}, Jason Aguirre Group`, `Hi ${c.first}, thanks for the call today. As we said, the next step is the application in the JAG Homes app (about 10 minutes). Any questions, I'm here. – ${H.user(c.encargado).name.split(' ')[0]}, Jason Aguirre Group`) })); }

}
