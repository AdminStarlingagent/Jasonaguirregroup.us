  else if (a.startsWith('res:')) { const prev = o.status, ns = a.slice(4); H.undoable({ msg: tx(stText(ns)), run: () => { o.status = ns; o.updated = Date.now(); re(); }, undo: () => { o.status = prev; re(); },
    commit: () => H.log(c.id, { type: 'offer', text: { es: 'Oferta en ' + addr + ': ' + stText(ns).es, en: 'Offer on ' + addr + ': ' + stText(ns).en } }) }); }
  else if (a === 'toUC') { c.deal = { listingId: o.listingId, price: l.price, offer: o.f.price, optionEnd: Date.now() + (o.f.optDays || 7) * DAY, closing: o.f.closing || Date.now() + 30 * DAY }; H.setStage(c.id, 'Under Contract');
    if (o.f.loan !== 'cash' && c.lender) lenderDraft(c, l, o.f.conc); H.toast(T('Listo. Las fechas ya salen en Cierres.', 'Done. Dates now show in Closings.')); re(); }
  else if (a === 'homes') H.sendHomes ? H.sendHomes(c.id) : H.toast(T('Enviar casas: en construcción', 'Send homes: being built'));
}
const jobsList = lg => ['owner', 'showing', 'specialist', 'tc'].map(j => H.JOBS[j][lg]).join(', ');
function clientSigned(o, c, l, re) { const addr = l ? l.addr : ''; o.status = 'ready'; o.updated = Date.now(); o.pdf = true;
  c.signedDocs = c.signedDocs || []; c.signedDocs.unshift({ name: 'Offer ' + addr + ' (signed).pdf', at: Date.now(), offerId: o.id });
  H.log(c.id, { type: 'offer', by: null, text: { es: 'El cliente firmó la oferta en ' + addr + '. PDF firmado guardado en el perfil y enviado a ' + CLOSINGS + '.', en: 'Client signed the offer on ' + addr + '. Signed PDF saved to the profile and emailed to ' + CLOSINGS + '.' } });
  H.notify({ kind: 'applied', icon: 'sign', client: c.id, to: ['owner', 'showing', 'specialist', 'tc'], text: { es: 'Firmó la oferta en ' + addr + '. Avisamos a: ' + jobsList('es') + '.', en: 'Signed the offer on ' + addr + '. Notified: ' + jobsList('en') + '.' } });
  const a = agentOf(l); draft({ clientId: c.id, offerId: o.id, kind: 'listing', send: 'offer', to: a.email, cc: teamCc(c), subj: 'Offer on ' + addr + ' · ' + H.fmt.price(o.f.price), sum: { es: 'Manda la oferta firmada (PDF adjunto) al agente de la vendedora.', en: 'Sends the signed offer (PDF attached) to the listing agent.' },
    body: `Hi ${a.name.split(' ')[0]},\n\nAttached is our buyer's signed offer on ${addr} for ${H.fmt.price(o.f.price)}, ${LOANS.find(x => x[0] === o.f.loan)[2]}, closing on or before ${o.f.closing ? new Date(o.f.closing).toLocaleDateString('en-US') : 'TBD'}. The pre-approval letter is attached too.\n\nPlease confirm you received it. Our team is copied.\n\nThank you,\nClosings desk · Jason Aguirre Group, eXp Realty\n${H.OFFICE}` });
  re(); H.toast(T('El cliente firmó. Lola preparó el correo para el agente de la vendedora en Cierres.', 'The client signed. Lola drafted the email to the listing agent in Closings.')); }

const FONTS = [['Cursiva', 'Script'], ['Clásica', 'Classic'], ['Iniciales', 'Initials']];
function signSheet(o, who, done) {
  const c = H.client(o.clientId), l = H.listing(o.listingId), lg = who === 'client' ? c.lang : H.lang, S = (es, en) => L2(lg, es, en);
  const nm = who === 'owner' ? (ownerU() ? ownerU().name : '') : o.f.buyers.split(' and ')[0], ph = who === 'owner' ? (ownerU() ? ownerU().line : '') : o.f.phone, code = CODE(o);
  const want = who === 'owner' ? code : code.split('').reverse().join('');
  let style = null, img = null;
  const s = H.sheet(`<div class="of-sgn">${who === 'client' ? `<p class="chip blue">${T('Así lo ve el cliente en su celular (' + (c.lang === 'en' ? 'inglés' : 'español') + ')', 'What the client sees on their phone (' + (c.lang === 'en' ? 'English' : 'Spanish') + ')')}</p>` : ''}
    <h2>${S('Firmar la oferta', 'Sign the offer')}</h2><p class="muted">${E(l ? l.addr + ', ' + l.city : '')} · ${H.fmt.price(o.f.price)}</p>
    <p class="of-sq">${S('1. Escoja cómo se ve su firma', '1. Choose how your signature looks')}</p>
    <div class="of-styles">${FONTS.map((f, i) => `<button type="button" class="of-sty" data-sty="${i}" aria-pressed="false"><span class="of-sig of-sig${i}">${E(i === 2 ? nm.split(' ').map(w => w[0]).join('.') + '.' : nm)}</span><small>${S(f[0], f[1])}</small></button>`).join('')}
      <button type="button" class="of-sty" data-sty="draw" aria-pressed="false">${H.icon('sign')}<small>${S('Dibujar con el dedo o el mouse', 'Draw with finger or mouse')}</small></button></div>
    <div class="of-pad" hidden><canvas width="600" height="160" aria-label="${S('Área para firmar', 'Signing area')}"></canvas><button class="btn btn-sm" type="button" data-clr>${S('Borrar', 'Clear')}</button></div>
    <p class="of-sq">${S('2. Escriba el código que le mandamos por texto', '2. Enter the code we texted you')}</p>
    <p class="muted of-ph">${S('Enviado a', 'Sent to')} <b>${E(ph)}</b> · <span class="sample">${S('Código de ejemplo', 'Sample code')}: ${want}</span></p>
    <div class="of-code"><input inputmode="numeric" maxlength="6" autocomplete="one-time-code" aria-label="${S('Código de 6 números', '6-digit code')}" placeholder="000000"><button class="btn btn-sm btn-ghost" type="button" data-resend>${S('Reenviar código', 'Resend code')}</button></div>
    <p class="of-err" hidden></p>
    <p class="sample">${S('Al firmar acepta firmar este documento de forma electrónica.', 'By signing you agree to sign this document electronically.')}</p>
    <button class="btn btn-pri btn-block" type="button" data-sign>${H.icon('sign')}${S('Firmar', 'Sign')}</button></div>`, { wide: true });
  const cv = s.querySelector('canvas'), ctx = cv.getContext('2d'), err = s.querySelector('.of-err'); let drawing = false, drew = false;
  ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.strokeStyle = '#17161C';
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  cv.onpointerdown = e => { drawing = true; cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...pos(e)); };
  cv.onpointermove = e => { if (!drawing) return; ctx.lineTo(...pos(e)); ctx.stroke(); drew = true; };
  cv.onpointerup = () => { drawing = false; };
  s.onclick = e => { const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.sty != null) { style = b.dataset.sty; s.querySelectorAll('.of-sty').forEach(x => x.setAttribute('aria-pressed', x === b)); s.querySelector('.of-pad').hidden = style !== 'draw'; }
    else if ('clr' in b.dataset) { ctx.clearRect(0, 0, cv.width, cv.height); drew = false; }
    else if ('resend' in b.dataset) H.toast(S('Código reenviado', 'Code resent'));
    else if ('sign' in b.dataset) { const v = s.querySelector('.of-code input').value.replace(/\D/g, '');
      const fail = m => { err.textContent = m; err.hidden = false; };
      if (style == null) return fail(S('Escoja un estilo de firma o dibuje la suya.', 'Choose a signature style or draw yours.'));
      if (style === 'draw' && !drew) return fail(S('Dibuje su firma en el recuadro.', 'Draw your signature in the box.'));
      if (v !== want) return fail(S('El código no coincide. Revise el texto que le llegó.', 'The code does not match. Check the text you got.'));
      if (style === 'draw') img = cv.toDataURL('image/png');
      o.sign[who] = { at: Date.now(), style: style === 'draw' ? 'd' : +style, img }; H.close(); done(); } };
}

/* ---------------- closings desk ---------------- */
const KIND = { listing: ['Agente de la vendedora', 'Listing agent', 'blue'], lender: ['Prestamista', 'Lender', 'warn'], title: ['Título', 'Title', 'green'], amend: ['Enmienda TREC', 'TREC amendment', 'ink'] };
let openD = null;
const rewrite = (body, how) => { const greet = body.split('\n')[0], si = body.search(/\n(Thank you|Kind regards)/), cut = si < 0 ? body.length : si, sig = body.slice(cut).trim();
  const paras = body.slice(greet.length, cut).split(/\n\n+/).map(p => p.trim()).filter(p => p && !/^(We really appreciate)/.test(p));
  if (how === 'short') return greet + '\n\n' + paras[0].split(/(?<=[.?!])\s/).slice(0, 2).join(' ') + '\n\n' + sig;
  if (how === 'friendly') return (/hope/.test(greet) ? greet : greet.replace(/,$/, '') + ', I hope your week is going well!') + '\n\n' + paras.join('\n\n') + '\n\nWe really appreciate your help.\n\n' + sig;
  return greet.replace(/^(Hi|Hello)/, 'Good afternoon').replace(/, I hope.*$/, ',') + '\n\n' + paras.join('\n\n') + '\n\n' + sig.replace('Thank you', 'Kind regards'); };
const dlIcon = k => ({ option: 'clock', financing: 'dollar', closing: 'key', unsigned: 'sign' }[k]);
function deskPage(root) {
  const drafts = desk.filter(d => d.status === 'draft'), dls = H.deadlines().filter(x => !amends.some(a => x.key.endsWith(':' + a.id))), out = amends.filter(a => a.state === 'out');

      <div class="of-way"><button class="btn btn-sm" type="button" data-dl="done" data-k="${x.key}">${H.icon('check')}${T('Hecho', 'Done')}</button><button class="btn btn-sm" type="button" data-dl="snooze" data-k="${x.key}">${H.icon('clock')}${T('Otra hora', 'Another time')}</button><button class="btn btn-sm btn-ghost" type="button" data-dl="gone" data-k="${x.key}">${T('Ya no hace falta', 'Not needed')}</button></div></div></div>`; };
  const card = d => { const c = H.client(d.clientId), k = KIND[d.kind], open = openD === d.id, lenderBad = d.kind === 'lender' && c && c.email && d.cc.toLowerCase().includes(c.email.toLowerCase());
    return `<article class="card of-dr ${open ? 'open' : ''}" data-id="${d.id}"><header><span class="chip ${k[2]}">${T(k[0], k[1])}</span><span class="chip ch-lola">${H.icon('spark')}${T('Borrador de Lola', 'Lola draft')}</span><small class="muted">${H.fmt.ago(d.created)}</small></header>
      <h3>${E(d.subj)}</h3><p class="of-drm"><a href="#cliente-${c.id}">${E(H.name(c))}</a> · ${T('Para', 'To')}: ${E(d.to)}</p><p class="of-sum">${E(tx(d.sum))}</p>
      ${open ? `<div class="of-ed"><div class="field"><label for="dto${d.id}">${T('Para', 'To')}</label><input id="dto${d.id}" data-e="to" value="${E(d.to)}"></div>
        <div class="field"><label for="dcc${d.id}">CC</label><input id="dcc${d.id}" data-e="cc" value="${E(d.cc)}"></div>
        <div class="field"><label for="dsu${d.id}">${T('Asunto', 'Subject')}</label><input id="dsu${d.id}" data-e="subj" value="${E(d.subj)}"></div>
        <div class="field"><label for="dbo${d.id}">${T('Mensaje', 'Message')}</label><textarea id="dbo${d.id}" data-e="body" rows="9">${E(d.body)}</textarea></div>
        ${d.kind === 'lender' ? `<p class="of-note ${lenderBad ? 'bad' : ''}">${H.icon('ban')}${lenderBad ? T('Quite al cliente de la copia: los correos del equipo al prestamista nunca llevan copia al cliente.', 'Remove the client from CC: team emails to the lender never copy the client.') : T('Sin copia al cliente: los correos del equipo al prestamista nunca le llegan al cliente.', 'Client not copied: team emails to the lender never go to the client.')}</p>` : ''}
        ${d.send === 'offer' || d.kind === 'amend' ? `<p class="of-att">${H.icon('attach')}${E(d.kind === 'amend' ? 'TREC 39 amendment.pdf' : 'Offer (signed).pdf · Pre-approval.pdf')}</p>` : ''}
        <div class="of-rw"><span>${H.icon('spark')}${T('Reescribir con Lola', 'Rewrite with Lola')}:</span><button class="btn btn-sm" type="button" data-rw="short">${T('Más corto', 'Shorter')}</button><button class="btn btn-sm" type="button" data-rw="friendly">${T('Más amable', 'Friendlier')}</button><button class="btn btn-sm" type="button" data-rw="formal">${T('Más formal', 'More formal')}</button></div>
        <div class="of-sa"><button class="btn btn-pri" type="button" data-send ${lenderBad ? 'disabled' : ''}>${H.icon('send')}${T('Enviar desde closings@', 'Send from closings@')}</button><button class="btn" type="button" data-tog>${T('Cerrar', 'Close')}</button><button class="btn btn-ghost" type="button" data-drop>${H.icon('trash')}${T('Descartar', 'Discard')}</button></div>
        <p class="sample">${T('Queda en el perfil del cliente como correo del equipo. Solo lo ve el equipo.', "Saved on the client's profile as a team email. Only the team sees it.")}</p></div>`
      : `<div class="of-sa"><button class="btn btn-pri btn-sm" type="button" data-tog>${H.icon('mail')}${T('Revisar y editar', 'Review and edit')}</button></div>`}</article>`; };
  root.innerHTML = tabs('c') + `<div class="of-wrap"><div class="of-head"><div><h1 class="pg">${T('Cierres', 'Closings')}</h1><p class="muted">${T('Lola prepara los correos y las enmiendas. Usted los revisa aquí y los envía desde ', 'Lola drafts the emails and amendments. You review them here and send from ')}<b>${CLOSINGS}</b>.</p></div></div>
    <ul class="of-rules"><li>${H.icon('lock')}${T('Nada se envía solo: usted revisa y toca Enviar.', 'Nothing sends on its own: you review and tap Send.')}</li><li>${H.icon('ban')}${T('Los correos al prestamista nunca llevan copia al cliente.', 'Emails to the lender never copy the client.')}</li><li>${H.icon('dollar')}${T('Cómo se reparten las concesiones lo decide el prestamista; Lola le pregunta.', "How concessions split is the lender's call; Lola asks them.")}</li><li>${H.icon('users')}${T('Cada correo queda en el perfil del cliente. Solo lo ve el equipo.', "Each email is logged on the client's profile. Only the team sees it.")}</li></ul>
    <div class="of-desk"><section class="of-dq"><h2 class="of-h2">${T('Borradores de Lola', 'Lola drafts')} <span class="chip">${drafts.length}</span></h2>${drafts.length ? drafts.map(card).join('') : `<p class="card of-empty">${H.icon('check')}${T('Todo revisado. No hay correos esperando.', 'All reviewed. No emails waiting.')}</p>`}</section>

        <section class="card of-dls"><h2 class="of-h2">${H.icon('doc')}${T('Enmiendas sin regresar', 'Amendments not returned')}</h2>${out.length ? out.map(a => { const c = H.client(a.clientId); return `<div class="of-dl"><span class="of-dli">${H.icon('sign')}</span><div class="of-dlm"><b>${E(tx(a.what))}</b><small><a href="#cliente-${c.id}">${E(H.name(c))}</a> · ${T('enviada hace ' + H.fmt.days(a.sentAt) + ' d', 'sent ' + H.fmt.days(a.sentAt) + ' d ago')}</small><div class="of-way"><button class="btn btn-sm" type="button" data-am="back" data-k="${a.id}">${H.icon('check')}${T('Ya regresó firmada', 'Came back signed')}</button><button class="btn btn-sm" type="button" data-am="nudge" data-k="${a.id}">${H.icon('mail')}${T('Recordar al agente', 'Remind the agent')}</button><button class="btn btn-sm btn-ghost" type="button" data-am="gone" data-k="${a.id}">${T('Ya no hace falta', 'Not needed')}</button></div></div></div>`; }).join('') : `<p class="muted of-empty">${T('Todas regresaron.', 'All came back.')}</p>`}</section></aside></div></div>`;
  const re = () => deskPage(root), find = el => desk.find(d => d.id === el.closest('[data-id]').dataset.id);
  root.oninput = e => { const t = e.target; if (t.dataset.e) { const d = find(t); d[t.dataset.e] = t.value; if (t.dataset.e === 'cc' && d.kind === 'lender') { const c = H.client(d.clientId), bad = c.email && t.value.toLowerCase().includes(c.email.toLowerCase()); const sb = t.closest('.of-dr').querySelector('[data-send]'); sb.disabled = bad; } } };
  root.onclick = e => { const b = e.target.closest('button'); if (!b || b.disabled) return; const ds = b.dataset;
    if (ds.go) { const [r, p] = ds.go.split(':'); H.go(r, p); return; }

    if ('send' in ds) { const d = find(b), c = H.client(d.clientId);
      H.undoable({ msg: T('Enviando desde closings@…', 'Sending from closings@…'), run: () => { d.status = 'sending'; openD = null; re(); }, undo: () => { d.status = 'draft'; openD = d.id; re(); },
        commit: () => { d.status = 'sent'; d.sentAt = Date.now();
          H.log(c.id, { type: 'email', teamOnly: true, text: { es: 'Correo del equipo enviado desde ' + CLOSINGS + ' a ' + d.to + ' · "' + d.subj + '" · Solo lo ve el equipo', en: 'Team email sent from ' + CLOSINGS + ' to ' + d.to + ' · "' + d.subj + '" · Team only' } });
          if (d.send === 'offer') { const o = offers.find(x => x.id === d.offerId); if (o && o.status === 'ready') { o.status = 'sent'; o.updated = Date.now(); } }

      if (ds.dl === 'snooze') return snooze(b, ms => H.undoable({ msg: T('Pospuesto', 'Snoozed'), run: () => { un = H.dlAct(k, 'later', { until: Date.now() + ms }); re(); }, undo: () => { un(); re(); } }));

    if (ds.am) { const a = amends.find(x => x.id === ds.k), c = H.client(a.clientId), l = c.deal && H.listing(c.deal.listingId);

        body: `Hi ${agentOf(l).name.split(' ')[0]},\n\nJust checking on the ${a.what.en.toLowerCase()} we sent on ${new Date(a.sentAt).toLocaleDateString('en-US')}. Could the seller sign it and send it back today?\n\nThank you,\nClosings desk · Jason Aguirre Group, eXp Realty\n${H.OFFICE}` }); openD = desk[0].id; re(); H.toast(T('Lola preparó el recordatorio. Revíselo y envíelo.', 'Lola drafted the reminder. Review and send it.')); return; }
      const st = ds.am; H.undoable({ msg: st === 'back' ? T('Enmienda firmada recibida', 'Signed amendment received') : T('Ya no sale', 'Hidden'), run: () => { a.state = st; re(); }, undo: () => { a.state = 'out'; re(); },
        commit: () => st === 'back' && H.log(c.id, { type: 'note', teamOnly: true, text: { es: a.what.es + ' regresó firmada', en: a.what.en + ' came back signed' } }) }); } };
}
const mini = (anchor, items, cb) => { document.querySelectorAll('.of-mini').forEach(x => x.remove()); const m = document.createElement('div'); m.className = 'of-mini'; m.innerHTML = items.map((it, i) => `<button type="button" data-i="${i}">${E(it[0])}</button>`).join('');

{
/* marcador: scoreboard. Owner sees the whole team; everyone else sees only "Sus números". */
const T = H.t, E = H.esc, DAY = 864e5, NOW = H.now();
const M = [
  { k: 'calls', es: 'Llamadas', en: 'Calls', ic: 'phone' },
  { k: 'talked', es: 'Hablaron', en: 'Talked', ic: 'chat' },
  { k: 'texts', es: 'Textos', en: 'Texts', ic: 'send' },
  { k: 'apps', es: 'Solicitudes', en: 'Applications', ic: 'doc' },
  { k: 'offers', es: 'Ofertas', en: 'Offers', ic: 'sign' },
  { k: 'closings', es: 'Cierres', en: 'Closings', ic: 'key' },
  { k: 'resp', es: 'Tiempo de respuesta', en: 'Response time', ic: 'clock', unit: 'min', low: true }
];
/* weekly sample base by job (what a normal week looks like for that job) */
const BASE = { screener: [85, 34, 120, 6, 0, 0, 6], specialist: [55, 24, 90, 4, 3, 1, 9], showing: [26, 14, 64, 1, 4, 1, 12], tc: [18, 12, 34, 0, 5, 2, 15], owner: [20, 12, 40, 1, 2, 2, 18] };
const hash = s => { let h = 7; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; };

/* real activity from client timelines + threads + offers, in a time window */
function real(u, from, to) {
  const r = { calls: 0, talked: 0, texts: 0, apps: 0, offers: 0, closings: 0 }, inW = t => t >= from && t < to;
  H.clients.forEach(c => {
    c.timeline.forEach(e => { if (e.by !== u.id || !inW(e.at)) return; if (e.type === 'call') { r.calls++; if (e.outcome === 'talked') r.talked++; } if (e.type === 'text') r.texts++; });
    c.thread.forEach(m => { if (m.dir === 'out' && m.by === u.id && m.ch === 'text' && inW(m.at)) r.texts++; });
    if (c.encargado === u.id && c.timeline.some(e => e.type === 'app' && inW(e.at))) r.apps++;
    if (c.stage === 'Closed' && c.deal && c.deal.closing && inW(c.deal.closing) && (c.encargado === u.id || (c.team && c.team.showing === u.id))) r.closings++;
  });
  (H.offersFor ? H.clients.flatMap(c => H.offersFor(c.id)) : []).forEach(o => { if (o.by === u.id && inW(o.created)) r.offers++; });
  return r;
}
/* stats for one person, for a period of 7 or 30 days, plus the period before it */
function stats(u, days) {
  const j = u.jobs[0], b = BASE[j] || BASE.specialist, h = hash(u.id + j), f = (i, salt) => 0.78 + ((h >> (i + salt)) % 45) / 100;
  const scale = days / 7, now = real(u, NOW - days * DAY, NOW + DAY), prev = real(u, NOW - 2 * days * DAY, NOW - days * DAY), cur = {}, last = {};
  M.forEach((m, i) => {
    const sNow = b[i] * scale * f(i, 1), sPrev = b[i] * scale * f(i, 4);
    if (m.k === 'resp') { cur.resp = Math.max(2, Math.round(b[i] * f(i, 1))); last.resp = Math.max(2, Math.round(b[i] * f(i, 4))); return; }
    cur[m.k] = Math.round(sNow) + (now[m.k] || 0); last[m.k] = Math.round(sPrev) + (prev[m.k] || 0);
  });
  cur.talked = Math.min(cur.talked, cur.calls); last.talked = Math.min(last.talked, last.calls);
  /* 7 daily call counts for the little trend */
  cur.daily = Array.from({ length: 7 }, (_, d) => Math.max(0, Math.round(cur.calls / (days) * (0.6 + ((h >> d) % 80) / 100))));
  return { cur, last };
}
const delta = (m, s) => { const a = s.cur[m.k], b = s.last[m.k]; if (!b) return a ? 100 : 0; return Math.round((a - b) / b * 100); };
const better = (m, d) => m.low ? d < 0 : d > 0;
const dChip = (m, s) => { const d = delta(m, s); if (!d) return `<span class="mk-d">= ${T('igual', 'same')}</span>`; const up = better(m, d);
  return `<span class="mk-d ${up ? 'up' : ''}" title="${T('vs. periodo anterior', 'vs. previous period')}">${d > 0 ? '▲' : '▼'} ${Math.abs(d)}%</span>`; };
const val = (m, v) => m.unit ? v + ' ' + m.unit : H.fmt.num(v);

let days = 7, metric = 'calls';
function periodSeg() { return `<div class="mk-seg" role="group" aria-label="${T('Periodo', 'Period')}">${[[7, T('Últimos 7 días', 'Last 7 days')], [30, T('Últimos 30 días', 'Last 30 days')]].map(([d, t]) => `<button type="button" data-days="${d}" aria-pressed="${days === d}">${t}</button>`).join('')}</div>`; }
const vsLabel = () => days === 7 ? T('vs. la semana pasada', 'vs. last week') : T('vs. los 30 días anteriores', 'vs. the 30 days before');

function cheer(m7, s) {
  const best = M.filter(m => !m.low).map(m => [m, delta(m, s)]).sort((a, b) => b[1] - a[1])[0];
  if (best && best[1] > 0) return T('Va ' + best[1] + '% arriba en ' + best[0].es.toLowerCase() + ' ' + vsLabel() + '. ¡Siga así!', "You're up " + best[1] + '% in ' + best[0].en.toLowerCase() + ' ' + vsLabel() + '. Keep it going!');
  return T('Semana nueva, oportunidad nueva: con 5 llamadas más hoy se pone al día.', 'New week, new chance: 5 more calls today and you are caught up.');
}

function mine(root) {
  const u = H.me(), s = stats(u, days), mx = Math.max(1, ...s.cur.daily);
  const dn = Array.from({ length: 7 }, (_, i) => new Date(NOW - (6 - i) * DAY).toLocaleDateString(H.lang === 'en' ? 'en-US' : 'es-MX', { weekday: 'short' }));
  root.innerHTML = `<div class="mk-wrap"><div class="mk-head"><div><h1 class="pg">${T('Sus números', 'Your numbers')}</h1><p class="muted">${H.avatar(u, 'sm')} ${E(u.name)} · ${E(T(H.JOBS[u.jobs[0]].es, H.JOBS[u.jobs[0]].en))}</p></div>${periodSeg()}</div>
    <p class="mk-cheer">${H.icon('trophy')}<span>${E(cheer(days, s))}</span></p>
    <div class="mk-tiles">${M.map(m => `<div class="card mk-tile"><span class="mk-tl">${H.icon(m.ic)}${T(m.es, m.en)}</span><b>${val(m, s.cur[m.k])}</b><span class="mk-tv">${dChip(m, s)}<small>${vsLabel()} (${val(m, s.last[m.k])})</small></span></div>`).join('')}</div>
    <section class="card mk-trend"><h2 class="mk-h2">${T('Sus llamadas por día', 'Your calls per day')}</h2>
      <div class="mk-cols" role="img" aria-label="${T('Llamadas por día, últimos 7 días', 'Calls per day, last 7 days')}">${s.cur.daily.map((v, i) => `<div class="mk-col" title="${E(dn[i])}: ${v}"><span class="mk-cv">${v}</span><i style="height:${Math.max(4, v / mx * 100)}%"></i><small>${E(dn[i])}</small></div>`).join('')}</div></section>
    <p class="sample">${T('Números de ejemplo mezclados con la actividad del Hub. Solo usted ve sus números; el líder del equipo ve los de todos.', 'Sample numbers mixed with Hub activity. Only you see your numbers; the team lead sees everyone\'s.')}</p></div>`;
}

function team(root) {
  const ppl = H.team.map(u => ({ u, s: stats(u, days) })), m = M.find(x => x.k === metric);
  const tot = k => ppl.reduce((n, p) => n + p.s.cur[k], 0), totL = k => ppl.reduce((n, p) => n + p.s.last[k], 0);
  const avgResp = Math.round(tot('resp') / ppl.length), avgRespL = Math.round(totL('resp') / ppl.length);
  const sorted = ppl.slice().sort((a, b) => m.low ? a.s.cur[m.k] - b.s.cur[m.k] : b.s.cur[m.k] - a.s.cur[m.k]), mx = Math.max(1, ...ppl.map(p => p.s.cur[m.k]));
  root.innerHTML = `<div class="mk-wrap"><div class="mk-head"><div><h1 class="pg">${T('Marcador del equipo', 'Team scoreboard')}</h1><p class="muted">${T('Solo usted, como líder, ve los números de todos. Cada quien ve solo los suyos.', 'Only you, as team lead, see everyone\'s numbers. Each teammate sees only their own.')}</p></div>${periodSeg()}</div>
    <div class="mk-tiles mk-tt">${M.map(mm => { const c = mm.k === 'resp' ? avgResp : tot(mm.k), l = mm.k === 'resp' ? avgRespL : totL(mm.k), d = l ? Math.round((c - l) / l * 100) : 0;
      return `<div class="card mk-tile"><span class="mk-tl">${H.icon(mm.ic)}${T(mm.es, mm.en)}${mm.k === 'resp' ? ' · ' + T('promedio', 'average') : ''}</span><b>${val(mm, c)}</b><span class="mk-tv">${d ? `<span class="mk-d ${better(mm, d) ? 'up' : ''}">${d > 0 ? '▲' : '▼'} ${Math.abs(d)}%</span>` : `<span class="mk-d">=</span>`}<small>${vsLabel()}</small></span></div>`; }).join('')}</div>
    <section class="card mk-tbl"><h2 class="mk-h2">${T('Por persona', 'By person')}</h2><div class="mk-scroll"><table><thead><tr><th>${T('Persona', 'Person')}</th>${M.map(mm => `<th>${T(mm.es, mm.en)}</th>`).join('')}</tr></thead>
      <tbody>${ppl.map(p => `<tr><th scope="row"><span class="mk-p">${H.avatar(p.u, 'sm')}<span><b>${E(p.u.name)}</b><small>${E(T(H.JOBS[p.u.jobs[0]].es, H.JOBS[p.u.jobs[0]].en))}</small></span></span></th>${M.map(mm => `<td><b>${val(mm, p.s.cur[mm.k])}</b>${dChip(mm, p.s)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <p class="sample mk-vs">▲▼ ${vsLabel()}</p></section>
    <section class="card mk-cmp"><div class="mk-ch"><h2 class="mk-h2">${T('Comparar', 'Compare')}: ${T(m.es, m.en)}${m.low ? ' <small class="muted">(' + T('menos es mejor', 'lower is better') + ')</small>' : ''}</h2>
      <div class="mk-mchips">${M.map(mm => `<button type="button" class="mk-mc" data-metric="${mm.k}" aria-pressed="${mm.k === metric}">${T(mm.es, mm.en)}</button>`).join('')}</div></div>
      <div class="mk-bars">${sorted.map(p => `<div class="mk-br" title="${E(p.u.name)}: ${val(m, p.s.cur[m.k])} (${vsLabel()}: ${val(m, p.s.last[m.k])})"><span class="mk-bn">${H.avatar(p.u, 'sm')}<span>${E(p.u.name.split(' ')[0])}</span></span><span class="mk-bt"><i style="width:${Math.max(1, p.s.cur[m.k] / mx * 100)}%"></i></span><span class="mk-bv">${val(m, p.s.cur[m.k])}</span></div>`).join('')}</div></section>
    <p class="sample">${T('Números de ejemplo mezclados con la actividad del Hub.', 'Sample numbers mixed with Hub activity.')}</p></div>`;
}

H.register('marcador', { render(root) {
  const draw = () => H.isOwner() ? team(root) : mine(root);   /* non-owners never get other people's numbers */
  draw();
  root.onclick = e => { const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.days) { days = +b.dataset.days; draw(); } else if (b.dataset.metric) { metric = b.dataset.metric; draw(); } };
} });

}
</script>
<script>{ try { window.H._boot(); } catch(e) { console.error(e); } }</script>
</body>
</html>
