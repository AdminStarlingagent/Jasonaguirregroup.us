<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAG Agent Hub v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE work tool for a non-technical real estate team: calm, dense like Follow Up Boss, never cluttered
   IDEA the team's own CRM: FUB's People page + HAR Matrix + a phone, in one workspace
   PICTURE the working list itself: pipeline rail, client rows with a "Qué hacer" line, the open profile
   COLOUR white ground, ink #17161C, team blue #2A8FD6 for action, red #C0392B only for attention, green #047857 for done
   TYPE Plus Jakarta Sans 700/800 for names and numbers, 500 for body, 13-15px dense lists
   LAYOUT computer: top bar + left icon rail + main; phone: top bar + bottom bar, lists become cards */
:root{color-scheme:light;--lola:#0F766E;--lola-t:#E3F3F1;--acc:#2A8FD6;--acc-d:#1F76B5;--acc-t:#E8F3FC;--alert:#C0392B;--alert-t:#FDECEA;--ok:#047857;--ok-t:#E8F7F0;--warn:#B7791F;--warn-t:#FDF4E3;--ink:#17161C;--body:#4B4955;--mute:#787683;--line:#E6E5EA;--line2:#F0EFF3;--canvas:#F7F7F9;--jag:#C8102E;--r:10px;--top:56px;--rail:76px;--sbx:40px}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.45 'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{font-size:16px}
@media(min-width:760px){input,select,textarea{font-size:14px}}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 50%,transparent);outline-offset:2px}
.app{display:grid;grid-template-rows:var(--sbx) var(--top) minmax(0,1fr);grid-template-columns:var(--rail) minmax(0,1fr);grid-template-areas:"sbx sbx" "top top" "rail main";height:100%}
.sbx{grid-area:sbx;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:0 14px;font-size:13px;overflow-x:auto;white-space:nowrap}
.sbx b{font-weight:700}
.sbx .dot{width:8px;height:8px;border-radius:50%;background:#34D399;flex:none}
.sbx select{background:#2A2930;color:#fff;border:1px solid #444;border-radius:8px;padding:4px 8px;font-size:13px;min-height:30px}
.sbx span.m{color:#B9B7C2}
@media(max-width:899px){.sbx span.m{display:none}.sbx label.m{display:none}.sbx select{flex:1;max-width:260px}}
.top{grid-area:top;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand i{width:30px;height:30px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;letter-spacing:.02em;border-bottom:3px solid var(--jag)}
.brand span{color:var(--mute);font-weight:600}
.gsearch{flex:1;max-width:560px;position:relative;margin-left:10px}
.gsearch input{width:100%;height:38px;border:1px solid var(--line);border-radius:999px;background:var(--canvas);padding:0 14px 0 38px}
.gsearch svg{position:absolute;left:12px;top:10px;width:18px;height:18px;color:var(--mute)}
.gsugg{position:absolute;top:44px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(23,22,28,.14);padding:6px;display:none;max-height:60vh;overflow:auto}
.gsugg.on{display:block}
.gsugg button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left;min-height:44px}
.gsugg button:hover,.gsugg button.hl{background:var(--acc-t)}
.gsugg small{color:var(--mute);display:block}
.gsugg h6{margin:6px 10px 4px;font-size:12px;color:var(--mute);font-weight:600}
.tbtn{height:38px;min-width:38px;border-radius:999px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-weight:700;font-size:13.5px;white-space:nowrap;position:relative}
.tbtn svg{width:19px;height:19px}
.top .tbtn.pri{margin-left:auto}
.tbtn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.tbtn .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--alert);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.me{width:38px;height:38px;border-radius:50%;border:0;color:#fff;font-weight:800;font-size:13px}
.rail{grid-area:rail;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch;padding:8px 6px;gap:2px}
.rail button{border:0;background:none;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;font-size:11.5px;font-weight:600;color:var(--mute);min-height:56px;position:relative}
.rail button svg{width:22px;height:22px}
.rail button:hover{background:var(--canvas);color:var(--ink)}
.rail button[aria-current=page]{background:var(--acc-t);color:var(--acc-d)}
.rail .cnt{position:absolute;top:4px;right:10px;min-width:17px;height:17px;border-radius:9px;background:var(--alert);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}
main{grid-area:main;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
.only-m{display:none}
@media(max-width:759px){
.app{grid-template-columns:minmax(0,1fr);grid-template-rows:var(--sbx) var(--top) minmax(0,1fr) 62px;grid-template-areas:"sbx" "top" "main" "rail"}
.rail{flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:0 4px;gap:0}
.rail button{flex:1;min-height:60px;padding:6px 0;font-size:11px}
.rail .cnt{right:calc(50% - 22px)}
.brand span,.tbtn .lbl,.gsearch{display:none}
.only-m{display:inline-flex}
.top{gap:8px;padding:0 10px}
.top .grow{flex:1}
}
/* menus, bell window */
.pop{position:absolute;top:calc(var(--top) - 4px);right:12px;width:min(380px,calc(100vw - 24px));background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(23,22,28,.18);z-index:60;display:none;max-height:min(560px,75vh);overflow:auto}
.pop.on{display:block}
.pop h4{margin:0;padding:14px 16px 8px;font-size:14px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.pop h4 button{border:0;background:none;color:var(--acc-d);font-weight:700;font-size:13px;min-height:36px}
.nt{display:flex;gap:10px;padding:10px 16px;border-top:1px solid var(--line2);align-items:flex-start}
.nt.unread{background:#F5FAFE}
.nt .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--canvas)}
.nt .ic svg{width:18px;height:18px}
.nt .ic.red{background:var(--alert-t);color:var(--alert)}
.nt .ic.blue{background:var(--acc-t);color:var(--acc-d)}
.nt .ic.green{background:var(--ok-t);color:var(--ok)}
.nt p{margin:0;font-size:13.5px}
.nt small{color:var(--mute);font-size:12px}
.nt .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.menu a,.menu button.mi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 16px;text-align:left;min-height:44px;font-weight:600;text-decoration:none;color:var(--ink)}
.menu .mi:hover{background:var(--canvas)}
.menu .mi svg{width:18px;height:18px;color:var(--mute)}
.menu .seg{display:flex;gap:6px;padding:4px 16px 12px}
/* shared UI */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px;white-space:nowrap;color:var(--ink);text-decoration:none}
.btn svg{width:18px;height:18px}
.btn:hover{border-color:#CFCDD6}
.btn-pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn-pri:hover{background:var(--acc-d);border-color:var(--acc-d)}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-alert{background:var(--alert);border-color:var(--alert);color:#fff}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{min-height:34px;padding:0 10px;font-size:13px;border-radius:8px}
.btn-block{width:100%}
@media(max-width:759px){.btn{min-height:44px}.btn-sm{min-height:40px}}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--canvas);color:var(--body);white-space:nowrap}
.chip.blue{background:var(--acc-t);color:var(--acc-d)}
.chip.red{background:var(--alert-t);color:var(--alert)}
.chip.green{background:var(--ok-t);color:var(--ok)}
.chip.warn{background:var(--warn-t);color:var(--warn)}
.chip.ink{background:var(--ink);color:#fff}
.ch-text{background:#E8F3FC;color:#1F76B5}
.ch-app{background:#EEE8FD;color:#5B3FC4}
.ch-lola{background:var(--lola-t);color:var(--lola)}
.chip.purple{background:#EEE8FD;color:#5B3FC4}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;flex:none}
.av.lg{width:48px;height:48px;font-size:16px}
.av.sm{width:24px;height:24px;font-size:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:700;color:var(--body)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;min-height:40px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.muted{color:var(--mute)}
.sample{font-size:12px;color:var(--mute)}
h1.pg{font-size:22px;letter-spacing:-.02em;margin:0;font-weight:800}
/* toast, sheet, drawer */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:90;background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:14px;font-size:14px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;max-width:calc(100vw - 24px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:#2F2E36;color:#9FD0F5;font-weight:800;border-radius:8px;min-height:34px;padding:0 12px}
.toast .bar{position:absolute;left:0;bottom:0;height:3px;background:#9FD0F5;border-radius:0 0 12px 12px}
@media(max-width:759px){.toast{bottom:76px}}
.scrim{position:fixed;inset:0;background:rgba(23,22,28,.4);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:71;background:#fff;left:50%;top:50%;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 48px);overflow:auto;border-radius:16px;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:.2s;padding:20px}
.sheet.on{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
.sheet.wide{width:min(860px,calc(100vw - 24px))}
.sheet h2{margin:0 0 4px;font-size:19px;letter-spacing:-.01em}
.sheet .x{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:var(--canvas);display:grid;place-items:center}
.sheet .x svg{width:18px;height:18px}
@media(max-width:759px){.sheet{left:0;right:0;top:auto;bottom:0;width:100%;max-height:92vh;border-radius:18px 18px 0 0;transform:translateY(100%)}.sheet.on{transform:none}}
.drawer{position:fixed;z-index:71;top:0;right:0;bottom:0;width:min(520px,100vw);background:#fff;transform:translateX(100%);visibility:hidden;transition:transform .24s ease;overflow:auto}
.drawer.on{transform:none;visibility:visible;box-shadow:-12px 0 40px rgba(23,22,28,.16)}
.drawer.wide{width:min(760px,100vw)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ---- calls.css ---- */
/* Calls: call bar dock, post-call sheet, composer, incoming call (cl-) */
:root{--cl-bh:0px}
body.cl-on main{padding-bottom:calc(var(--cl-bh) + 20px)}
body.cl-on .toast{bottom:calc(var(--cl-bh) + 30px)}
body.cl-on .sheet{top:calc(50% - var(--cl-bh) / 2);max-height:calc(100vh - 48px - var(--cl-bh))}
body.cl-on .drawer{bottom:calc(var(--cl-bh) + 20px)}
.cl-dock{position:fixed;z-index:72;left:calc(var(--rail) + 12px);right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;max-width:1240px;margin:0 auto;pointer-events:none}
.cl-dock>*{pointer-events:auto}
.cl-dock:empty{display:none}
.cl-bar{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 36px rgba(23,22,28,.18);padding:10px 12px 10px 14px}
.cl-who{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 250px}
.cl-cav{background:var(--acc-t);color:var(--acc-d)}
.cl-id{display:flex;flex-direction:column;min-width:0}
.cl-name{border:0;background:none;padding:0;font-weight:800;font-size:14.5px;color:var(--ink);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
button.cl-name:hover{color:var(--acc-d);text-decoration:underline}
.cl-num{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-state{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 200px}
.cl-st{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;white-space:nowrap}
.cl-st svg{width:17px;height:17px}
.cl-done{color:var(--ok)}
.cl-timer{font-variant-numeric:tabular-nums;font-weight:800}
.cl-hint{font-size:12px;color:var(--mute);line-height:1.3}
.cl-pulse{width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 0 rgba(42,143,214,.5);animation:cl-p 1.2s infinite;flex:none}
@keyframes cl-p{to{box-shadow:0 0 0 10px rgba(42,143,214,0)}}
.cl-rec{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--alert);animation:cl-blink 1.4s infinite;flex:none}
@keyframes cl-blink{50%{opacity:.35}}
.cl-live{color:var(--alert)}
.cl-live b{color:var(--ink)}
.cl-sim{font-size:11.5px;color:var(--mute)}
.cl-sim button{border:0;background:none;padding:2px 3px;color:var(--acc-d);font-weight:700;font-size:11.5px;text-decoration:underline;min-height:24px}
.cl-acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.cl-end{display:flex}
.cl-b{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:64px;min-height:50px;padding:4px 6px;border:1px solid transparent;border-radius:10px;background:none;font-size:11.5px;font-weight:700;color:var(--body)}
.cl-b svg{width:20px;height:20px}
.cl-b:hover{background:var(--canvas);border-color:var(--line)}
.cl-b.cl-onb{background:var(--acc-t);color:var(--acc-d)}
.cl-b.cl-pri{background:var(--acc);color:#fff}
.cl-b.cl-pri:hover{background:var(--acc-d)}
.cl-b.cl-hang{background:var(--ink);color:#fff;min-width:72px}
.cl-b.cl-hang:hover{background:#2F2E36}
.cl-panel{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 26px rgba(23,22,28,.14);padding:10px 12px;align-self:flex-end;width:min(420px,100%)}
.cl-panel textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;resize:vertical;min-height:58px}
.cl-nl{display:block;font-size:12.5px;font-weight:700;color:var(--body);margin-bottom:5px}
.cl-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:240px}
.cl-padv{grid-column:1/-1;text-align:center;font-weight:800;font-size:18px;letter-spacing:.12em;min-height:28px}
.cl-pad button{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--canvas);font-weight:800;font-size:17px}
.cl-later{width:auto;max-width:100%}
.cl-later b{display:block;font-size:13px;margin-bottom:6px}
.cl-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cl-grow{flex:1}
.cl-small{font-size:12px;color:var(--mute)}
/* call list strip */
.cl-list{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 26px rgba(23,22,28,.12);padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.cl-lh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cl-lh>b{display:flex;align-items:center;gap:6px;font-size:13.5px}
.cl-lh>b svg{width:16px;height:16px;color:var(--acc)}
.cl-cd{font-size:13px;color:var(--body)}
.cl-lbtns{display:flex;gap:6px;flex-wrap:wrap}
.cl-q{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.cl-qi{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--canvas);color:var(--body);white-space:nowrap;flex:none}
.cl-qi svg{width:13px;height:13px}
.cl-qcur{background:var(--acc-t);color:var(--acc-d);font-weight:800}
.cl-r-talked{background:var(--ok-t);color:var(--ok)}
/* post-call sheet */
.cl-post h2{padding-right:44px}
.cl-pmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 12px;font-size:13px;color:var(--mute)}
.cl-recd{display:inline-flex;align-items:center;gap:5px;color:var(--ink);font-weight:600}
.cl-sec{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.cl-sec h3{display:flex;align-items:center;gap:7px;margin:0 0 8px;font-size:14px;font-weight:800}
.cl-sec h3 svg{width:17px;height:17px;color:var(--acc)}
.cl-sum{background:var(--lola-t);border-color:#BFE3DE}
.cl-sum h3 svg,.cl-fu h3 svg{color:var(--lola)}
.cl-sum .cl-tx summary{color:var(--lola)}
.cl-sum p{margin:0;font-size:14px;line-height:1.5}
.cl-tx{margin-top:8px}
.cl-tx summary{cursor:pointer;font-weight:700;color:var(--acc-d);font-size:13.5px;min-height:32px;display:flex;align-items:center}
.cl-tx div{border-top:1px solid var(--line2);margin-top:6px;padding-top:6px;max-height:220px;overflow:auto}
.cl-tx p{font-size:13px;margin:4px 0}
.cl-oc{display:flex;gap:6px;flex-wrap:wrap}
.cl-oc .chip{border:1px solid var(--line);height:34px;padding:0 12px;cursor:pointer;font-size:13px}
.cl-oc .chip.blue{border-color:var(--acc)}
.cl-futxt{margin:0 0 10px;background:var(--lola-t);border:1px solid #BFE3DE;border-radius:10px;padding:10px 12px;font-size:14px}
.cl-futa{width:100%;border:1px solid var(--acc);border-radius:10px;padding:10px 12px;margin-bottom:10px;resize:vertical}
.cl-sent{display:flex;gap:6px;align-items:flex-start;margin:0;color:var(--ok);font-weight:600;font-size:13.5px}
.cl-sent svg{width:17px;height:17px;flex:none;margin-top:2px}
.cl-task{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.cl-tin{flex:1;min-width:200px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:40px;font-weight:600}
.cl-pfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.cl-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.cl-tiles div{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.cl-tiles b{display:block;font-size:26px;font-weight:800}
.cl-tiles span{font-size:12.5px;color:var(--mute);font-weight:600}
.cl-srow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line2);flex-wrap:wrap}
/* composer drawer */
.cl-cmp{padding:18px;display:flex;flex-direction:column;gap:12px}
.cl-cmph{display:flex;align-items:flex-start;gap:10px}
.cl-cmph>div{flex:1;min-width:0}
.cl-cmph h2{margin:0;font-size:18px}
.cl-x{width:40px;height:40px;border-radius:50%;border:0;background:var(--canvas);display:grid;place-items:center;flex:none}
.cl-x svg{width:18px;height:18px}
.cl-seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--canvas)}
.cl-seg button{border:0;background:none;border-radius:7px;padding:0 12px;min-height:32px;font-weight:700;font-size:13px;color:var(--body)}
.cl-seg .cl-segon{background:#fff;color:var(--acc-d);box-shadow:0 1px 2px rgba(23,22,28,.12)}
.cl-sel{border:1px solid var(--line);border-radius:9px;padding:6px 10px;min-height:38px;background:#fff;max-width:100%}
.cl-tpls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cl-tpls .chip{border:1px solid var(--line);cursor:pointer;height:30px}
.cl-tpls .chip.ch-lola{border-color:#BFE3DE}
.cl-tpls .chip svg{width:13px;height:13px}
.cl-att{cursor:pointer}
.cl-cmpf{margin-top:4px}
/* incoming call card */
.cl-in{position:fixed;z-index:80;top:calc(var(--sbx) + var(--top) + 10px);right:16px;width:min(360px,calc(100vw - 16px));background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 44px rgba(23,22,28,.22);padding:14px;display:flex;flex-direction:column;gap:10px}
.cl-inh{display:flex;gap:12px;align-items:flex-start}
.cl-inh>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cl-inh small{font-size:12px;color:var(--mute);font-weight:600}
.cl-inh b{font-size:15.5px;font-weight:800}
.cl-inh span{font-size:13px;color:var(--body)}
.cl-inic{width:44px;height:44px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none;animation:cl-p 1.2s infinite}
.cl-inic svg{width:22px;height:22px}
.cl-inic.cl-miss{background:var(--alert-t);color:var(--alert);animation:none}
.cl-red{color:var(--alert)!important}
.cl-in .cl-small{margin:0}
.cl-in .cl-small svg{width:14px;height:14px;display:inline;vertical-align:-2px}
.cl-vmt{margin:0;background:var(--canvas);border-radius:10px;padding:9px 11px;font-size:13.5px}
.cl-vmt .cl-small{display:block}
/* phones: the bar sits right above the bottom bar, full width; nothing covers the reply box */
@media (max-width:759px){
  body.cl-on main{padding-bottom:var(--cl-bh)}
  body.cl-on .toast{bottom:calc(var(--cl-bh) + 74px)}
  .cl-dock{left:0;right:0;bottom:62px;gap:0}
  .sheet.on ~ .cl-dock,.drawer.on ~ .cl-dock{bottom:0}
  body.cl-on .sheet{top:auto;bottom:var(--cl-bh);max-height:calc(92vh - var(--cl-bh))}
  body.cl-on .drawer{bottom:var(--cl-bh)}
  .cl-bar{border-radius:0;border-left:0;border-right:0;box-shadow:0 -6px 18px rgba(23,22,28,.12);padding:8px 10px 4px;gap:4px 8px;flex-wrap:wrap}
  .cl-who{flex:1 1 0;order:0}
  .cl-who .av{display:none}
  .cl-state{flex:0 1 auto;order:1;align-items:flex-end;text-align:right}
  .cl-st{font-size:13px}
  .cl-end{order:2}
  .cl-end .cl-b{min-width:60px;min-height:46px}
  .cl-hint{font-size:11px;max-width:150px;white-space:normal}
  .cl-acts{order:3;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto;justify-content:space-between;margin-left:0;scrollbar-width:none;gap:0;border-top:1px solid var(--line2);padding-top:2px}
  .cl-b{min-width:56px;min-height:48px;font-size:10.5px;flex:1 0 auto;padding:4px 2px}
  .cl-list{border-radius:0;border-left:0;border-right:0;border-bottom:0;box-shadow:none;padding:6px 10px}
  .cl-lh{gap:6px}
  .cl-lh .btn{min-height:40px}
  .cl-lh .btn-sm:not(.btn-pri) span{display:none}
  .cl-lh .btn-sm:not(.btn-pri){width:40px;padding:0}
  .cl-cd{flex:1 1 0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cl-lh .cl-grow{display:none}
  .cl-lbtns{flex-basis:100%;flex-wrap:nowrap}
  .cl-lbtns:has(> :only-child){flex-basis:auto;margin-left:auto}
  .cl-lbtns .btn-pri{flex:1}
  .cl-q{display:none}
  .cl-panel{border-radius:0;width:100%;border-left:0;border-right:0;box-shadow:none;padding:8px 10px}
  .cl-pad{width:100%}
  .cl-in{right:8px;left:8px;width:auto}
  .cl-tiles b{font-size:22px}
  /* 44 px tap targets on phones */
  .cl-b,.cl-end .cl-b{min-height:48px;min-width:56px}
  .cl-sim button{min-height:44px;min-width:44px;padding:0 6px}
  .cl-lh .btn,.cl-lh .btn-sm:not(.btn-pri){min-height:44px}
  .cl-lh .btn-sm:not(.btn-pri){width:44px}
  .cl-panel .btn,.cl-later .btn{min-height:44px}
  .cl-pad button{min-height:48px}
  button.cl-name{min-height:44px}
  .cl-oc .chip,.cl-tpls .chip{height:44px;padding:0 14px}
  .cl-row .btn,.cl-pfoot .btn,.cl-task .btn,.cl-tin{min-height:44px}
  .cl-tx summary{min-height:44px}
  .cl-seg button{min-height:44px}
  .cl-sel{min-height:44px}
}

/* ---- cliente.css ---- */
/* Client profile: FUB-like, white cards, fine borders */
.pg-cliente{padding:0 0 40px}
.cp-head{position:sticky;top:0;z-index:6;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 22px}
.cp-back{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;flex:none;color:var(--body)}
.cp-back svg{width:18px;height:18px}
.cp-av{width:42px;height:42px;border-radius:50%;background:#EEF0F4;color:var(--body);font-weight:800;font-size:15px;display:grid;place-items:center;flex:none}
.cp-av.sm{width:30px;height:30px;font-size:11px}
.cp-hn{flex:1;min-width:0}
.cp-hn h1{margin:0;font-size:20px;letter-spacing:-.015em;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-ph{color:var(--acc-d);font-weight:700;font-size:13.5px;text-decoration:none}
.cp-hb{display:flex;gap:6px;flex:none}
.cp-sq{width:40px;padding:0}
.cp-meta{padding:12px 22px 4px;display:grid;gap:8px}
.cp-nudge{margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--warn-t);color:#7A4F10;border-radius:10px;padding:8px 12px;font-weight:600;font-size:13.5px}
.cp-nudge svg{width:17px;height:17px}
.cp-mrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.cp-stage{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 8px 3px 3px;min-height:32px}
.cp-stage svg{width:14px;height:14px;color:var(--mute)}
.cp-stage:hover{border-color:var(--acc)}
.cp-mrow .chip svg{width:13px;height:13px}
.cp-tags{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center}
.cp-tx-x{border:0;background:none;padding:0;margin-left:2px;width:18px;height:18px;display:grid;place-items:center;color:inherit;opacity:.7;border-radius:50%}
.cp-tx-x:hover{opacity:1;background:rgba(0,0,0,.06)}
.cp-tx-x svg{width:12px!important;height:12px!important}
.cp-stats{margin:0;font-size:13px;color:var(--body)}
.cp-stats b{color:var(--ink)}
.cp-enc{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:13.5px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.cp-encl{font-weight:700;color:var(--body)}
.cp-sug{font-size:12px;color:var(--acc-d);font-weight:700}
.cp-team{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--mute);margin-left:auto}
.cp-team b{color:var(--body);font-weight:700}
/* grid */
.cp-grid{display:grid;gap:14px;padding:10px 22px 0;grid-template-columns:300px minmax(0,1fr) 300px;grid-template-areas:"aside main side";align-items:start}
.cp-main{grid-area:main;display:grid;gap:12px;min-width:0}
.cp-aside{grid-area:aside;display:grid;gap:12px;min-width:0}
.cp-side{grid-area:side;display:grid;gap:12px;min-width:0}
.cp-card{padding:12px 14px}
.cp-ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;min-height:28px}
.cp-ch h3,.cp-tl h3,.cp-lola h3{margin:0;font-size:13.5px;font-weight:800}
.cp-dl{margin:0;display:grid;gap:5px}
.cp-kv{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px;font-size:13px}
.cp-kv dt{color:var(--mute)}
.cp-kv dd{margin:0;font-weight:600;overflow-wrap:break-word;word-break:break-word}
.cp-kv a{color:var(--acc-d);text-decoration:none}
.cp-kv small{color:var(--mute);font-weight:500}
.cp-sm0{margin:0 0 8px;font-size:13px}
.cp-ef{display:grid;gap:8px;margin-top:6px}
.cp-err{color:var(--alert);font-size:13px;margin:0;font-weight:600}
.cp-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.cp-ck{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.cp-ck input{width:17px;height:17px;accent-color:var(--acc);flex:none}
.cp-sm{font-size:12px;color:var(--mute);gap:5px}
.cp-sm input{width:15px;height:15px}
.cp-bad{color:var(--alert)!important;font-weight:700}
.cp-hh{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line2)}
.cp-hh:first-of-type{border-top:0}
.cp-hht{flex:1;min-width:0;display:flex;flex-direction:column;font-size:13px}
.cp-hht small{color:var(--mute);font-size:12px}
.cp-scr{margin:0 0 8px;font-size:13px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cp-jl{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:2px}
.cp-js{display:flex;align-items:center;gap:9px;padding:6px 0;border-top:1px solid var(--line2)}
.cp-js:first-child{border-top:0}
.cp-jdot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.cp-js.done .cp-jdot{background:var(--ok);border-color:var(--ok);color:#fff}
.cp-jdot svg{width:13px;height:13px}
.cp-jt{flex:1;display:flex;flex-direction:column;font-size:13px}
.cp-jt small{color:var(--ok);font-weight:700;font-size:12px}
/* Lola + task */
.cp-lola{padding:12px 14px;background:var(--lola-t);border-color:color-mix(in srgb,var(--lola) 22%,#fff);border-left:3px solid var(--lola)}
.cp-lola h3{display:flex;align-items:center;gap:6px;color:var(--lola)}
.cp-lola h3 svg{width:16px;height:16px}
.cp-lola p{margin:6px 0 8px;font-size:14px;color:var(--ink)}
.cp-lf{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.cp-task{padding:10px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.cp-task.late{border-color:#F1C4BF;background:#FFFBFA}
.cp-tkh{display:flex;flex-direction:column;min-width:0;font-size:13.5px}
.cp-ql{font-size:11px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
.cp-tkh span:last-child{font-size:12.5px}
.cp-warnt{color:var(--warn)}
.cp-tka{display:flex;flex-wrap:wrap;gap:6px}
/* composer */
.cp-comp{overflow:hidden}
.cp-tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.cp-tabs button{border:0;background:none;padding:0 14px;min-height:42px;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.cp-tabs button svg{width:16px;height:16px}
.cp-tabs button.on{color:var(--acc-d);border-bottom-color:var(--acc)}
.cp-cb{padding:10px 12px 12px;display:grid;gap:8px}
.cp-ta{width:100%;min-height:84px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;resize:vertical}
.cp-in{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-height:40px}
.cp-ta:focus,.cp-in:focus{border-color:var(--acc);outline:0}
.cp-cf{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between}
.cp-grow{flex:1}
.cp-tpl{display:flex;flex-wrap:wrap;gap:6px}
.cp-tp{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;min-height:30px;color:var(--body)}
.cp-tp:hover{border-color:var(--acc);color:var(--acc-d);background:var(--acc-t)}
.cp-chl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--body)}
.cp-chb{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px;min-height:30px}
.cp-chb.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-t)}
.cp-att{position:relative;overflow:hidden;cursor:pointer}
.cp-att input{position:absolute;inset:0;opacity:0;cursor:pointer}
.cp-to{margin:0}
.cp-outs{display:flex;flex-wrap:wrap;gap:6px}
.cp-out{border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 12px;min-height:36px;font-weight:700;font-size:13px}
.cp-out.on{background:var(--acc-t);border-color:var(--acc);color:var(--acc-d)}
/* timeline */
.cp-tl{padding:12px 14px}
.cp-tlh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.cp-tlf{display:flex;flex-wrap:wrap;gap:4px}
.cp-tlf button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:0 10px;min-height:28px;font-size:12.5px;font-weight:600;color:var(--body)}
.cp-tlf button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cp-tll{list-style:none;margin:0;padding:0}
.cp-ti{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line2)}
.cp-ti:first-child{border-top:0}
.cp-tic{width:30px;height:30px;border-radius:50%;background:var(--canvas);display:grid;place-items:center;flex:none;color:var(--body)}
.cp-tic svg{width:15px;height:15px}
.cp-t-call .cp-tic{background:var(--ok-t);color:var(--ok)}
.cp-t-text .cp-tic{background:var(--acc-t);color:var(--acc-d)}
.cp-t-email .cp-tic{background:#EEE8FD;color:#5B3FC4}
.cp-t-note .cp-tic{background:var(--warn-t);color:var(--warn)}
.cp-tb{flex:1;min-width:0}
.cp-th{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}
.cp-th time{margin-left:auto;color:var(--mute);font-size:12px;white-space:nowrap}
.cp-th .chip{height:20px;font-size:11px;padding:0 7px}
.cp-dur{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--mute)}
.cp-dur svg{width:12px;height:12px}
.cp-dir{font-size:12px;color:var(--mute)}
.cp-tb p{margin:3px 0 0;font-size:13.5px;color:var(--body);overflow-wrap:anywhere}
.cp-in .cp-tb p{color:var(--ink)}
.cp-arr{color:var(--acc-d);font-weight:800}
.cp-tx{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cp-tx .chip svg{width:13px;height:13px}
.cp-trs{margin:6px 0 0;padding:8px 10px;background:var(--canvas);border-radius:8px;font-size:13px;color:var(--body)}
.cp-empty{margin:8px 0;font-size:13px}
/* side cards */
.cp-ph2{border-radius:9px;overflow:hidden;aspect-ratio:16/9;background:var(--canvas);margin-bottom:8px}
.cp-ph2 img{width:100%;height:100%;object-fit:cover}
.cp-addr{margin:0 0 8px;font-size:13px}
.cp-ofl{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.cp-ofl button{width:100%;display:flex;justify-content:space-between;gap:6px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;font-size:12.5px;text-align:left;min-height:36px}
.cp-apps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cp-apps span{display:flex;flex-direction:column;font-size:11.5px;color:var(--mute);background:var(--canvas);border-radius:8px;padding:7px 8px}
.cp-apps b{font-size:14px;color:var(--ink)}
.cp-fold{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;padding:6px 0;text-align:left;min-height:40px}
.cp-fold+.cp-fold,.cp-docs+.cp-fold{border-top:1px solid var(--line2)}
.cp-fold>span{display:flex;flex-direction:column;font-size:13px;flex:none}
.cp-fold small{color:var(--mute);font-size:12px}
.cp-fold>svg{width:16px;height:16px;color:var(--mute);flex:none}
.cp-bar{flex:1;height:6px;border-radius:3px;background:var(--line2);overflow:hidden;display:block}
.cp-bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.cp-docs{list-style:none;margin:2px 0 6px;padding:0;display:grid;gap:3px}
.cp-docs li{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--body)}
.cp-docs li svg{width:15px;height:15px;color:var(--mute);flex:none}
.cp-docs li.ok svg{color:var(--ok)}
.cp-lend{margin-top:8px;padding-top:8px;border-top:1px solid var(--line2)}
.cp-tools{display:flex;flex-wrap:wrap;gap:8px}
.cp-tools .btn{flex:1 1 auto}
.cp-nf{margin:40px auto;max-width:420px;padding:30px;text-align:center;display:grid;gap:10px;justify-items:center}
.cp-nf svg{width:32px;height:32px;color:var(--mute)}
/* picker + screening sheet */
.cp-sp{margin:0 0 12px}
.cp-h6{margin:12px 0 6px;font-size:12px;color:var(--mute);font-weight:700}
.cp-pk{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;margin-bottom:6px;text-align:left;min-height:48px}
.cp-pk:hover{border-color:var(--acc);background:#F7FAFD}
.cp-pkt{flex:1;display:flex;flex-direction:column;font-size:13.5px}
.cp-pk small{color:var(--mute);font-size:12px}
.cp-pk.cur{background:var(--canvas)}
.cp-pk em{font-style:normal}
.cp-sc{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
.cp-scf{display:grid;gap:10px}
.cp-fs{border:1px solid var(--line);border-radius:10px;padding:8px 12px 12px;margin:0;display:grid;gap:8px}
.cp-fs legend{font-size:12.5px;font-weight:700;color:var(--body);padding:0 4px}
.cp-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cp-seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;justify-self:start}
.cp-seg button{border:0;background:#fff;padding:0 14px;min-height:36px;font-weight:700;font-size:13px;color:var(--body)}
.cp-seg button.on{background:var(--acc);color:#fff}
.cp-scv{position:sticky;top:0;background:var(--canvas);border-radius:12px;padding:14px;display:grid;gap:8px}
.cp-vl{font-size:11px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
.cp-vchip{height:32px;font-size:15px;padding:0 14px;justify-self:start}
.cp-vdl{margin:0;display:grid;gap:6px}
.cp-vdl dt{font-size:12px;color:var(--mute)}
.cp-vdl dd{margin:0 0 2px;font-weight:800;font-size:15px;display:flex;flex-direction:column}
.cp-vdl small{font-weight:500;font-size:12px;color:var(--mute)}
.cp-vwhy{margin:0;font-size:13.5px;color:var(--ink)}
.cp-ntf{margin:14px 0 2px}
.cp-ask{background:var(--canvas);border-radius:12px;padding:12px 14px;margin-top:12px}
.cp-ask p{margin:0}
/* two columns: aside + side stacked on the left */
@media(max-width:1279px){.cp-grid{grid-template-columns:290px minmax(0,1fr);grid-template-areas:"aside main" "side main";grid-template-rows:auto 1fr}}
/* one column (tablet portrait, phones): work first, then details */
@media(max-width:1023px){
.cp-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"main" "side" "aside";grid-template-rows:none}
.cp-aside,.cp-side{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:start}
.cp-team{margin-left:0;flex-basis:100%}
}
@media(max-width:759px){
.cp-head{padding:8px 12px;gap:8px}
.cp-back{display:none}
.cp-av{width:36px;height:36px;font-size:13px}
.cp-hn h1{font-size:16.5px}
.cp-hide-s{display:none}

/* ---- marcador.css ---- */
.pg-marcador{min-height:100%;background:var(--canvas)}
.mk-wrap{padding:20px 24px 40px;max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.mk-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.mk-head p{margin:4px 0 0;display:flex;align-items:center;gap:6px;font-size:13.5px}
.mk-seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;background:#fff;padding:3px;gap:2px}

.mk-seg button[aria-pressed=true]{background:var(--acc);color:#fff}
.mk-cheer{display:flex;gap:10px;align-items:center;margin:0;background:var(--acc-t);color:#1B4F78;border-radius:12px;padding:12px 14px;font-weight:700}

.mk-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.mk-tile{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.mk-tl{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--mute)}
.mk-tl svg{width:15px;height:15px}
.mk-tile>b{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.mk-tv{display:flex;flex-direction:column;gap:1px}
.mk-tv small{font-size:11.5px;color:var(--mute)}
.mk-d{font-size:12px;font-weight:800;color:var(--mute);white-space:nowrap}
.mk-d.up{color:var(--ok)}
.mk-h2{font-size:15px;font-weight:800;margin:0}
.mk-trend,.mk-tbl,.mk-cmp{padding:14px 16px}
.mk-cols{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;height:180px;margin-top:12px;align-items:end}
.mk-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.mk-col i{display:block;width:min(42px,70%);background:var(--acc);border-radius:4px 4px 0 0}
.mk-col:hover i{background:var(--acc-d)}
.mk-cv{font-size:12px;font-weight:700;color:var(--body)}
.mk-col small{font-size:11.5px;color:var(--mute);text-transform:capitalize}
.mk-scroll{overflow-x:auto;margin-top:10px}
.mk-tbl table{width:100%;border-collapse:collapse;font-size:13px;min-width:860px}
.mk-tbl th,.mk-tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap}
.mk-tbl thead th{font-size:12px;color:var(--mute);font-weight:700;background:#FCFCFD;border-bottom:1px solid var(--line)}
.mk-tbl td b{display:block;font-size:14.5px}
.mk-tbl tbody tr:hover{background:#F8FBFE}
.mk-p{display:flex;align-items:center;gap:8px}
.mk-p>span:last-child{display:flex;flex-direction:column}
.mk-p small{color:var(--mute);font-weight:500;font-size:11.5px}
.mk-vs{margin:8px 0 0}
.mk-ch{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.mk-mchips{display:flex;gap:6px;flex-wrap:wrap}
.mk-mc{border:1px solid var(--line);background:#fff;border-radius:999px;min-height:32px;padding:0 11px;font-size:12.5px;font-weight:600;color:var(--body)}
.mk-mc[aria-pressed=true]{border-color:var(--acc);background:var(--acc-t);color:var(--acc-d)}
.mk-bars{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.mk-br{display:grid;grid-template-columns:130px minmax(0,1fr) 70px;gap:10px;align-items:center;min-height:30px}
.mk-bn{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.mk-bt{height:14px;background:var(--line2);border-radius:4px;overflow:hidden}
.mk-bt i{display:block;height:100%;background:var(--acc);border-radius:0 4px 4px 0}
.mk-br:hover .mk-bt i{background:var(--acc-d)}
.mk-bv{font-weight:800;font-size:13px;text-align:right}
@media(max-width:759px){

.mk-head{flex-direction:column}
.mk-seg{width:100%}.mk-seg button{flex:1;min-height:40px}
.mk-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}

.mk-mchips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;width:100%}.mk-mc{flex:none;min-height:40px}
