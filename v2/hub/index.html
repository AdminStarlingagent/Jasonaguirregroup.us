V2.icon = (name, cls='') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[name]||''}</svg>`;

/* ---------- generated home photos (no remote images allowed in the sandbox) ---------- */
const PAL = {
  siding:['#EFE7DA','#DCCDB8','#D4DBE0','#E8DCCB','#C9D1C3','#F2EEE8','#CBB89D'],
  brick:['#A85B45','#B9765C','#8E4E3E','#C4A08A'],
  roof:['#3D3A40','#5A5048','#2F3437','#6B5B4E'],
  door:['#C8102E','#1F3A5F','#2E5E4E','#17161C','#7A4E2D'],
  wall:['#F3EFE8','#ECE6DD','#E6ECEF','#F1ECE4','#E9EFE7'],
  cab:['#FFFFFF','#2F3A45','#D9CFC1','#5E6B5A','#F4F1EA']
};
const rng = seed => { let s = (seed*9301 + 49297) % 233280 || 7; return () => (s = s*16807 % 2147483647) / 2147483647; };
const pick = (r, a) => a[Math.floor(r()*a.length)];
function front(r, dusk){
  const sky = dusk ? ['#F6B48F','#7D6A9E'] : ['#BFE0F5','#EAF5FC'];
  const sid = r()<.45 ? pick(r,PAL.brick) : pick(r,PAL.siding), roof = pick(r,PAL.roof), door = pick(r,PAL.door);
  const two = r()<.45, w = two?230:260, x = 200 - w/2 + (r()*30-15), base = 232, h = two?130:86, top = base-h;
  const win = dusk ? '#FFD98A' : '#9FC3D9', lawn = dusk ? '#5E7A4A' : '#7DAA55';
  let s = `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[1]}"/><stop offset="1" stop-color="${sky[0]}"/></linearGradient></defs>`;
  s += `<rect width="400" height="300" fill="url(#g)"/>`;
  if (dusk) s += `<circle cx="${60+r()*60}" cy="70" r="26" fill="#FFE2B8" opacity=".8"/>`;
  s += `<ellipse cx="80" cy="236" rx="140" ry="40" fill="${dusk?'#4E6A3E':'#6E9A4C'}"/><ellipse cx="340" cy="240" rx="150" ry="44" fill="${dusk?'#4E6A3E':'#6E9A4C'}"/>`;
  s += `<rect y="228" width="400" height="72" fill="${lawn}"/>`;
  s += `<path d="M${x+w*.62} 300 L${x+w*.7} ${base} L${x+w*.98} ${base} L${x+w*1.12} 300z" fill="${dusk?'#9A9590':'#CFCBC4'}"/>`;
  s += `<rect x="${x}" y="${top}" width="${w}" height="${h}" fill="${sid}"/>`;
  s += `<rect x="${x}" y="${top}" width="${w}" height="${h}" fill="#000" opacity=".06" clip-path="inset(0 0 0 70%)"/>`;
  s += `<path d="M${x-14} ${top+4} L${x+w*.5} ${top-62-(two?0:6)} L${x+w+14} ${top+4}z" fill="${roof}"/>`;
  s += `<path d="M${x+w*.5} ${top-62} L${x+w+14} ${top+4} L${x+w*.5} ${top+4}z" fill="#000" opacity=".12"/>`;
  s += `<rect x="${x+w*.62}" y="${base-56}" width="${w*.34}" height="56" fill="#ECE8E2" stroke="#BDB6AC"/>`;
  for (let i=1;i<4;i++) s += `<line x1="${x+w*.62}" y1="${base-56+i*14}" x2="${x+w*.96}" y2="${base-56+i*14}" stroke="#CFC8BE"/>`;
  s += `<rect x="${x+w*.38}" y="${base-50}" width="24" height="50" fill="${door}"/><circle cx="${x+w*.38+18}" cy="${base-24}" r="2" fill="#E7C66B"/>`;
  s += `<rect x="${x+w*.08}" y="${base-56}" width="${w*.22}" height="34" fill="${win}" stroke="#fff" stroke-width="4"/>`;
  if (two){ [0.1,0.42,0.72].forEach(f=>{ s += `<rect x="${x+w*f}" y="${top+16}" width="${w*.18}" height="30" fill="${win}" stroke="#fff" stroke-width="4"/>`; }); }
  const tx = r()<.5 ? 40+r()*30 : 330+r()*30;
  s += `<rect x="${tx-4}" y="190" width="8" height="46" fill="#6B4F3A"/><circle cx="${tx}" cy="176" r="${30+r()*10}" fill="${dusk?'#3F5E36':'#4F8A3C'}"/><circle cx="${tx+14}" cy="168" r="18" fill="${dusk?'#4B6E40':'#62A04B'}"/>`;
  s += `<ellipse cx="${x+w*.2}" cy="${base+4}" rx="40" ry="10" fill="${dusk?'#3E5A34':'#5C8F43'}"/>`;

function kitchen(r){
  const wall = pick(r,PAL.wall), cab = pick(r,PAL.cab), dark = cab==='#2F3A45'||cab==='#5E6B5A';
  let s = `<rect width="400" height="300" fill="${wall}"/><rect y="230" width="400" height="70" fill="#C9B9A3"/>`;

  s += `<rect x="30" y="110" width="340" height="44" fill="#F7F5F1"/>`;
  for (let i=0;i<10;i++) s += `<line x1="${30+i*34}" y1="110" x2="${30+i*34}" y2="154" stroke="#E6E1D8"/>`;
  s += `<rect x="20" y="154" width="360" height="12" fill="#E9E4DC"/><rect x="30" y="166" width="340" height="64" fill="${cab}"/>`;
  s += `<rect x="90" y="196" width="220" height="10" fill="#DAD3C8"/><rect x="100" y="206" width="200" height="60" fill="${dark?'#FFFFFF':'#2F3A45'}" opacity=".92"/>`;
  [140,200,260].forEach(cx => s += `<line x1="${cx}" y1="0" x2="${cx}" y2="${126}" stroke="#2A2A2A"/><path d="M${cx-14} 138 h28 l-6 -12 h-16z" fill="#E7C66B"/>`);
  return s;

function living(r){
  const wall = pick(r,PAL.wall), sofa = pick(r,['#5A6B7A','#B9A58C','#7A8B6F','#C2A189','#3F4B5A']);
  let s = `<rect width="400" height="300" fill="${wall}"/><rect y="226" width="400" height="74" fill="#B7926C"/>`;
  for (let i=0;i<8;i++) s += `<line x1="${i*52}" y1="226" x2="${i*52-20}" y2="300" stroke="#A6825D"/>`;
  s += `<rect x="236" y="40" width="130" height="150" fill="#CFE6F3" stroke="#fff" stroke-width="8"/><line x1="301" y1="40" x2="301" y2="190" stroke="#fff" stroke-width="5"/>`;
  s += `<ellipse cx="170" cy="262" rx="130" ry="18" fill="#E9E1D3"/>`;
  s += `<rect x="50" y="160" width="230" height="62" rx="14" fill="${sofa}"/><rect x="60" y="134" width="210" height="44" rx="12" fill="${sofa}"/><rect x="60" y="134" width="210" height="44" rx="12" fill="#fff" opacity=".1"/>`;
  s += `<rect x="40" y="152" width="26" height="70" rx="10" fill="${sofa}"/><rect x="264" y="152" width="26" height="70" rx="10" fill="${sofa}"/>`;
  s += `<rect x="96" y="146" width="40" height="30" rx="8" fill="#F2D6A2"/><rect x="190" y="146" width="40" height="30" rx="8" fill="#E9B8A6"/>`;
  s += `<rect x="330" y="150" width="6" height="76" fill="#6B4F3A"/><circle cx="333" cy="140" r="24" fill="#5E9A4B"/>`;
  return s;
}
function yard(r){
  let s = `<rect width="400" height="300" fill="#CFE7F6"/><rect y="150" width="400" height="150" fill="#7DAA55"/>`;

/* ---------- client changes: every change is logged ---------- */
H.log = (id, ev) => { const c = H.client(id); if (!c) return; const e = { at: Date.now(), by: H.me().id, ...ev }; c.timeline.unshift(e); H.emit('client', c); return e; };
H.updateContact = (id, patch) => { const c = H.client(id); if (!c) return; const changes = [];
  const LBL = { first:['nombre','first name'], last:['apellido','last name'], phone:['teléfono','phone'], email:['correo','email'] }, es = [], en = [];
  ['first','last','phone','email'].forEach(k => { if (patch[k] != null && patch[k] !== c[k]){ const v = `${c[k] || '—'} → ${patch[k]}`; es.push(LBL[k][0] + ': ' + v); en.push(LBL[k][1] + ': ' + v); changes.push(k); c[k] = patch[k]; } });
  if (changes.length){ c.nameless = !(c.first || c.last); H.log(id, { type:'edit', text:{ es:'Corrigió contacto · ' + es.join(' · '), en:'Corrected contact · ' + en.join(' · ') } }); }
  return changes.length;
};
H.setEncargado = (id, uid) => { const c = H.client(id); if (!c) return; const prev = c.encargado; c.encargado = uid || null;
  H.log(id, { type:'edit', text:{ es:'Encargado (solo en el Hub): ' + (H.user(prev)?.name || 'Nadie') + ' → ' + (H.user(uid)?.name || 'Nadie'), en:'In charge (Hub only): ' + (H.user(prev)?.name || 'Nobody') + ' → ' + (H.user(uid)?.name || 'Nobody') } }); return prev; };
H.setStage = (id, stage) => { const c = H.client(id); if (!c || c.stage === stage) return; const prev = c.stage; c.stage = stage;
  H.log(id, { type:'stage', text:{ es:'Etapa: ' + prev + ' → ' + stage, en:'Stage: ' + prev + ' → ' + stage } });
  if (prev === 'Under Contract' && stage !== 'Closed') H.notify({ kind:'alert', icon:'flag', client:id, text:{es:H.name(c) + ' salió de Under Contract (¿se cayó el contrato?). Aviso al líder y al TC.', en:H.name(c) + ' moved back out of Under Contract (contract fell through?). Owner and TC notified.'} });
  return prev; };
H.touch = id => { const c = H.client(id); if (c){ c.lastContact = Date.now(); H.emit('client', c); } };
/* journey steps the client sees in their app tracker; notice defaults: Applied + Approved on, Screened off */
H.JOURNEY = [ {k:'screened', es:'Evaluado por teléfono', en:'Screened by phone', notify:false}, {k:'applied', es:'Solicitud recibida', en:'Application received', notify:true}, {k:'approved', es:'Pre-aprobado', en:'Pre-approved', notify:true}, {k:'touring', es:'Viendo casas', en:'Touring homes', notify:false} ];
H.journey = (id, k, notify) => { const c = H.client(id); const j = H.JOURNEY.find(x => x.k === k); if (!c || !j) return;
  c.journey = c.journey || {}; c.journey[k] = Date.now(); if (k === 'approved') c.preApproved = true;
  H.log(id, { type:'journey', text:{ es:'Avance del cliente: ' + j.es + (notify ? ' · el cliente recibió un aviso en su app' : ' · sin aviso al cliente'), en:'Client progress: ' + j.en + (notify ? ' · client notified in their app' : ' · client not notified') } }); };
H.needsFollowUp = c => !c.noCalifica && !['Closed','Nurture'].includes(c.stage) && (NOW - c.lastContact) > (c.stage === 'Hot Prospect' ? 7 : 3) * DAY;
H.whatToDo = c => c.task ? H.t(c.task.text.es, c.task.text.en) : H.t('Sin próximo paso: decida uno','No next step: pick one');
/* new contact: nobody in charge until picked by hand */
H.addContact = ({first='', last='', phone='', email='', note=''}) => {
  const id = Math.max(...H.clients.map(c => c.id)) + 1;
  const c = { id, first, last, phone, email, lang:'es', stage:'New Lead', encargado:null, team:{screener:null,specialist:null,showing:null}, source:H.t('Agregado a mano','Added by hand'), created:Date.now(), lastContact:Date.now(), tags:[], noCalifica:null, region:'houston', areas:[], budget:0, incomeMonthly:0, debtsMonthly:0, coBorrower:null, docType:null, preApproved:false, lender:null, app:{score:0,views:0,saves:0,lastSeen:0,account:false}, timeline:[], thread:[], task:{type:'call', text:{es:'Primera llamada',en:'First call'}, due:Date.now() + 4*36e5, by:null}, deal:null, household:[] };
  H.armTask(c); H.clients.unshift(c); H.log(id, { type:'created', text:{ es:'Contacto agregado a mano por ' + H.me().name + (note ? ' · ' + note : ''), en:'Contact added by hand by ' + H.me().name + (note ? ' · ' + note : '') } }); return c;
};

/* ---------- tiny event bus ---------- */
const subs = {};
H.on = (ev, fn) => (subs[ev] = subs[ev] || []).push(fn);
H.emit = (ev, d) => (subs[ev]||[]).forEach(fn => { try{ fn(d) }catch(e){ console.error(e) } });

/* ---------- toast with undo (default 5 s) ---------- */
const $ = id => document.getElementById(id);
let tTimer, pendingExpire = null;
H.toast = (msg, action, ms) => {
  /* a new toast must never swallow a pending "send after Undo": commit the previous one first */
  if (pendingExpire){ const f = pendingExpire; pendingExpire = null; clearTimeout(tTimer); try{ f() }catch(e){ console.error(e) } }
  const t = $('toast'); $('toastTxt').textContent = msg; const b = $('toastBtn'), bar = $('toastBar');
  ms = ms || (action ? 5000 : 2600); b.style.display = action ? '' : 'none';
  if (action){ b.textContent = action.label || H.t('Deshacer','Undo'); b.onclick = () => { clearTimeout(tTimer); pendingExpire = null; t.classList.remove('on'); action.fn(); }; }
  bar.style.transition = 'none'; bar.style.width = action ? '100%' : '0';
  requestAnimationFrame(() => { requestAnimationFrame(() => { if (action){ bar.style.transition = `width ${ms}ms linear`; bar.style.width = '0'; } }); });
  pendingExpire = action && action.onExpire ? action.onExpire : null;
  t.classList.add('on'); clearTimeout(tTimer); tTimer = setTimeout(() => { t.classList.remove('on'); const f = pendingExpire; pendingExpire = null; f && f(); }, ms);
};
/* do something now, with Undo for 5 s; commit runs only if not undone (for "send" actions) */
H.undoable = ({ msg, run, undo, commit, ms = 5000 }) => { let undone = false; run && run();
  H.toast(msg, { label:H.t('Deshacer','Undo'), fn: () => { undone = true; undo && undo(); }, onExpire: () => { if (!undone) commit && commit(); } }, ms); };

H.drawer = (html, o={}) => { const d = $('drawer'); d.className = 'drawer' + (o.wide ? ' wide' : ''); d.innerHTML = html;

function sugg(q){
  q = (q||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  let list, head;
  if (!q){ list = recent().map(H.client).filter(Boolean); head = H.t('Recientes','Recent'); }
  else { const digits = q.replace(/\D/g,''); list = H.clients.filter(c => norm(H.name(c)).includes(q) || norm(c.email).includes(q) || (digits.length >= 3 && c.phone.replace(/\D/g,'').includes(digits))).slice(0, 8); head = H.t('Clientes','Clients'); }
  $('gsugg').innerHTML = (list.length ? `<h6>${head}</h6>` + list.map((c,i) => `<button type="button" role="option" data-sopen="${c.id}" class="${i?'':'hl'}">${H.avatar(H.user(c.encargado),'sm')}<span style="flex:1;min-width:0"><b>${H.esc(H.name(c))}</b><small>${H.esc(c.phone)} · ${H.esc(c.stage)}</small></span></button>`).join('') : (q ? `<p class="muted" style="padding:8px 10px;margin:0">${H.t('Nadie con ese nombre o número.','Nobody with that name or number.')}</p>` : '')) +
    `<button type="button" data-snew>${H.icon('plus')}<span><b>${H.t('Contacto nuevo','New contact')}</b><small>${q ? H.esc(H.t('Agregar "' + q + '"','Add "' + q + '"')) : H.t('Nombre, teléfono y correo','Name, phone and email')}</small></span></button>`;
  $('gsugg').classList.add('on');
}

H.newContact = (prefill='') => {
  const isPhone = /\d{3}/.test(prefill), parts = isPhone ? ['',''] : prefill.trim().split(/\s+/);
  H.sheet(`<h2>${H.t('Contacto nuevo','New contact')}</h2><p class="muted" style="margin:0 0 14px">${H.t('Queda sin encargado hasta que alguien lo asigne.','Nobody is in charge until someone assigns it.')}</p>

      <div class="field"><label for="ncL">${H.t('Apellido','Last name')}</label><input id="ncL" value="${H.esc(parts.slice(1).join(' '))}" autocomplete="off"></div>
      <div class="field"><label for="ncP">${H.t('Teléfono','Phone')}</label><input id="ncP" inputmode="tel" value="${H.esc(isPhone?prefill:'')}"></div>
      <div class="field"><label for="ncE">${H.t('Correo (opcional)','Email (optional)')}</label><input id="ncE" type="email"></div>
    </div>
    <div class="field" style="margin:10px 0 16px"><label for="ncN">${H.t('Nota (opcional)','Note (optional)')}</label><textarea id="ncN" style="min-height:64px"></textarea></div>
    <p id="ncErr" style="color:var(--alert);margin:0 0 10px;display:none"></p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-pri" type="button" id="ncSave">${H.t('Guardar y abrir perfil','Save and open profile')}</button><button class="btn" type="button" id="ncCall">${H.icon('phone')}${H.t('Guardar y llamar','Save and call')}</button></div>`);
  const save = then => { const f = $('ncF').value.trim(), p = $('ncP').value.trim();
    if (!f && !p){ $('ncErr').textContent = H.t('Escriba al menos un nombre o un teléfono.','Enter at least a name or a phone.'); $('ncErr').style.display='block'; return; }
    if (p && p.replace(/\D/g,'').length !== 10){ $('ncErr').textContent = H.t('El teléfono debe tener 10 números.','Phone must have 10 digits.'); $('ncErr').style.display='block'; return; }
    const d = p.replace(/\D/g,''), phone = d ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : '';
    const dup = phone && H.clients.find(c => c.phone === phone);
    if (dup){ $('ncErr').innerHTML = H.esc(H.t('Ya existe: ','Already exists: ') + H.name(dup)) + ` <button class="btn btn-sm" type="button" id="ncDup">${H.t('Abrir','Open')}</button>`; $('ncErr').style.display='block'; $('ncDup').onclick = () => { H.close(); H.openClient(dup.id); }; return; }
    const c = H.addContact({ first:f, last:$('ncL').value.trim(), phone, email:$('ncE').value.trim(), note:$('ncN').value.trim() }); H.close(); H.toast(H.t('Contacto guardado','Contact saved')); H.openClient(c.id); if (then === 'call' && H.call) setTimeout(() => H.call(c.id), 300); };
  $('ncSave').onclick = () => save(); $('ncCall').onclick = () => save('call'); setTimeout(() => $('ncF').focus(), 60);
};

H.register = (name, mod) => { modules[name] = mod; };
const NAV = {
  midia:{icon:'users', es:'Mi Día', en:'Mi Día'}, mensajes:{icon:'inbox', es:'Mensajes', en:'Messages'}, matrix:{icon:'grid', es:'Matrix', en:'Matrix'},
  ofertas:{icon:'sign', es:'Ofertas', en:'Offers'}, cierres:{icon:'key', es:'Cierres', en:'Closings', route:'ofertas', param:'cierres'}, marcador:{icon:'trophy', es:'Marcador', en:'Scoreboard'}
};
H.navFor = (u = H.me()) => u.jobs.includes('owner') ? ['midia','mensajes','matrix','ofertas','marcador'] : u.jobs.includes('tc') ? ['midia','cierres','ofertas','mensajes','marcador'] : u.jobs.includes('showing') ? ['midia','mensajes','matrix','ofertas','marcador'] : u.jobs.includes('screener') ? ['midia','mensajes','matrix','marcador'] : ['midia','mensajes','matrix','ofertas','marcador'];
let current = null, cleanup = null;
H.route = () => current;
H.go = (r, p) => { const h = r + (p != null && p !== '' ? '-' + p : ''); if (location.hash.slice(1) === h) render(); else location.hash = h; };
H.back = () => { if (history.length > 1) history.back(); else H.go('midia'); };
function parse(){ const m = location.hash.slice(1).match(/^([a-z]+)(?:-(.+))?$/); return m && modules[m[1]] ? {r:m[1], p:m[2] ? decodeURIComponent(m[2]) : null} : {r:'midia', p:null}; }
H.unreadCount = () => H.clients.reduce((n, c) => n + c.thread.filter(m => m.unread).length, 0);
function renderRail(active){
  $('rail').innerHTML = H.navFor().map(k => { const n = NAV[k], r = n.route || k, cur = (k === 'cierres' && current && current.r === 'ofertas' && current.p === 'cierres') || (k === 'ofertas' && active === 'ofertas' && !(current && current.p === 'cierres')) || (k !== 'ofertas' && k !== 'cierres' && k === active);
    const cnt = k === 'mensajes' ? H.unreadCount() : 0;
    return `<button type="button" data-nav="${r}${n.param ? ':' + n.param : ''}" ${cur ? 'aria-current="page"' : ''}>${H.icon(n.icon)}<span>${H.t(n.es, n.en)}</span>${cnt ? `<i class="cnt">${cnt}</i>` : ''}</button>`; }).join('');
}
$('rail').addEventListener('click', e => { const b = e.target.closest('[data-nav]'); if (!b) return; const [r,p] = b.dataset.nav.split(':'); H.go(r, p); });
function render(){
  const {r, p} = parse(); const mod = modules[r]; const main = $('main');
  if (cleanup){ try{ cleanup() }catch(e){} cleanup = null; }
  current = {r, p}; main.scrollTop = 0; main.innerHTML = '';
  const host = document.createElement('div'); host.className = 'pg pg-' + r; main.appendChild(host);
  if (!mod) host.innerHTML = `<p class="muted" style="padding:40px 24px">${H.t('Pantalla en construcción','Screen being built')}</p>`;
  else { try { const c = mod.render(host, p); if (typeof c === 'function') cleanup = c; } catch(e){ console.error(e); host.innerHTML = `<p style="padding:40px 24px;color:var(--alert)">Error: ${H.esc(e.message)}</p>`; } }
  renderRail(r === 'cliente' ? 'midia' : r); H.emit('route', current);
}
H.rerender = render;
H.on('client', () => renderRail(current && current.r === 'cliente' ? 'midia' : current && current.r));
window.addEventListener('hashchange', () => { H.close(); closePops(); render(); });

/* ---------- user switch (sandbox) + language per user ---------- */
function applyUser(){
  H.lang = langOf(); document.documentElement.lang = H.lang;
  $('gq').placeholder = H.t('Buscar por nombre, teléfono o correo','Search by name, phone or email');
  $('newContact').innerHTML = H.icon('plus') + `<span class="lbl">${H.t('Contacto nuevo','New contact')}</span>`; $('newContact').setAttribute('aria-label', H.t('Contacto nuevo','New contact'));
  $('mSearch').innerHTML = H.icon('search');
  $('sbxUser').innerHTML = H.team.map(u => `<option value="${u.id}" ${u.id===meId?'selected':''}>${u.name} · ${H.JOBS[u.jobs[0]][H.lang]}</option>`).join('');
  renderMe(); renderBell(); render();
}
H.setUser = id => { meId = id; LS.set('me', id); applyUser(); };
$('sbxUser').addEventListener('change', e => H.setUser(e.target.value));
H._boot = applyUser;
}
</script>
<script>/* ---- midia.js ---- */
{
/* Mi Día: Follow Up Boss–style People page (pipeline rail + list), plus the shared "way out" helpers
   (Otra hora / Ya no hace falta with Undo) that the client profile also uses. Prefix: md- */
const T = H.t, E = H.esc, DAYMS = 864e5;
const isPhone = () => matchMedia('(max-width:759px)').matches;
const isCards = () => matchMedia('(max-width:1023px)').matches;

/* ---------- small shared helpers (also used by the cliente module) ---------- */
H.mdAgo = ts => { if (!ts) return '—'; const s = H.fmt.ago(ts); if (s === T('ahora','now') || s === T('ayer','yesterday')) return s; return T('hace ' + s, s + ' ago'); };
H.mdWhen = ts => { const d = new Date(ts), n = new Date(); const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(d) - day(n)) / DAYMS);
  if (diff === 0) return T('hoy ', 'today ') + H.fmt.time(ts);
  if (diff === 1) return T('mañana ', 'tomorrow ') + H.fmt.time(ts);
  return H.fmt.dateLong(ts) + ' ' + H.fmt.time(ts); };
/* due line: "vence hoy", "atrasado 2 días" (late = red), "en 3 días" */
H.mdDue = ts => { if (!ts) return { txt:'', late:false }; const now = Date.now();
  const day = x => { const d = new Date(x); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); };
  const diff = Math.round((day(ts) - day(now)) / DAYMS);
  if (ts < now && diff < 0) { const n = -diff; return { txt: n === 1 ? T('atrasado 1 día','1 day late') : T('atrasado ' + n + ' días', n + ' days late'), late:true }; }
  if (diff <= 0) return { txt: ts < now ? T('vence hoy','due today') : T('hoy ','today ') + H.fmt.time(ts), late: ts < now };
  if (diff === 1) return { txt: T('mañana','tomorrow'), late:false };
  return { txt: T('en ' + diff + ' días','in ' + diff + ' days'), late:false }; };

/* popover menu anchored to a button (fixed, clamped to the screen) */
let popEl = null;
const popClose = () => { if (popEl){ popEl.remove(); popEl = null; document.removeEventListener('pointerdown', popOutside, true); } };
const popOutside = e => { if (popEl && !popEl.contains(e.target)) popClose(); };
H.mdPopClose = popClose;
H.mdPop = (anchor, html, onPick) => {
  popClose(); const p = document.createElement('div'); p.className = 'md-pop'; p.setAttribute('role','menu'); p.innerHTML = html; document.body.appendChild(p);
  const r = anchor.getBoundingClientRect(), w = p.offsetWidth, h = p.offsetHeight;
  p.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
  let top = r.bottom + 4; if (top + h > innerHeight - 8) top = Math.max(8, r.top - h - 4); p.style.top = top + 'px';
  p.addEventListener('click', e => { const b = e.target.closest('[data-pk]'); if (b && onPick){ const v = b.dataset.pk; popClose(); onPick(v, b); } });
  popEl = p; setTimeout(() => document.addEventListener('pointerdown', popOutside, true), 0); return p;
};
document.addEventListener('keydown', e => { if (e.key === 'Escape') popClose(); });
H.on('route', popClose);
const popItems = items => items.map(i => i.head ? `<h6>${E(i.head)}</h6>` : `<button type="button" class="md-pi${i.on ? ' on' : ''}" data-pk="${E(i.k)}">${i.html || E(i.label)}${i.on ? H.icon('check','md-pck') : ''}</button>`).join('');

/* remove a timeline entry we just logged (for Undo) */
const unlog = (c, e) => { if (!c || !e) return; const i = c.timeline.indexOf(e); if (i >= 0) c.timeline.splice(i, 1); };
H.mdUnlog = unlog;

/* ⏰ Otra hora: in 1 hour, tomorrow morning, next week. Undo for 5 s. */
const LATER = () => { const n = new Date(); const tm = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1, 9, 0).getTime();
  const nw = new Date(n.getFullYear(), n.getMonth(), n.getDate() + ((8 - n.getDay()) % 7 || 7), 9, 0).getTime();
  return [ { k:'1h', es:'En 1 hora', en:'In 1 hour', at: Date.now() + 36e5 }, { k:'tm', es:'Mañana en la mañana', en:'Tomorrow morning', at: tm }, { k:'nw', es:'La próxima semana', en:'Next week', at: nw } ]; };
H.mdLater = (id, anchor) => { const c = H.client(id); if (!c) return; const opts = LATER();
  const pick = k => { const o = opts.find(x => x.k === k); if (!o) return; let prevTask, prevSnooze, entry;
    H.undoable({ msg: T('Movido: ', 'Moved: ') + H.mdWhen(o.at),
      run: () => { prevTask = c.task ? { ...c.task } : null; prevSnooze = c.snoozeUntil;
        c.snoozeUntil = o.at; c.task = c.task ? { ...c.task, due:o.at } : { type:'call', text:{ es:'Llamar de seguimiento', en:'Follow-up call' }, due:o.at, by:H.me().id };
        entry = H.log(id, { type:'note', text:{ es:'Otra hora: ' + o.es.toLowerCase() + ' (' + new Date(o.at).toLocaleString('es-MX',{weekday:'short',hour:'numeric',minute:'2-digit'}) + ')', en:'Another time: ' + o.en.toLowerCase() + ' (' + new Date(o.at).toLocaleString('en-US',{weekday:'short',hour:'numeric',minute:'2-digit'}) + ')' } }); },
      undo: () => { c.task = prevTask; c.snoozeUntil = prevSnooze; unlog(c, entry); H.emit('client', c); } }); };
  if (!anchor) return H.sheet(`<h2>${T('Otra hora','Another time')}</h2><div class="md-sheetopts">${opts.map(o => `<button class="btn btn-block" type="button" data-lk="${o.k}">${T(o.es,o.en)} <span class="muted">· ${E(H.mdWhen(o.at))}</span></button>`).join('')}</div>`)
    .querySelectorAll('[data-lk]').forEach(b => b.onclick = () => { H.close(); pick(b.dataset.lk); });
  H.mdPop(anchor, `<h6>${T('¿Cuándo?','When?')}</h6>` + popItems(opts.map(o => ({ k:o.k, html:`<span>${T(o.es,o.en)}</span><small>${E(H.mdWhen(o.at))}</small>` }))), pick);
};

/* ✓ Ya no hace falta, with a one-tap reason. Undo for 5 s. */
H.mdReasons = [ { k:'applied', es:'Ya aplicó', en:'Already applied' }, { k:'never', es:'No contesta nunca', en:'Never answers' }, { k:'notint', es:'No le interesa', en:'Not interested' }, { k:'other', es:'Ya lo atiende otro', en:'Someone else has it' } ];
H.mdNotNeeded = (id, anchor) => { const c = H.client(id); if (!c) return;
  const pick = k => { const r = H.mdReasons.find(x => x.k === k); if (!r) return; let prevTask, prevDis, entry;
    H.undoable({ msg: T('Listo: ', 'Done: ') + T(r.es, r.en),
      run: () => { prevTask = c.task ? { ...c.task } : null; prevDis = c.dismissed; c.task = null; c.dismissed = { reason:k, at:Date.now(), by:H.me().id };
        entry = H.log(id, { type:'note', text:{ es:'Ya no hace falta: ' + r.es + (prevTask ? ' (' + prevTask.text.es + ')' : ''), en:'Not needed: ' + r.en + (prevTask ? ' (' + prevTask.text.en + ')' : '') } }); },
      undo: () => { c.task = prevTask; c.dismissed = prevDis; unlog(c, entry); H.emit('client', c); } }); };
  if (!anchor) return H.sheet(`<h2>${T('Ya no hace falta','Not needed')}</h2><p class="muted">${T('¿Por qué?','Why?')}</p><div class="md-sheetopts">${H.mdReasons.map(r => `<button class="btn btn-block" type="button" data-rk="${r.k}">${T(r.es,r.en)}</button>`).join('')}</div>`)
    .querySelectorAll('[data-rk]').forEach(b => b.onclick = () => { H.close(); pick(b.dataset.rk); });
  H.mdPop(anchor, `<h6>${T('¿Por qué ya no hace falta?','Why is it not needed?')}</h6>` + popItems(H.mdReasons.map(r => ({ k:r.k, label:T(r.es, r.en) }))), pick);
};

/* No califica reasons (Hub-only mark; FUB keeps the stage) */
H.mdNoCal = [ { k:'notint', es:'No le interesa', en:'Not interested' }, { k:'credit', es:'Crédito bajo', en:'Low credit' }, { k:'income', es:'Ingreso muy bajo, sin co-prestatario', en:'Income too low, no co-borrower' },
  { k:'docs', es:'No tiene documentos', en:'No documents' }, { k:'never', es:'No contesta nunca', en:'Never answers' }, { k:'later', es:'Quizás más adelante (2027)', en:'Maybe later (2027)' } ];
H.mdNoCalLabel = nc => { const r = nc && H.mdNoCal.find(x => x.k === nc.reason); return r ? T(r.es, r.en) : ''; };

/* ---------- lists ---------- */
const LISTS = [
  { k:'midia', es:'Mi Día', en:'Mi Día', icon:'calendar' }, { sep:true },
  { k:'new', es:'New Leads', en:'New Leads' }, { k:'leads', es:'Leads', en:'Leads' }, { k:'pond', es:'Pond de leads', en:'Leads pond' },
  { k:'hot', es:'Hot Prospect', en:'Hot Prospect' }, { k:'applied', es:'Applied', en:'Applied' }, { k:'showing', es:'Showing Homes', en:'Showing Homes' },
  { k:'uc', es:'Under Contract', en:'Under Contract' }, { k:'closed', es:'Closed', en:'Closed' }, { sep:true },
  { k:'credit', es:'Credit Repair', en:'Credit Repair' }, { k:'nocal', es:'No califica', en:"Can't help now" }, { sep:true },
  { k:'all', es:'Todos los contactos', en:'All contacts', icon:'users' } ];
const listOf = c => c.noCalifica ? 'nocal' : c.stage === 'Credit Repair' ? 'credit'
  : (c.stage === 'New Lead' || (c.returned && ['Lead','Nurture'].includes(c.stage))) ? 'new'
  : ['Lead','Nurture'].includes(c.stage) ? (c.encargado ? 'leads' : 'pond')
  : ({ 'Hot Prospect':'hot', 'Applied':'applied', 'Showing Homes':'showing', 'Under Contract':'uc', 'Closed':'closed' }[c.stage] || 'leads');
H.mdListOf = listOf;
const EMPTY = {
  midia:['¡Listo por hoy! No tiene llamadas, seguimientos ni respuestas pendientes.','All done for today! No calls, follow-ups or replies waiting.'],
  new:['No hay leads nuevos. Cuando llegue uno aparece aquí arriba.','No new leads. When one comes in it shows up here.'],
  leads:['No hay leads con encargado en esta lista.','No leads with someone in charge here.'],
  pond:['El pond está vacío: todos los leads tienen encargado.','The pond is empty: every lead has someone in charge.'],
  hot:['Nadie en Hot Prospect por ahora.','Nobody in Hot Prospect right now.'], applied:['Nadie ha aplicado todavía.','Nobody has applied yet.'],
  showing:['Nadie está viendo casas ahora.','Nobody is touring homes right now.'], uc:['No hay contratos abiertos.','No open contracts.'],
  closed:['Todavía no hay cierres.','No closings yet.'], credit:['Nadie en Credit Repair.','Nobody in Credit Repair.'],
  nocal:['Nadie marcado como No califica.','Nobody marked as can\'t help now.'], all:['No hay contactos.','No contacts.'] };

/* Mi Día: what *I* should do today */
const canPond = () => H.isOwner() || H.hasJob('screener') || H.hasJob('specialist');
function myDay(){
  const me = H.me().id, now = Date.now(), end = new Date(); end.setHours(23, 59, 59, 999);
  const out = [];
  H.clients.forEach(c => {
    if (c.noCalifica) return;
    const snoozed = c.snoozeUntil && c.snoozeUntil > now;
    const unread = c.thread.filter(m => m.unread && m.dir === 'in'); const lastIn = unread[unread.length - 1];
    const mine = c.encargado === me || (H.hasJob('showing') && c.team && c.team.showing === me && ['Showing Homes','Under Contract'].includes(c.stage));
    if (snoozed) return; /* ⏰ Otra hora hides the client from every group until then */
    if (lastIn && (mine || (!c.encargado && canPond())) && !(c.dismissed && c.dismissed.at > lastIn.at)) { out.push({ c, why:'reply', sec:0, at:lastIn.at, msg:lastIn }); return; }
    /* "Ya no hace falta" closes the current reminder; a new task (the shell then clears c.dismissed) or a new reply brings the client back */
    if (c.dismissed) return;
    if (c.returned && (!c.encargado || mine) && canPond()) { out.push({ c, why:'returned', sec:2, at:-c.returned }); return; }
    if (mine && ((c.task && c.task.due <= end.getTime()) || H.needsFollowUp(c))) { out.push({ c, why: c.task && c.task.due <= end.getTime() ? 'due' : 'followup', sec:1, at: c.task ? c.task.due : c.lastContact }); return; }
    if (c.stage === 'New Lead' && !c.encargado && canPond()) out.push({ c, why:'newpond', sec:2, at:c.created });
  });
  return out.sort((a, b) => a.sec - b.sec || (a.sec === 0 ? b.at - a.at : a.at - b.at));
}
const SECS = [ { es:'Le respondieron', en:'Replies waiting' }, { es:'Llamadas y seguimientos', en:'Calls and follow-ups' }, { es:'Leads nuevos y que volvieron', en:'New and returning leads' } ];
const WHY = { reply:['Respondió','Replied','blue'], due:['Para hoy','Due today',''], followup:['Necesita seguimiento','Needs follow-up','red'], newpond:['Sin encargado','Nobody in charge','warn'], returned:['Volvió','Came back','blue'] };

/* ---------- columns ---------- */
const COLS = [
  { k:'stage', es:'Etapa', en:'Stage', val: c => H.STAGES.indexOf(c.stage) },
  { k:'enc', es:'Encargado', en:'In charge', val: c => (H.user(c.encargado) || { name:'~' }).name },
  { k:'last', es:'Último contacto', en:'Last contact', val: c => c.lastContact },
  { k:'todo', es:'Qué hacer', en:'What to do', val: c => c.task ? c.task.due : 9e15, fixed:true },
  { k:'source', es:'Origen', en:'Source', val: c => c.source },
  { k:'app', es:'Actividad en la app', en:'App activity', val: c => c.app.account ? c.app.score : -1 } ];
const nameVal = c => H.name(c).toLowerCase();

/* ---------- state ---------- */
const S = { sort: H.store.get('md:sort', { k:'last', dir:-1 }), hide: H.store.get('md:hide', []), hideMid: H.store.get('md:hidemid', ['source','app']), f: Object.assign({ enc:[], src:[], tags:[], fu:false, app:false }, H.store.get('md:f', {})), q:'', sel:new Set(), filters:false, mdSort:null, list:null, root:null, phone:false };
const saveS = () => { H.store.set('md:sort', S.sort); H.store.set('md:hide', S.hide); H.store.set('md:hidemid', S.hideMid); H.store.set('md:f', S.f); };
/* Mi Día keeps its own column choice (Source and app activity hidden by default) */
const hidden = () => (S.list === 'midia' ? S.hideMid : S.hide).filter(k => k !== 'todo'); /* Qué hacer always shows */
const setHidden = v => { if (S.list === 'midia') S.hideMid = v; else S.hide = v; };
const fCount = () => S.f.enc.length + S.f.src.length + S.f.tags.length + (S.f.fu ? 1 : 0) + (S.f.app ? 1 : 0);
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function applyFilters(arr){
  const q = norm(S.q.trim()), d = q.replace(/\D/g, '');
  return arr.filter(c => {
    if (q && !(norm(H.name(c)).includes(q) || norm(c.email).includes(q) || (d.length >= 3 && c.phone.replace(/\D/g, '').includes(d)) || c.tags.some(t => norm(t).includes(q)))) return false;
    if (S.f.enc.length && !S.f.enc.includes(c.encargado || 'none')) return false;
    if (S.f.src.length && !S.f.src.includes(c.source)) return false;
    if (S.f.tags.length && !S.f.tags.some(t => c.tags.includes(t))) return false;
    if (S.f.fu && !H.needsFollowUp(c)) return false;
    if (S.f.app && !c.app.account) return false;
    return true; });
}
const cmp = (srt, a, b) => { const col = COLS.find(x => x.k === srt.k), v = col ? col.val : nameVal, x = v(a), y = v(b); return (x > y ? 1 : x < y ? -1 : 0) * srt.dir; };
function sorted(arr){
  return arr.slice().sort((a, b) => { if (S.list === 'new'){ const ra = a.returned ? 1 : 0, rb = b.returned ? 1 : 0; if (ra !== rb) return rb - ra; }
    return cmp(S.sort, a, b); }); }

/* ---------- cells ---------- */
const cut = (s, n) => s.length > n ? s.slice(0, n).replace(/\s+\S*$/, '') + '…' : s;
const appCell = c => c.app.account ? `<span class="md-score ${c.app.score >= 70 ? 'hi' : c.app.score >= 40 ? 'mid' : ''}" title="${T('Puntaje en la app','App score')}">${c.app.score}</span><span class="md-sub">${T('visto ','seen ')}${E(H.mdAgo(c.app.lastSeen))}</span>` : `<span class="md-sub">${T('Sin cuenta','No account')}</span>`;
const todoCell = (c, item) => { if (c.noCalifica) return `<span class="md-todo">${T('No califica: ','Can\'t help now: ')}${E(H.mdNoCalLabel(c.noCalifica))}</span>`;
  if (item && item.why === 'reply'){ const m = item.msg; return `<span class="md-todo">${T('Contestar: ','Reply: ')}<span class="chip ch-${m.ch}">${m.ch === 'app' ? 'App' : m.ch === 'lola' ? 'Lola' : T('Texto','Text')}</span> “${E(cut(T(m.text.es, m.text.en), 60))}”</span>`; }
  if (item && item.why === 'newpond') return `<span class="md-todo">${T('Primera llamada y elegir encargado','First call and pick who is in charge')}</span><span class="md-sub">${T('llegó ','came in ')}${E(H.mdAgo(c.created))}</span>`;
  if (item && item.why === 'returned') return `<span class="md-todo">${T('Volvió después de meses: llámele hoy','Came back after months: call today')}</span><span class="md-sub">${E(H.mdAgo(c.returned))}</span>`;
  const d = c.task ? H.mdDue(c.task.due) : { txt:'', late:false };
  return `<span class="md-todo${c.task ? '' : ' md-none'}">${E(H.whatToDo(c))}</span>${d.txt ? `<span class="md-sub${d.late ? ' md-red' : ''}">${E(d.txt)}</span>` : ''}`; };
const nameCell = (c, item) => `<span class="md-nm"><span class="md-ini">${E(H.initials(c))}</span><span class="md-nmt"><b>${E(H.name(c))}</b><span class="md-sub">${E(c.phone)}${c.returned && listOf(c) === 'new' ? ` <span class="chip blue md-chip">${T('Volvió','Came back')}</span>` : ''}${c.nameless ? ` <span class="chip warn md-chip">${T('Sin nombre','No name')}</span>` : ''}${item && ['reply','newpond','returned'].includes(item.why) && !(item.why === 'returned' && c.returned) ? ` <span class="chip ${WHY[item.why][2]} md-chip">${T(WHY[item.why][0], WHY[item.why][1])}</span>` : ''}</span></span></span>`;
const lastCell = c => `<span class="${H.needsFollowUp(c) ? 'md-red' : ''}">${E(H.mdAgo(c.lastContact))}</span>${H.needsFollowUp(c) ? `<span class="md-sub md-red">${T('necesita seguimiento','needs follow-up')}</span>` : ''}`;

function counts(){ const n = {}; LISTS.forEach(l => l.k && (n[l.k] = 0)); H.clients.forEach(c => { n[listOf(c)]++; n.all++; }); n.midia = myDay().length; return n; }
/* 📑 Fechas y firmas: each card has Hecho / Otra hora / Ya no hace falta with Undo.
   Shared with Cierres through H.dlAct (Builder D) once the Undo window passes; local state keeps Undo working and is the fallback. */
const dlLocal = {};
const DL_REASONS = [ { k:'solved', es:'Ya se resolvió', en:'Already sorted out' }, { k:'cancel', es:'Se canceló el contrato', en:'Contract was cancelled' }, { k:'other', es:'Lo atiende otro', en:'Someone else has it' }, { k:'wrong', es:'La fecha estaba mal', en:'The date was wrong' } ];
const dlHidden = x => { const s = dlLocal[x.key]; if (s) return s.state !== 'later' || s.until > Date.now(); return x.snoozed && x.at > Date.now(); };
function dlAction(key, act, opt, label){
  const prev = dlLocal[key];
  H.undoable({ msg: label, run: () => { dlLocal[key] = { state:act, until:opt.until, reason:opt.reason }; render(); },
    undo: () => { if (prev) dlLocal[key] = prev; else delete dlLocal[key]; render(); },
    commit: () => { if (typeof H.dlAct === 'function'){ try { H.dlAct(key, act, opt); delete dlLocal[key]; } catch(e){} } } });
}
function deadlineItems(){
  if (typeof H.deadlines !== 'function') return [];
  let d; try { d = H.deadlines() || []; } catch(e){ return []; }
  /* owner and TC see every contract date; everyone else sees the dates of their own clients */
  if (!H.isOwner() && !H.hasJob('tc')){ const me = H.me().id; d = d.filter(x => { const c = H.client(x.clientId); return c && (c.encargado === me || (c.team && Object.values(c.team).includes(me))); }); }
  return d.filter(x => !(x.key && dlHidden(x))).sort((a, b) => a.at - b.at);
}
function deadlinesHtml(){
  if (S.list !== 'midia') return '';
  const d = deadlineItems(); if (!d.length) return '';
  const now = Date.now(), K = { option:['Fin de opción','Option ends'], financing:['Financiamiento','Financing'], closing:['Cierre','Closing'], unsigned:['Sin firmar','Unsigned'] };
  return `<section class="md-dl" aria-label="${T('Fechas y firmas','Dates and signatures')}"><h3>📑 ${T('Fechas y firmas','Dates and signatures')} <span class="muted">${d.length}</span></h3><div class="md-dlrow">${d.map(x => { const c = H.client(x.clientId), past = x.at < now, k = K[x.kind] || [x.kind, x.kind];
    return `<div class="md-dli${past ? ' past' : ''}"><button type="button" class="md-dlo" data-open="${x.clientId}"><span class="md-dlk">${H.icon(x.kind === 'unsigned' ? 'sign' : x.kind === 'closing' ? 'key' : 'calendar')}${T(k[0], k[1])}</span><b>${E(c ? H.name(c) : '')}</b><span class="md-sub">${E(x.text ? T(x.text.es, x.text.en) : '')}</span><span class="md-dld">${past ? T('Pasó: ','Past: ') : ''}${E(H.fmt.dateLong(x.at))}</span></button>
      ${x.key ? `<span class="md-dla"><button type="button" class="md-dlb" data-dl="done" data-key="${E(x.key)}">${H.icon('check')}${T('Hecho','Done')}</button><button type="button" class="md-dlb" data-dl="later" data-key="${E(x.key)}">${H.icon('clock')}${T('Otra hora','Later')}</button><button type="button" class="md-dlb" data-dl="notneeded" data-key="${E(x.key)}">${H.icon('ban')}${T('Ya no hace falta','Not needed')}</button></span>` : ''}</div>`; }).join('')}</div></section>`;
}
function dlClick(b){
  const key = b.dataset.key, act = b.dataset.dl;
  if (act === 'done') return dlAction(key, 'done', {}, T('Hecho · ya no aparece en Fechas y firmas','Done · removed from Dates and signatures'));
  if (act === 'later') return H.mdPop(b, `<h6>${T('¿Cuándo se lo recuerdo?','When should it come back?')}</h6>` + popItems(LATER().map(o => ({ k:o.k, html:`<span>${T(o.es,o.en)}</span><small>${E(H.mdWhen(o.at))}</small>` }))), k => { const o = LATER().find(x => x.k === k); dlAction(key, 'later', { until:o.at }, T('Vuelve ','Back ') + H.mdWhen(o.at)); });
  return H.mdPop(b, `<h6>${T('¿Por qué ya no hace falta?','Why is it not needed?')}</h6>` + popItems(DL_REASONS.map(r => ({ k:r.k, label:T(r.es, r.en) }))), k => { const r = DL_REASONS.find(x => x.k === k); dlAction(key, 'notneeded', { reason:k }, T('Listo: ','Done: ') + T(r.es, r.en)); });
}

function bulkStage(btn){

function bulkEnc(btn){

}
function colsMenu(btn){
  const p = H.mdPop(btn, `<h6>${T('Columnas visibles','Visible columns')}</h6>` + COLS.map(c => c.fixed ? `<label class="md-pi md-ckrow md-fixed"><input type="checkbox" checked disabled> ${T(c.es, c.en)} <small>${T('siempre visible','always shown')}</small></label>` : `<label class="md-pi md-ckrow"><input type="checkbox" data-col="${c.k}" ${hidden().includes(c.k) ? '' : 'checked'}> ${T(c.es, c.en)}</label>`).join('') + (S.list === 'midia' ? `<p class="md-pnote">${T('Mi Día guarda sus propias columnas.','Mi Día keeps its own columns.')}</p>` : ''));
  p.addEventListener('change', e => { const k = e.target.dataset.col; if (!k || k === 'todo') return; setHidden(e.target.checked ? hidden().filter(x => x !== k) : [...hidden(), k]); saveS(); render(); });
}
function colMenu(btn, k){
  const col = COLS.find(c => c.k === k);
  H.mdPop(btn, `<h6>${T(col.es, col.en)}</h6>` + popItems([{ k:'asc', label:T('Ordenar de menor a mayor','Sort ascending') }, { k:'desc', label:T('Ordenar de mayor a menor','Sort descending') }, ...(col.fixed ? [] : [{ k:'hide', label:T('Ocultar columna','Hide column') }])]), v => {
    if (v === 'hide' && !col.fixed) setHidden([...hidden(), k]); else setSort(k, v === 'asc' ? 1 : -1); saveS(); render(); });
}
/* Mi Día keeps its groups; a column sort orders rows inside each group */
const setSort = (k, dir) => { if (S.list === 'midia') S.mdSort = { k, dir }; else S.sort = { k, dir }; };
const curSort = () => S.list === 'midia' ? S.mdSort : S.sort;

function onClick(e){
  const t = e.target;
  const li = t.closest('[data-list]'); if (li){ H.go('midia', li.dataset.list === 'midia' ? null : li.dataset.list); return; }
  const dlb = t.closest('[data-dl]'); if (dlb){ dlClick(dlb); return; }
  const op = t.closest('[data-open]'); if (op){ H.openClient(op.dataset.open); return; }
  const so = t.closest('[data-sort]'); if (so){ const k = so.dataset.sort, cs = curSort(); setSort(k, cs && cs.k === k ? -cs.dir : (['name','stage','enc','source','todo'].includes(k) ? 1 : -1)); saveS(); render(); return; }
  const cm = t.closest('[data-cmenu]'); if (cm){ colMenu(cm, cm.dataset.cmenu); return; }
  const fx = t.closest('[data-fx]'); if (fx){ const g = fx.dataset.fx; if (g === 'fu' || g === 'app') S.f[g] = false; else S.f[g] = S.f[g].filter(v => v !== fx.dataset.v); saveS(); render(); return; }
  const fc = t.closest('[data-f]'); if (fc){ const g = fc.dataset.f, v = fc.dataset.v; S.f[g] = S.f[g].includes(v) ? S.f[g].filter(x => x !== v) : [...S.f[g], v]; saveS(); render(); return; }
  const b = t.closest('[data-a]');
  if (b){ const a = b.dataset.a, id = Number(b.dataset.id);
    if (a === 'call') return callOne(id);
    if (a === 'text') return textOne(id);
    if (a === 'reply') return H.openClient(id);
    if (a === 'later') return H.mdLater(id, b);
    if (a === 'notneeded') return H.mdNotNeeded(id, b);
    if (a === 'filters'){ S.filters = !S.filters; return render(); }
    if (a === 'fclear'){ S.f = { enc:[], src:[], tags:[], fu:false, app:false }; saveS(); return render(); }
    if (a === 'fclearall'){ S.q = ''; S.f = { enc:[], src:[], tags:[], fu:false, app:false }; saveS(); return render(); }
    if (a === 'cols') return colsMenu(b);
    if (a === 'sortm'){ const cs = curSort() || {}; return H.mdPop(b, `<h6>${T('Ordenar por','Sort by')}</h6>` + popItems([{ k:'name', label:T('Nombre','Name') }, ...COLS].map(o => ({ k:o.k, label:o.label || T(o.es, o.en), on:cs.k === o.k }))), k => { setSort(k, cs.k === k ? -cs.dir : (['name','stage','enc','source','todo'].includes(k) ? 1 : -1)); saveS(); render(); }); }
    if (a === 'callall'){ const ids = rowsData().map(r => r.c.id); return H.callList ? H.callList(ids) : H.toast(T('Llamar en fila: en construcción','Calling a list: being built')); }
    if (a === 'bcall'){ const ids = [...S.sel]; return H.callList ? H.callList(ids) : H.toast(T('Llamar en fila: en construcción','Calling a list: being built')); }
    if (a === 'bstage') return bulkStage(b);
    if (a === 'benc') return bulkEnc(b);
    if (a === 'btag') return bulkTag(b);
    if (a === 'bnocal') return bulkNoCal(b);
    if (a === 'bclear'){ S.sel.clear(); return render(); }
    return; }
  if (t.closest('input,label,button,select,a')) return;
  const row = t.closest('[data-row]'); if (row) H.openClient(row.dataset.row);
}
function onChange(e){
  const t = e.target;
  if (t.id === 'mdSel'){ H.go('midia', t.value === 'midia' ? null : t.value); return; }
  if (t.dataset.sel){ const id = Number(t.dataset.sel); t.checked ? S.sel.add(id) : S.sel.delete(id); render(); return; }
  if (t.hasAttribute('data-selall')){ const ids = rowsData().map(r => r.c.id); t.checked ? ids.forEach(i => S.sel.add(i)) : S.sel.clear(); render(); return; }
  if (t.dataset.fb){ S.f[t.dataset.fb] = t.checked; saveS(); render(); }
}
function onInput(e){ if (e.target.id !== 'mdQ') return; S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = S.root.querySelector('#mdQ'); if (q){ q.focus(); try { q.setSelectionRange(pos, pos); } catch(x){} } }

/* re-render when any client changes (batched), only while this screen is open */
let raf = 0;
H.on('client', () => { if (!S.root || !S.root.isConnected) return; cancelAnimationFrame(raf); raf = requestAnimationFrame(render); });

H.register('midia', { render(root, param){
  const k = param && LISTS.some(l => l.k === param) ? param : 'midia';
  if (S.list !== k){ S.sel.clear(); S.q = ''; } S.list = k; S.root = root; S.filters = false;
  root.addEventListener('click', onClick); root.addEventListener('change', onChange); root.addEventListener('input', onInput);
  const onResize = () => { if (isPhone() !== S.phone || isCards() !== S.cards) render(); }; addEventListener('resize', onResize);
  render();
  return () => { removeEventListener('resize', onResize); popClose(); S.root = null; };
} });

}
</script>
<script>/* ---- cliente.js ---- */
{
/* Client profile (#cliente-<id>): FUB-like layout, encargado picker, phone screening, journey, composer, timeline. Prefix: cp- */
const T = H.t, E = H.esc, DAYMS = 864e5;
const st = { id:null, root:null, tab:'note', d:{}, attach:null, tl:'all', edit:false, docs:false, signed:false, hh:false, tx:{} };
const resetDraft = () => { st.d = { note:'', text:'', subj:'', body:'', out:'talked', cnote:'', ch:null }; st.attach = null; st.edit = false; st.hh = false; st.tx = {}; };
const pop = (a, html, fn) => H.mdPop ? H.mdPop(a, html, fn) : null;
const popItems = items => items.map(i => i.head ? `<h6>${E(i.head)}</h6>` : `<button type="button" class="md-pi${i.on ? ' on' : ''}" data-pk="${E(i.k)}">${i.html || E(i.label)}</button>`).join('');
const unlog = (c, e) => H.mdUnlog ? H.mdUnlog(c, e) : null;
const ago = ts => H.mdAgo ? H.mdAgo(ts) : H.fmt.ago(ts);
const jobName = j => T(H.JOBS[j].es, H.JOBS[j].en);
const fmtPhone = p => { const d = String(p || '').replace(/\D/g, '').replace(/^1(?=\d{10}$)/, ''); return d.length === 10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : null; };
const DOCS = {
  ssn:[['Identificación con foto','Photo ID'],['Talones de pago (30 días)','Pay stubs (30 days)'],['W-2 de 2024 y 2025','2024 and 2025 W-2s'],['Estados de cuenta (2 meses)','Bank statements (2 months)'],['Tarjeta del Seguro Social','Social Security card']],
  itin:[['Carta del ITIN','ITIN letter'],['Pasaporte vigente','Valid passport'],['Declaraciones de impuestos (2 años)','Tax returns (2 years)'],['Talones de pago o cartas de trabajo','Pay stubs or job letters'],['Estados de cuenta (2 meses)','Bank statements (2 months)'],['Comprobante de renta (12 meses)','Rent history (12 months)']],
  permit:[['Permiso de trabajo (EAD)','Work permit (EAD)'],['Identificación con foto','Photo ID'],['Talones de pago (30 días)','Pay stubs (30 days)'],['W-2 o declaraciones de impuestos','W-2s or tax returns'],['Estados de cuenta (2 meses)','Bank statements (2 months)']] };
const SIGNED = [['Contrato de compra (TREC 20-18)','Purchase contract (TREC 20-18)'],['Addendum de financiamiento','Financing addendum'],['Aviso sobre la propiedad del vendedor','Seller\'s disclosure'],['Recibo del depósito (earnest money)','Earnest money receipt']];
const docsDone = c => ({ 'New Lead':0, Lead:0, Nurture:0, 'Credit Repair':1, 'Hot Prospect':1, Applied:2 + (c.id % 2), 'Showing Homes':4, 'Under Contract':99, Closed:99 }[c.stage] || 0);
const NOTE_TPL = [
  ['Habló, busca casa','Talked, looking for a home','Habló conmigo. Busca casa en ___ de ___ recámaras. Presupuesto: ___.','Talked with me. Looking for a ___-bedroom home in ___. Budget: ___.'],
  ['No contestó, dejó mensaje','No answer, left a message','No contestó. Le dejé mensaje de voz y un texto.','No answer. Left a voicemail and a text.'],
  ['Mandó documentos','Sent documents','Mandó documentos: ___. Todavía falta: ___.','Sent documents: ___. Still missing: ___.'],
  ['Pidió llamar después','Asked to call later','Pidió que le llame después: ___ (día y hora).','Asked me to call later: ___ (day and time).'],
  ['No califica por ahora','Doesn\'t qualify for now','No califica por ahora porque ___. Volver a llamar en ___.','Doesn\'t qualify for now because ___. Call again in ___.'] ];
const OUT = [ ['talked','Habló','Talked','green'], ['noanswer','No contestó','No answer','warn'], ['voicemail','Dejó mensaje','Left voicemail',''], ['wrong','Número equivocado','Wrong number','red'] ];
const outLabel = k => { const o = OUT.find(x => x[0] === k); return o ? `<span class="chip ${o[3]}">${T(o[1], o[2])}</span>` : ''; };
const TAGS = ['FHA','Primera casa','Construcción nueva','ITIN','Co-prestatario','Inversionista','Dallas','Crédito','Efectivo','Habla inglés'];

/* ---------- encargado picker: suggestion on top (by job, never a named button) ---------- */
const suggest = c => { const pre = ['New Lead','Lead','Nurture','Hot Prospect'].includes(c.stage), job = pre ? 'screener' : 'specialist';
  const fromTeam = c.team && c.team[job] && H.hasJob(job, H.user(c.team[job])) ? c.team[job] : null;
  const u = H.user(fromTeam) || H.byJob(job)[0] || null;
  return { u, job, why: pre ? T('para leads que todavía no aplican','for leads who have not applied yet') : c.stage === 'Applied' ? T('ya aplicó: su especialista lo atiende','applied: their home specialist takes it') : T('su especialista en vivienda','their home specialist') }; };
H.pickEncargado = id => { const c = H.client(id); if (!c) return; const s = suggest(c);
  const row = (u, sub, extra = '') => `<button type="button" class="cp-pk${(u ? u.id : null) === c.encargado ? ' cur' : ''}" data-uid="${u ? u.id : 'none'}">${H.avatar(u)}<span class="cp-pkt"><b>${u ? E(u.name) : T('Nadie (Pond de leads)','Nobody (Leads pond)')}</b><small>${sub}</small></span>${extra}${(u ? u.id : null) === c.encargado ? `<em class="chip">${T('Ahora','Now')}</em>` : ''}</button>`;
  const others = H.team.filter(u => !s.u || u.id !== s.u.id);
  const sh = H.sheet(`<h2>${T('¿Quién se encarga de ','Who is in charge of ')}${E(H.name(c))}?</h2><p class="muted cp-sp">${T('Solo cambia en el Hub (no en Follow Up Boss). Todo el equipo lo sigue viendo.','Only changes in the Hub (not in Follow Up Boss). The whole team still sees this client.')}</p>
    ${s.u ? `<h6 class="cp-h6">${T('Sugerido','Suggested')} · ${jobName(s.job)} · ${s.why}</h6>${row(s.u, s.u.jobs.map(jobName).join(' · '), `<em class="chip blue">${T('Sugerido','Suggested')}</em>`)}` : ''}
    <h6 class="cp-h6">${T('Todo el equipo','Everyone on the team')}</h6>${others.map(u => row(u, u.jobs.map(jobName).join(' · '))).join('')}
    <h6 class="cp-h6">${T('Sin encargado','Nobody in charge')}</h6>${row(null, T('Vuelve al pond para que alguien lo tome','Goes back to the pond for someone to pick up'))}`);
  sh.querySelectorAll('[data-uid]').forEach(b => b.onclick = () => { const uid = b.dataset.uid === 'none' ? null : b.dataset.uid; H.close(); if (uid === c.encargado) return; let prev, e;
    H.undoable({ msg: T('Encargado: ','In charge: ') + (H.user(uid) ? H.user(uid).name : T('Nadie','Nobody')), run: () => { prev = H.setEncargado(id, uid); e = c.timeline[0]; }, undo: () => { c.encargado = prev; unlog(c, e); H.emit('client', c); } }); });
};

/* ---------- phone screening (while on a call) ---------- */
const PIF = (() => { const r = .0675 / 12; return r / (1 - Math.pow(1 + r, -360)); })();
const FACTOR = .965 * PIF + .0265 / 12 + .965 * .0055 / 12; /* FHA 3.5% down: principal+interest, taxes+insurance (2.65%), mortgage insurance */
H.cpPayment = price => Math.round(price * FACTOR);
H.cpVerdict = ({ inc, coInc, debts, budget, hasCo }) => {
  const hh = inc + (hasCo ? coInc : 0), annual = hh * 12, pay = H.cpPayment(budget || 0), dti = hh ? (debts + pay) / hh : 0;
  const maxPrice = Math.max(0, Math.floor((.45 * hh - debts) / FACTOR / 5000) * 5000);
  if (!inc && !(hasCo && coInc)) return { k:'none', annual, pay, dti, maxPrice };
  if (inc * 12 < 25000){ const coOk = hasCo && coInc * 12 >= 50000 && (debts + pay) / coInc <= .45;
    return { k:'no', annual, pay, dti, maxPrice, why: T('Con ese ingreso no llega a la meta del equipo ($50K al año).','With that income they do not reach the team goal ($50K a year).') + (coOk ? ' ' + T('El co-prestatario sí gana suficiente: hable con el prestamista para que él o ella sea quien aplica.','The co-borrower does earn enough: ask the lender about having them apply as the main borrower.') : '') }; }
  if (annual >= 50000 && dti <= .45) return { k:'good', annual, pay, dti, maxPrice, why: T('Llega a la meta: $50K+ al año y deudas + casa en ', 'Meets the goal: $50K+ a year and debts + house at ') + Math.round(dti * 100) + '%.' };
  const need = Math.max(50000 / 12 - hh, (debts + pay) / .45 - hh);
  if (!hasCo && inc * 12 >= 30000) return { k:'co', annual, pay, dti, maxPrice, need, why: T('Le faltan unos ','They are short about ') + H.fmt.price(Math.ceil(need / 50) * 50) + T(' al mes de ingreso. Con un co-prestatario, o con una casa de hasta ',' a month of income. With a co-borrower, or with a home up to ') + H.fmt.k(maxPrice) + T(', sí podría.',', they could.') };
  return { k:'no', annual, pay, dti, maxPrice, why: (annual < 50000 ? T('El ingreso del hogar no llega a $50K al año.','Household income is under $50K a year.') : T('Las deudas + la casa pasan del 45% del ingreso.','Debts + house are over 45% of income.')) + (maxPrice >= 120000 ? ' ' + T('Con una casa de hasta ','With a home up to ') + H.fmt.k(maxPrice) + T(' sí podría.',' they could.') : '') };
};
const VERD = { good:['Buen candidato','Good candidate','green'], co:['Necesita co-prestatario','Needs a co-borrower','warn'], no:['Todavía no','Not yet','red'], none:['Falta el ingreso','Income missing',''] };
H.screen = id => { const c = H.client(id); if (!c) return; const p = c.screen || {};
  const v = (x, d) => x != null ? x : d;
  const sh = H.sheet(`<h2>${T('Evaluación por teléfono','Phone screening')}</h2><p class="muted cp-sp">${E(H.name(c))} · ${T('llénela mientras habla con el cliente','fill it in while you talk with the client')}</p>
    <div class="cp-sc"><div class="cp-scf">
      <fieldset class="cp-fs"><legend>${T('Ingreso del cliente','Client income')}</legend><div class="cp-seg" role="radiogroup"><button type="button" data-mode="h" class="${v(p.mode,'m') === 'h' ? 'on' : ''}">${T('Por hora','Hourly')}</button><button type="button" data-mode="m" class="${v(p.mode,'m') === 'm' ? 'on' : ''}">${T('Al mes','Monthly')}</button></div>
        <div class="cp-row2 cp-mh"><div class="field"><label for="scH">${T('Pago por hora ($)','Pay per hour ($)')}</label><input id="scH" inputmode="decimal" value="${E(v(p.hourly, ''))}"></div><div class="field"><label for="scHr">${T('Horas por semana','Hours per week')}</label><input id="scHr" inputmode="decimal" value="${E(v(p.hours, 40))}"></div></div>
        <div class="field cp-mm"><label for="scM">${T('Ingreso al mes ($, antes de impuestos)','Monthly income ($, before taxes)')}</label><input id="scM" inputmode="decimal" value="${E(v(p.monthly, c.incomeMonthly || ''))}"></div></fieldset>
      <div class="field"><label for="scD">${T('Deudas al mes ($: carro, tarjetas, préstamos)','Monthly debts ($: car, cards, loans)')}</label><input id="scD" inputmode="decimal" value="${E(v(p.debts, c.debtsMonthly || 0))}"></div>
      <div class="cp-cob"><label class="cp-ck"><input type="checkbox" id="scCo" ${v(p.hasCo, !!c.coBorrower) ? 'checked' : ''}> ${T('Tiene co-prestatario (esposo/a, familiar)','Has a co-borrower (spouse, relative)')}</label>
        <div class="field cp-co"><label for="scCi">${T('Ingreso del co-prestatario al mes ($)','Co-borrower monthly income ($)')}</label><input id="scCi" inputmode="decimal" value="${E(v(p.coInc, (c.coBorrower && c.coBorrower.incomeMonthly) || ''))}"></div></div>
      <div class="cp-row2"><div class="field"><label for="scDoc">${T('Tipo de documento','Document type')}</label><select id="scDoc">${[['ssn','Seguro Social (SSN)','Social Security (SSN)'],['itin','ITIN','ITIN'],['permit','Permiso de trabajo','Work permit']].map(o => `<option value="${o[0]}" ${v(p.doc, c.docType) === o[0] ? 'selected' : ''}>${T(o[1], o[2])}</option>`).join('')}</select></div>
        <div class="field"><label for="scB">${T('Presupuesto de la casa ($)','Home budget ($)')}</label><input id="scB" inputmode="decimal" value="${E(v(p.budget, c.budget || 250000))}"></div></div>
      <div class="field"><label for="scW">${T('¿Dónde quiere comprar?','Where do they want to buy?')}</label><input id="scW" value="${E(v(p.where, (c.areas || []).join(', ')))}"></div>
    </div><aside class="cp-scv" id="scV" aria-live="polite"></aside></div>
    <label class="cp-ck cp-ntf"><input type="checkbox" id="scN" ${H.JOURNEY[0].notify ? 'checked' : ''}> ${T('Avisar al cliente en su app (“Evaluado por teléfono”)','Notify the client in their app (“Screened by phone”)')}</label>
    <div class="cp-acts"><button class="btn btn-pri" type="button" id="scSave">${H.icon('check')}${T('Guardar evaluación','Save screening')}</button><button class="btn btn-ghost" type="button" data-hclose>${T('Cancelar','Cancel')}</button></div>`, { wide:true });
  let mode = v(p.mode, 'm'); const q = s => sh.querySelector(s), num = s => Math.max(0, parseFloat(String(q(s).value).replace(/[^0-9.]/g, '')) || 0);
  const read = () => { const inc = mode === 'h' ? num('#scH') * num('#scHr') * 52 / 12 : num('#scM'), hasCo = q('#scCo').checked;
    return { mode, hourly:num('#scH'), hours:num('#scHr'), monthly:num('#scM'), inc:Math.round(inc), debts:num('#scD'), hasCo, coInc:hasCo ? num('#scCi') : 0, doc:q('#scDoc').value, budget:num('#scB'), where:q('#scW').value.trim() }; };
  const draw = () => { const r = read(), vd = H.cpVerdict(r), V = VERD[vd.k];
    sh.querySelector('.cp-mh').style.display = mode === 'h' ? '' : 'none'; sh.querySelector('.cp-mm').style.display = mode === 'm' ? '' : 'none'; sh.querySelector('.cp-co').style.display = r.hasCo ? '' : 'none';
    sh.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
    q('#scV').innerHTML = `<span class="cp-vl">${T('Resultado','Result')}</span><span class="chip ${V[2]} cp-vchip" data-verdict="${vd.k}">${T(V[0], V[1])}</span>
      <dl class="cp-vdl"><dt>${T('Ingreso del hogar','Household income')}</dt><dd>${H.fmt.price(vd.annual)} ${T('al año','a year')}<small>${H.fmt.price(r.inc + r.coInc)} ${T('al mes','a month')}</small></dd>
      <dt>${T('Pago estimado de la casa','Estimated house payment')}</dt><dd>${H.fmt.price(vd.pay)} ${T('al mes','a month')}<small>${T('casa de ','home of ')}${H.fmt.k(r.budget || 0)}, FHA</small></dd>
      <dt>${T('Deudas + casa','Debts + house')}</dt><dd class="${vd.dti > .45 ? 'cp-bad' : ''}">${r.inc + r.coInc ? Math.round(vd.dti * 100) + '%' : '—'}<small>${T('meta: 45% o menos','goal: 45% or less')}</small></dd></dl>
      <p class="cp-vwhy">${vd.why ? E(vd.why) : T('Escriba cuánto gana para ver el resultado.','Enter how much they earn to see the result.')}</p><p class="sample">${T('Meta del equipo: $50K+ al año y deudas + casa ≤ 45%. Es una guía; el prestamista decide.','Team goal: $50K+ a year and debts + house ≤ 45%. A guide only; the lender decides.')}</p>`; };
  sh.addEventListener('input', draw); sh.addEventListener('change', draw);
  sh.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { mode = b.dataset.mode; draw(); });
  draw();
  q('#scSave').onclick = () => { const r = read(), vd = H.cpVerdict(r), V = VERD[vd.k], notify = q('#scN').checked;
    c.screen = { ...r, verdict:vd.k, annual:vd.annual, dti:vd.dti, at:Date.now(), by:H.me().id };
    c.incomeMonthly = r.inc + r.coInc; c.debtsMonthly = r.debts; c.docType = r.doc; if (r.budget) c.budget = r.budget; if (r.where) c.areas = r.where.split(/\s*,\s*/).filter(Boolean);
    if (r.hasCo){ c.coBorrower = c.coBorrower || { name:'', rel:{ es:'co-prestatario', en:'co-borrower' }, phone:'' }; c.coBorrower.incomeMonthly = r.coInc; }
